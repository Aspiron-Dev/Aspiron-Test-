<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin · CBT Test Series</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=JSON.parse(localStorage.getItem('cbt_theme'));if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="config.js"></script>
</head>
<body>
<header class="hdr"><div class="hdr-in">
  <a class="brand" href="admin.html"><span class="logo"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg></span>Admin</a>
  <div class="sp"></div>
  <a class="btn ghost sm" href="index.html">Student site</a>
  <button class="iconbtn" id="thm" onclick="toggleTheme()"></button>
</div></header>
<main class="wrap" id="root"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="parser.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CFG=window.CBT_CONFIG||{};
const cloud=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_KEY);
const SUN='<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
function updTheme(){$('#thm').innerHTML=document.documentElement.dataset.theme==='dark'?SUN:MOON}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('cbt_theme',JSON.stringify(t))}catch(e){}updTheme()}
updTheme();
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let Q=[],tab='create',rows=[];

function gate(){
  if(CFG.ADMIN_PASS&&sessionStorage.getItem('adm')!==CFG.ADMIN_PASS){
    $('#root').innerHTML=`<div class="card login" style="max-width:380px;margin:8vh auto 0"><h2>Admin access</h2><p class="mut sm">Enter the admin passcode.</p>
    <input type="password" id="pw" placeholder="Passcode" onkeydown="if(event.key==='Enter')unlock()"><button class="btn block" style="margin-top:12px" onclick="unlock()">Unlock</button></div>`;
    return;
  }
  shell();
}
function unlock(){if($('#pw').value===CFG.ADMIN_PASS){sessionStorage.setItem('adm',CFG.ADMIN_PASS);shell()}else $('#pw').style.borderColor='var(--bad)'}
function shell(){
  $('#root').innerHTML=`<div class="seg"><button id="t1" onclick="setTab('create')">Create test</button><button id="t2" onclick="setTab('results')">Student results</button></div><div id="pane" style="margin-top:16px"></div>`;
  setTab(tab);
}
function setTab(t){
  tab=t;$('#t1').classList.toggle('on',t==='create');$('#t2').classList.toggle('on',t==='results');
  t==='create'?createView():resultsView();
}

/* ---------- create ---------- */
function createView(){
  $('#pane').innerHTML=`
  <div class="card"><h3>1. Upload question paper PDF</h3>
  <p class="mut sm" style="margin:4px 0 12px">The PDF is read inside your browser and is not uploaded anywhere. It must be a typed PDF (not a scanned photo).</p>
  <input type="file" id="pdf" accept="application/pdf"><p class="mut sm" id="st"></p>
  <label class="l">Extracted text (you can fix it or paste text directly)</label><textarea id="raw" style="min-height:140px"></textarea>
  <label class="l">Answer key PDF (only if the key is a separate PDF)</label>
  <input type="file" id="kpdf" accept="application/pdf"><p class="mut sm" id="kst"></p>
  <label class="l">Answer key text (filled automatically from the key PDF, or paste it here) e.g. 1. B &nbsp; 2. D &nbsp; 3. A</label><textarea id="key"></textarea>
  <button class="btn" style="margin-top:12px" onclick="doParse()">2. Build questions</button></div>
  <div class="card" style="margin-top:14px"><h3>Test details</h3><div class="g2">
   <div><label class="l">Test name</label><input type="text" id="title" placeholder="NEET Mock Test 1"></div>
   <div><label class="l">Duration (min)</label><input type="number" id="dur" value="180"></div>
   <div><label class="l">Marks per correct</label><input type="number" id="pm" value="4"></div>
   <div><label class="l">Negative marks</label><input type="number" id="nm" value="1"></div></div>
   <label class="row" style="margin-top:14px"><input type="checkbox" id="lock" style="width:20px;height:20px"> Don't allow going back to previous questions</label></div>
  <div id="sum" class="mut" style="margin:16px 0 8px;font-weight:600"></div><div id="list"></div>
  <div class="card" id="outbox" style="display:none;margin-top:14px"><h3>3. Download &amp; publish</h3>
   <p class="mut sm" style="margin:4px 0 12px">Download both files and upload them to your GitHub repository (Add file → Upload files). Old tests are kept automatically.</p>
   <div class="row"><button class="btn" onclick="dlTest()">Download test file</button><button class="btn soft" onclick="dlIndex()">Download index.json</button></div></div>`;
  if(Q.length)render();
}
async function pdfText(f,spaced,note){
  if(!window.pdfjsLib)throw new Error('PDF reader could not load. Check your internet and reload.');
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  let out='';
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    let last=null,cur='',lines=[];
    for(const it of tc.items){
      const y=Math.round(it.transform[5]);
      if(last!==null&&Math.abs(y-last)>3){lines.push(cur);cur=''}
      cur+=it.str+(spaced?' ':'');last=y;
    }
    lines.push(cur);out+=lines.join('\n')+'\n';
    note.textContent=`Reading page ${p} of ${pdf.numPages}…`;
  }
  return out;
}
document.addEventListener('change',async e=>{
  const id=e.target.id;
  if(id!=='pdf'&&id!=='kpdf')return;
  const f=e.target.files[0];if(!f)return;
  const note=$(id==='pdf'?'#st':'#kst');
  note.textContent='Reading PDF…';
  try{
    if(id==='pdf'){
      $('#raw').value=await pdfText(f,false,note);
      if(!$('#title').value)$('#title').value=f.name.replace(/\.pdf$/i,'');
      note.textContent='Done. If the text looks empty or garbled, the PDF is probably a scanned image.';
    }else{
      $('#key').value=await pdfText(f,true,note);
      const n=CBTParser.parseKey($('#key').value).count;
      note.textContent=n?`Done. Found ${n} answers in the key.`:'No answers found. This PDF may be a scanned image, or paste the key text below.';
    }
    if($('#raw').value.trim())doParse();
  }catch(err){note.textContent='Could not read this PDF: '+err.message}
});
function doParse(){
  const r=CBTParser.parse($('#raw').value,$('#key').value);
  Q=r.questions;
  $('#sum').textContent=`${Q.length} questions found · ${r.keyFound} answers found`;
  render();
}
function render(){
  const bad=q=>q.answer==null||q.options.some(o=>!o)||!q.q;
  const nb=Q.filter(bad).length;
  if($('#sum'))$('#sum').innerHTML=`${Q.length} questions · ${nb?`<span style="color:var(--bad)">${nb} need attention</span>`:'<span style="color:var(--ok)">all look complete</span>'}`;
  $('#list').innerHTML=Q.map((q,i)=>`<div class="card qed ${bad(q)?'miss':''}" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>Question ${i+1}</b>${bad(q)?'<span class="chip" style="background:var(--badSoft);color:var(--bad)">Check this</span>':''}
    <button class="btn danger sm" onclick="del(${i})">Delete</button></div>
    <textarea oninput="Q[${i}].q=this.value" style="margin-top:8px">${esc(q.q)}</textarea>
    ${q.options.map((o,j)=>`<label class="l">Option ${'ABCD'[j]}</label><input type="text" value="${esc(o)}" oninput="Q[${i}].options[${j}]=this.value">`).join('')}
    <label class="l">Correct answer</label><select onchange="Q[${i}].answer=this.value===''?null:+this.value;render()"><option value="">Select…</option>${[0,1,2,3].map(j=>`<option value="${j}" ${q.answer===j?'selected':''}>${'ABCD'[j]}</option>`).join('')}</select>
    <label class="l">Explanation (optional)</label><input type="text" value="${esc(q.explanation)}" oninput="Q[${i}].explanation=this.value"></div>`).join('')+`<button class="btn soft" onclick="addQ()">+ Add a question</button>`;
  $('#outbox').style.display=Q.length?'block':'none';
}
function del(i){Q.splice(i,1);render()}
function addQ(){Q.push({q:'',options:['','','',''],answer:null,explanation:''});render()}
const slug=()=>($('#title').value||'test').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'test';
const testObj=()=>({id:slug(),title:$('#title').value||'Test',duration:+$('#dur').value||180,correct:+$('#pm').value,wrong:+$('#nm').value,lockBack:$('#lock').checked,questions:Q});
function dl(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function check(){const n=Q.filter(q=>q.answer==null||q.options.some(o=>!o)||!q.q).length;return !n||confirm(n+' questions are incomplete. Download anyway?')}
function dlTest(){if(check())dl(slug()+'.json',testObj())}
async function dlIndex(){
  let idx=[];
  try{const r=await fetch('index.json',{cache:'no-store'});if(r.ok)idx=await r.json()}catch(e){}
  const t=testObj();
  idx=idx.filter(x=>x.id!==t.id&&x.id!=='sample-test');
  idx.push({id:t.id,title:t.title,file:t.id+'.json',questions:t.questions.length,duration:t.duration});
  dl('index.json',idx);
}

/* ---------- results ---------- */
async function resultsView(){
  if(!cloud){$('#pane').innerHTML=`<div class="card empty"><b>Cloud storage is not connected yet.</b><p class="sm">Fill in config.js with your Supabase details to see all students' results here.</p></div>`;return}
  $('#pane').innerHTML='<div class="card empty">Loading results…</div>';
  try{
    const r=await fetch(CFG.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/attempts?select=*&order=created_at.desc&limit=2000',{headers:{apikey:CFG.SUPABASE_KEY,Authorization:'Bearer '+CFG.SUPABASE_KEY}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    rows=await r.json();
  }catch(e){$('#pane').innerHTML=`<div class="card empty">Could not load results (${esc(e.message)}). Check config.js and the Supabase table.</div>`;return}
  const names=[...new Set(rows.map(x=>x.test_title))];
  $('#pane').innerHTML=`<div class="row" style="margin-bottom:12px"><input type="search" id="q" placeholder="Search student or mobile" style="flex:1;min-width:180px" oninput="drawRows()"><select id="ft" style="max-width:240px" onchange="drawRows()"><option value="">All tests</option>${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select><button class="btn soft" onclick="csv()">Export CSV</button></div><div id="tb"></div>`;
  drawRows();
}
function filtered(){
  const q=($('#q').value||'').toLowerCase(),t=$('#ft').value;
  return rows.filter(x=>(!t||x.test_title===t)&&(!q||(x.name||'').toLowerCase().includes(q)||(x.student_id||'').includes(q)));
}
function drawRows(){
  const f=filtered();
  $('#tb').innerHTML=f.length?`<div class="card scroll" style="padding:0"><table class="tbl"><thead><tr><th>Student</th><th>Mobile</th><th>Test</th><th>Score</th><th>%</th><th>✓</th><th>✗</th><th>Skipped</th><th>Date</th></tr></thead><tbody>${f.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.student_id)}</td><td>${esc(x.test_title)}</td><td>${x.score}/${x.max_score}</td><td>${x.max_score?Math.max(0,Math.round(x.score*100/x.max_score)):0}%</td><td>${x.correct}</td><td>${x.wrong}</td><td>${x.skipped}</td><td>${new Date(x.created_at).toLocaleString('en-IN')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">No results found.</div>';
}
function csv(){
  const f=filtered();
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[['Name','Mobile','Test','Score','Max','Correct','Wrong','Skipped','Time(sec)','Date'].map(q).join(',')].concat(f.map(x=>[x.name,x.student_id,x.test_title,x.score,x.max_score,x.correct,x.wrong,x.skipped,x.used_seconds,new Date(x.created_at).toLocaleString('en-IN')].map(q).join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv'}));a.download='results.csv';document.body.appendChild(a);a.click();a.remove();
}
gate();
</script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="light" data-accent="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin · CBT Test Series</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=JSON.parse(localStorage.getItem('cbt_theme'));if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;var a=JSON.parse(localStorage.getItem('cbt_accent'));if(a)document.documentElement.dataset.accent=a}catch(e){}</script>
<script src="config.js"></script>
</head>
<body>
<header class="hdr"><div class="hdr-in">
  <a class="brand" href="admin.html"><span class="logo"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg></span>Admin</a>
  <div class="sp"></div>
  <button class="iconbtn" id="gear" aria-label="Settings" onclick="settings()" style="display:none"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
  <a class="btn ghost sm" href="index.html" style="text-decoration:none">Student site</a>
  <button class="iconbtn" id="thm" aria-label="Toggle theme" onclick="toggleTheme()"></button>
</div></header>
<main class="wrap" id="root"></main>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="parser.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG=window.CBT_CONFIG||{};
const API=String(CFG.SUPABASE_URL||'').replace(/\/$/,'');
const cloud=!!(API&&CFG.SUPABASE_KEY);
const SUN='<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
const CHEV='<svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const FOLDER='<svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>';
function updTheme(){$('#thm').innerHTML=document.documentElement.dataset.theme==='dark'?SUN:MOON}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('cbt_theme',JSON.stringify(t))}catch(e){}updTheme()}
updTheme();
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function modal(h,wide){$('#layer').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box${wide?' wide':''}">${h}</div></div>`}
function closeModal(){$('#layer').innerHTML=''}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Copied')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Copy failed')}ta.remove()}
}
function ago(ms){
  if(!ms)return 'never';
  const s=Math.floor((Date.now()-ms)/1000);
  if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';
  return Math.floor(s/86400)+' d ago';
}
const siteUrl=()=>location.href.replace(/[#?].*$/,'').replace(/admin\.html$/,'');

/* ---------- api ---------- */
let PW='';try{PW=sessionStorage.getItem('adm_pw')||''}catch(e){}
async function A(action,data){
  try{
    const r=await fetch(API+'/rest/v1/rpc/cbt_admin',{method:'POST',headers:{apikey:CFG.SUPABASE_KEY,Authorization:'Bearer '+CFG.SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_pw:PW,p_action:action,p_data:data||{}})});
    if(!r.ok)return{ok:false,error:'server'};
    const j=await r.json();
    if(!j.ok&&['invalid','locked','not_set'].includes(j.error))gate(j.error);
    return j;
  }catch(e){toast('No internet connection');return{ok:false,error:'network'}}
}

/* ---------- gate ---------- */
function gate(err){
  $('#gear').style.display='none';closeModal();
  if(!cloud){$('#root').innerHTML=`<div class="card empty"><b>Not connected.</b><p class="sm">Fill in config.js with your Supabase URL and key.</p></div>`;return}
  const msg=err==='invalid'?'Wrong password.':err==='locked'?'Too many wrong attempts. Try again in 15 minutes.':'';
  $('#root').innerHTML=`<div class="card login" style="max-width:400px;margin:6vh auto 0"><h2>Admin sign in</h2><p class="mut sm" style="margin:4px 0 0">Enter your admin password.</p>
   ${err==='not_set'?`<div class="banner"><div class="t sm"><b>Admin password is not set yet.</b><br>In Supabase open <b>SQL Editor → New query</b>, type <b>select cbt_private.set_admin_password('your-password');</b> with your own password (min 8 characters), and press Run.</div></div>`:''}
   <label class="l">Password</label><input type="password" id="pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')unlock()">
   <div class="sm err" style="min-height:22px;margin-top:6px">${msg}</div>
   <button class="btn block" onclick="unlock()">Sign in</button></div>`;
}
async function unlock(){
  PW=$('#pw').value;if(!PW)return;
  const r=await A('ping');
  if(r.ok){try{sessionStorage.setItem('adm_pw',PW)}catch(e){}shell()}
}

/* ---------- shell ---------- */
let ST=[],CA={series:[],folders:[],tests:[]},Q=[],EDIT=null,CUR='students',OPEN={},SF={q:'',s:'all'},RP=[],RF='open';
function shell(){
  $('#gear').style.display='';
  $('#root').innerHTML=`<div class="atabs">
    <button id="tb_students" onclick="tab('students')">Students <span class="cnt" id="pc" style="display:none"></span></button>
    <button id="tb_content" onclick="tab('content')">Series &amp; tests</button>
    <button id="tb_create" onclick="tab('create')">Create test</button>
    <button id="tb_results" onclick="tab('results')">Results</button>
    <button id="tb_reports" onclick="tab('reports')">Reports <span class="cnt" id="rc" style="display:none"></span></button></div>
   <div class="pane" id="pn_students"></div><div class="pane" id="pn_content"></div><div class="pane" id="pn_create"></div><div class="pane" id="pn_results"></div><div class="pane" id="pn_reports"></div>`;
  buildCreate();
  tab('students');
  A('reports').then(r=>{if(r.ok){RP=r.reports;repBadge()}});
}
async function tab(t){
  CUR=t;
  for(const k of ['students','content','create','results','reports']){$('#tb_'+k).classList.toggle('on',k===t);$('#pn_'+k).classList.toggle('on',k===t)}
  if(t==='students')await loadStudents();
  if(t==='content')await loadContent();
  if(t==='create'){await loadCatalog();syncSelects()}
  if(t==='results')await loadResults();
  if(t==='reports')await loadReports();
}
async function loadCatalog(){const r=await A('catalog');if(r.ok)CA={series:r.series,folders:r.folders,tests:r.tests};return r.ok}

/* ================= STUDENTS ================= */
async function loadStudents(){
  const [r]=await Promise.all([A('students'),loadCatalog()]);
  if(!r.ok)return;ST=r.students;renderStudents();
}
function badge(){
  const n=ST.filter(s=>s.status==='pending').length,e=$('#pc');
  if(e){e.style.display=n?'':'none';e.textContent=n}
}
function renderStudents(){
  badge();
  const pend=ST.filter(s=>s.status==='pending');
  const cnt={all:ST.length,approved:ST.filter(s=>s.status==='approved').length,blocked:ST.filter(s=>s.status==='blocked').length};
  $('#pn_students').innerHTML=`
   ${pend.length?`<div class="h2s" style="margin-top:0">Approval requests <span class="n">${pend.length}</span></div>${pend.map(s=>`<div class="card srow reqcard"><div class="av">${esc(s.name[0].toUpperCase())}</div><div class="grow"><b>${esc(s.name)}</b><span class="sm mut">${esc(s.mobile)} · requested ${ago(s.created)}</span></div>
     <button class="btn sm" onclick="approve('${s.id}')">Approve</button><button class="btn ghost sm" onclick="reject('${s.id}')">Reject</button></div>`).join('')}`:''}
   <div class="row" style="margin:${pend.length?'22px':'0'} 0 12px;gap:10px"><div style="flex:1;min-width:180px"><input type="search" id="sq" placeholder="Search name or mobile" value="${esc(SF.q)}" oninput="SF.q=this.value;drawList()"></div>
     <select id="ss" style="max-width:160px" onchange="SF.s=this.value;drawList()"><option value="all">All (${cnt.all})</option><option value="approved">Approved (${cnt.approved})</option><option value="blocked">Blocked (${cnt.blocked})</option></select>
     <button class="btn" onclick="addModal()">+ Add student</button></div>
   <div id="slist"></div>`;
  $('#ss').value=SF.s;drawList();
}
function drawList(){
  const q=SF.q.toLowerCase();
  const l=ST.filter(s=>s.status!=='pending'&&(SF.s==='all'||s.status===SF.s)&&(!q||s.name.toLowerCase().includes(q)||s.mobile.includes(q)));
  $('#slist').innerHTML=l.length?l.map(s=>`<div class="card srow"><div class="av">${esc(s.name[0].toUpperCase())}</div>
    <div class="grow"><b>${esc(s.name)}</b><span class="sm mut">${esc(s.mobile)} · ${s.devices}/${s.max_devices} devices · ${s.attempts} tests · seen ${ago(s.last_seen)}</span></div>
    ${s.status==='blocked'?'<span class="chip" style="background:var(--badSoft);color:var(--bad)">Blocked</span>':'<span class="chip ok">Active</span>'}
    <button class="btn ghost sm" onclick="manage('${s.id}')">Manage</button></div>`).join(''):`<div class="card empty">${ST.length?'No students match.':'No students yet. Add students or share the site link so they can request access.'}</div>`;
}
function codeMsg(name,mobile,code){
  return `Hi ${name}, your access to ${CFG.SITE_NAME||'the test series'} is approved.\n\nWebsite: ${siteUrl()}\nMobile: ${mobile}\nAccess code: ${code}\n\nPlease keep this code private. It works on up to 2 devices.`;
}
function showCode(name,mobile,code,title){
  const msg=codeMsg(name,mobile,code);
  window._cm=msg;
  const wa='https://wa.me/'+(mobile.length===10?'91':'')+mobile+'?text='+encodeURIComponent(msg);
  modal(`<h2>${esc(title||'Access code ready')}</h2><div class="sm mut">${esc(name)} · ${esc(mobile)}</div>
   <div class="big-code">${esc(code.slice(0,4)+'-'+code.slice(4))}</div>
   <p class="sm mut" style="margin:0 0 12px">Save or send this code now. For safety it is stored only in scrambled form, so it cannot be shown again. If it is lost, create a new code.</p>
   <div class="row"><a class="btn" style="flex:1;text-decoration:none" href="${wa}" target="_blank" rel="noopener">Send on WhatsApp</a><button class="btn soft" style="flex:1" onclick="copyText(window._cm)">Copy message</button></div>
   <button class="btn ghost block" style="margin-top:10px" onclick="closeModal()">Done</button>`);
}
async function approve(id){
  const r=await A('student_approve',{id});
  if(!r.ok){toast('Could not approve');return}
  await loadStudents();showCode(r.name,r.mobile,r.code,'Approved ✓');
}
async function reject(id){
  const s=ST.find(x=>x.id===id);if(!confirm(`Reject and remove the request from ${s.name}?`))return;
  const r=await A('student_delete',{id});if(r.ok){toast('Request removed');loadStudents()}
}
function addModal(){
  modal(`<h2>Add students</h2><div class="seg" style="margin:10px 0"><button id="am1" class="on" onclick="amTab(1)">One student</button><button id="am2" onclick="amTab(2)">Many at once</button></div>
   <div id="amb1"><label class="l">Full name</label><input type="text" id="an" placeholder="Rahul Sharma"><label class="l">Mobile number</label><input type="tel" id="ap" inputmode="numeric" placeholder="10-digit number">
   <div id="aer" class="sm err" style="min-height:22px;margin-top:6px"></div><button class="btn block" onclick="addOne()">Create &amp; get code</button></div>
   <div id="amb2" style="display:none"><label class="l">One student per line: name, mobile</label><textarea id="ab" class="mono" style="min-height:150px" placeholder="Rahul Sharma, 9876543210&#10;Priya Singh, 9123456780"></textarea>
   <button class="btn block" style="margin-top:10px" id="abtn" onclick="addBulk()">Create all &amp; get codes</button><div id="about"></div></div>`,true);
}
function amTab(n){$('#am1').classList.toggle('on',n===1);$('#am2').classList.toggle('on',n===2);$('#amb1').style.display=n===1?'':'none';$('#amb2').style.display=n===2?'':'none'}
async function addOne(){
  const name=$('#an').value.trim(),mobile=$('#ap').value.replace(/\D/g,'').slice(-10);
  const r=await A('student_add',{name,mobile});
  if(!r.ok){$('#aer').textContent=r.error==='exists'?'This mobile number already has an account. Use Manage → New access code.':r.error==='name'?'Please enter a name.':r.error==='mobile'?'Please enter a valid 10-digit mobile number.':'Could not add.';return}
  await loadStudents();showCode(r.name,r.mobile,r.code);
}
async function addBulk(){
  const lines=$('#ab').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!lines.length)return;
  $('#abtn').disabled=true;const out=[];
  for(let i=0;i<lines.length;i++){
    $('#abtn').textContent=`Creating ${i+1} of ${lines.length}…`;
    const m=lines[i].match(/(\+?\d[\d\s\-]{8,}\d)/);
    if(!m){out.push({line:lines[i],err:'no mobile number found'});continue}
    const mobile=m[1].replace(/\D/g,'').slice(-10);
    const name=lines[i].replace(m[1],'').replace(/^[\s,;:|\-–]+|[\s,;:|\-–]+$/g,'');
    const r=await A('student_add',{name,mobile});
    out.push(r.ok?{name:r.name,mobile:r.mobile,code:r.code}:{line:lines[i],err:r.error==='exists'?'already has an account':'invalid'});
  }
  await loadStudents();
  const good=out.filter(x=>x.code);
  window._bulk=good.map(x=>`${x.name} | ${x.mobile} | ${x.code.slice(0,4)}-${x.code.slice(4)}`).join('\n');
  $('#abtn').style.display='none';
  $('#about').innerHTML=`<p class="sm" style="margin:14px 0 6px"><b>${good.length}</b> created${out.length>good.length?`, <span class="err">${out.length-good.length} skipped</span>`:''}. Copy this list now, the codes cannot be shown again.</p>
   <div class="scroll"><table class="tbl"><tbody>${out.map(x=>x.code?`<tr><td>${esc(x.name)}</td><td>${esc(x.mobile)}</td><td><b>${x.code.slice(0,4)}-${x.code.slice(4)}</b></td></tr>`:`<tr><td colspan="3" class="err">${esc(x.line)}: ${esc(x.err)}</td></tr>`).join('')}</tbody></table></div>
   <button class="btn block" style="margin-top:12px" onclick="copyText(window._bulk)">Copy all codes</button>`;
}
function manage(id){
  const s=ST.find(x=>x.id===id);if(!s)return;
  const paid=CA.series.filter(x=>!x.is_free);
  modal(`<div class="row" style="justify-content:space-between"><h2>${esc(s.name)}</h2><button class="iconbtn" onclick="closeModal()" aria-label="Close">✕</button></div>
   <div class="sm mut">${esc(s.mobile)} · ${s.status==='blocked'?'Blocked':'Active'} · ${s.devices}/${s.max_devices} devices in use · ${s.attempts} tests taken</div>
   <div class="g2" style="margin-top:6px"><div><label class="l">Name</label><input type="text" id="mn" value="${esc(s.name)}"></div><div><label class="l">Max devices</label><input type="number" id="md" min="1" max="10" value="${s.max_devices}"></div></div>
   <button class="btn sm" style="margin-top:10px" onclick="saveStudent('${id}')">Save changes</button>
   <div class="h2s" style="margin-top:22px">Premium access</div>
   ${paid.length?paid.map(x=>`<label class="chk"><input type="checkbox" ${s.access.includes(x.id)?'checked':''} onchange="grant('${id}','${x.id}',this.checked)"><span><b>${esc(x.title)}</b> <span class="mut sm">${esc(x.price_label)}</span></span></label>`).join(''):'<p class="mut sm">No paid series yet. Create one in "Series &amp; tests".</p>'}
   <div class="h2s" style="margin-top:22px">Account</div>
   <div class="row"><button class="btn soft sm" onclick="newCode('${id}')">New access code</button><button class="btn soft sm" onclick="resetDev('${id}')">Reset devices</button>
   <button class="btn warn sm" onclick="blockToggle('${id}',${s.status==='blocked'?'false':'true'})">${s.status==='blocked'?'Unblock':'Block'}</button><button class="btn danger sm" onclick="delStudent('${id}')">Delete</button></div>`,true);
}
async function saveStudent(id){
  const r=await A('student_update',{id,name:$('#mn').value,max_devices:+$('#md').value||2});
  if(r.ok){toast('Saved');await loadStudents()}
}
async function grant(sid,ser,on){
  const r=await A('grant',{student_id:sid,series_id:ser,on});
  const s=ST.find(x=>x.id===sid);
  if(r.ok&&s){s.access=on?[...new Set([...s.access,ser])]:s.access.filter(x=>x!==ser);toast(on?'Access given':'Access removed')}
}
async function newCode(id){
  const s=ST.find(x=>x.id===id);
  if(!confirm(`Create a new access code for ${s.name}? The old code and all their devices will stop working.`))return;
  const r=await A('student_code',{id});if(!r.ok)return;
  await loadStudents();showCode(r.name,r.mobile,r.code,'New access code');
}
async function resetDev(id){const r=await A('student_devices_reset',{id});if(r.ok){toast('Devices reset');await loadStudents();manage(id)}}
async function blockToggle(id,b){const r=await A('student_block',{id,block:b});if(r.ok){toast(b?'Student blocked':'Student unblocked');await loadStudents();manage(id)}}
async function delStudent(id){
  const s=ST.find(x=>x.id===id);
  if(!confirm(`Delete ${s.name} permanently? Their results will be deleted too.`))return;
  const r=await A('student_delete',{id});if(r.ok){closeModal();toast('Student deleted');loadStudents()}
}

/* ================= CONTENT ================= */
async function loadContent(){if(await loadCatalog()){await renderContent();const u=await usageHtml();const e=$('#usebox');if(e)e.innerHTML=u}}
function seriesChips(s){
  return `${s.is_free?'<span class="chip ok">FREE</span>':`<span class="chip warn">PAID${s.price_label?' · '+esc(s.price_label):''}</span>`}${s.active?'':'<span class="chip">Hidden</span>'}`;
}
async function renderContent(){
  $('#pn_content').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:14px;gap:10px"><div><h2 style="font-size:20px">Series &amp; tests</h2><div class="mut sm">Series → folders → tests. Changes are live for students immediately.</div></div><button class="btn" onclick="seriesModal()">+ New series</button></div>`
   +'<div id="usebox"></div>'+(CA.series.length?CA.series.map(s=>{
      const folders=CA.folders.filter(f=>f.series_id===s.id),tests=CA.tests.filter(t=>t.series_id===s.id),root=tests.filter(t=>!t.folder_id);
      return `<div class="card acc ${OPEN[s.id]?'open':''}" id="acc_${s.id}" style="margin-bottom:12px"><div class="hd" onclick="toggleAcc('${s.id}')">${CHEV}<div class="grow"><b>${esc(s.title)}</b><div class="sm mut">${folders.length} folder${folders.length===1?'':'s'} · ${tests.length} test${tests.length===1?'':'s'}</div></div>${seriesChips(s)}</div>
       <div class="bd"><div class="row"><button class="btn ghost sm" onclick="seriesModal('${s.id}')">Edit series</button><button class="btn ghost sm" onclick="mediaModal('${s.id}')">Cover &amp; files${s.has_cover||(s.files||[]).length?' ✓':''}</button><button class="btn ghost sm" onclick="folderModal('${s.id}')">+ Folder</button><button class="btn sm" onclick="newTestIn('${s.id}')">+ New test</button></div>
       ${folders.map(f=>{const ft=tests.filter(t=>t.folder_id===f.id);return `<div class="fhead">${FOLDER}<span>${esc(f.title)}</span><span class="chip">${ft.length}</span>${f.active?'':'<span class="chip">Hidden</span>'}<span class="sp"></span><button class="btn ghost sm" onclick="folderModal('${s.id}','${f.id}')">Edit</button></div>${ft.map(testArow).join('')||'<div class="sm mut" style="padding:6px 2px">No tests in this folder.</div>'}`}).join('')}
       ${root.length?`<div class="fhead" style="color:var(--mut)">Tests without a folder</div>${root.map(testArow).join('')}`:''}
       ${!folders.length&&!root.length?'<div class="sm mut" style="padding:12px 2px">Nothing here yet. Add a folder or create a test.</div>':''}</div></div>`}).join('')
     :`<div class="card empty">No series yet. Create your first series, for example "NEET Test Series".</div>`);
}
function testArow(t){
  return `<div class="arow"><div class="grow"><b>${esc(t.title)}</b><div class="sm mut">${t.questions} questions · ${t.duration} min · +${t.correct}/−${t.wrong} · ${t.results} attempts</div>

/* ---- reading files ---- */
function loadScript(src,test){
  return new Promise((res,rej)=>{
    if(test())return res();
    const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load a helper library. Check your internet connection.'));document.head.appendChild(s);
  });
}
async function pdfOpen(buf){
  if(!window.pdfjsLib)throw new Error('PDF reader could not load. Check your internet and reload.');
  return pdfjsLib.getDocument({data:buf.slice(0)}).promise;
}
async function pdfText(pdf,spaced,note){
  let out='';
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    let last=null,cur='',lines=[];
    for(const it of tc.items){
      const y=Math.round(it.transform[5]);
      if(last!==null&&Math.abs(y-last)>3){lines.push(cur);cur=''}
      cur+=it.str+(spaced?' ':'');last=y;
    }
    lines.push(cur);out+=lines.join('\n')+'\n';
    note.textContent=`Reading page ${p} of ${pdf.numPages}…`;
  }
  return out;
}
async function ocrRun(count,getCanvas,note){
  await loadScript(TESS_URL,()=>window.Tesseract);
  note.textContent='Starting OCR (first time downloads the language data, please wait)…';
  const w=await Tesseract.createWorker($('#olang').value,1,{logger:m=>{if(m.status==='recognizing text'&&m.progress!=null)note.dataset.p=Math.round(m.progress*100)}});
  let out='';
  try{
    for(let i=1;i<=count;i++){
      note.textContent=`OCR: reading page ${i} of ${count}… ${note.dataset.p?note.dataset.p+'%':''}`;
      const c=await getCanvas(i);
      const r=await w.recognize(c);out+=r.data.text+'\n';
    }
  }finally{await w.terminate()}
  return out;
}
async function pdfOcr(pdf,note){
  return ocrRun(pdf.numPages,async i=>{
    const pg=await pdf.getPage(i),vp=pg.getViewport({scale:2.2}),c=document.createElement('canvas');
    c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c;
  },note);
}
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','−':'⁻','=':'⁼','(':'⁽',')':'⁾','n':'ⁿ','i':'ⁱ'};
const SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋','−':'₋','=':'₌','(':'₍',')':'₎','a':'ₐ','e':'ₑ','o':'ₒ','x':'ₓ','i':'ᵢ','n':'ₙ'};
const unxml=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
async function docxRead(f){
  await loadScript(JSZIP_URL,()=>window.JSZip);
  const z=await JSZip.loadAsync(await f.arrayBuffer());
  const df=z.file('word/document.xml');if(!df)throw new Error('This does not look like a Word (.docx) file. Old .doc files must be saved as .docx first.');
  const xml=await df.async('string');
  const rels={};const rf=z.file('word/_rels/document.xml.rels');
  if(rf)(await rf.async('string')).replace(/<Relationship\b[^>]*>/g,t=>{const id=(t.match(/\bId="([^"]+)"/)||[])[1],tg=(t.match(/\bTarget="([^"]+)"/)||[])[1];if(id&&tg)rels[id]=tg});
  const imgs=[],idx={};
  const paras=xml.match(/<w:p[ >][\s\S]*?<\/w:p>/g)||[];
  const lines=[];
  for(const p of paras){
    let line='',va='';
    const re=/<w:t(?:\s[^>]*)?>([^<]*)<\/w:t>|<m:t(?:\s[^>]*)?>([^<]*)<\/m:t>|<w:br\s*\/>|<w:tab\s*\/>|<a:blip\s[^>]*?r:embed="([^"]+)"|<v:imagedata\s[^>]*?r:id="([^"]+)"|<w:vertAlign\s+w:val="(superscript|subscript)"\s*\/>|<\/w:r>/g;
    let m;
    while((m=re.exec(p))){
      if(m[1]!=null||m[2]!=null){
        let t=unxml(m[1]!=null?m[1]:m[2]);
        if(va==='superscript')t=[...t].map(c=>SUP[c]||c).join('');
        else if(va==='subscript')t=[...t].map(c=>SUB[c]||c).join('');
        line+=t;
      }else if(m[0]==='</w:r>'){va=''}
      else if(m[5]){va=m[5]}
      else if(m[3]||m[4]){
        const tg=rels[m[3]||m[4]];
        if(tg&&/\.(png|jpe?g|gif|webp|bmp)$/i.test(tg)){
          const path=tg.startsWith('/')?tg.slice(1):'word/'+tg.replace(/^\.\//,'');
          if(!(path in idx)){
            const ze=z.file(path);
            if(ze){const ext=path.split('.').pop().toLowerCase();const mime=ext==='jpg'?'jpeg':ext;
              try{imgs.push('data:image/'+mime+';base64,'+await ze.async('base64'));idx[path]=imgs.length-1}catch(e){idx[path]=-1}}
            else idx[path]=-1;
          }
          if(idx[path]>=0)line+=` ⟦IMG:${idx[path]}⟧ `;
        }
      }
      else line+=' ';
    }
    lines.push(line);
  }
  return{text:lines.join('\n'),images:imgs};
}
async function readAny(f,note,isKey){
  const n=f.name.toLowerCase();
  if(n.endsWith('.pdf')||f.type==='application/pdf'){
    const buf=await f.arrayBuffer();
    if(!isKey)PDFBUF=buf;
    const pdf=await pdfOpen(buf);
    let t=await pdfText(pdf,isKey,note);
    const chars=t.replace(/\s/g,'').length;
    if(chars<40*pdf.numPages){
      if(confirm('This PDF looks like a scanned image (no typed text found). Read it with OCR? This is free but can take a few minutes.'))t=await pdfOcr(pdf,note);
    }else if(!isKey)$('#ocrbtn').style.display='';
    return{text:t};
  }
  if(n.endsWith('.docx'))return isKey?{text:(await docxRead(f)).text}:docxRead(f);
  if(n.endsWith('.doc'))throw new Error('Old .doc files are not supported. Open it in Word and "Save as" .docx, or save as PDF.');
  if(f.type.startsWith('image/')){
    const url=URL.createObjectURL(f);
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not open this image'));i.src=url});
    const scale=Math.min(2.5,2400/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=img.width*scale;c.height=img.height*scale;const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    return{text:await ocrRun(1,async()=>c,note)};
  }
  return{text:await f.text()};
}
async function forceOcr(){
  if(!PDFBUF)return;const note=$('#pst');
  try{note.textContent='Starting OCR…';const pdf=await pdfOpen(PDFBUF);$('#raw').value=await pdfOcr(pdf,note);note.textContent='OCR finished. OCR can make mistakes, so please check the questions below.';doParse()}
  catch(e){note.textContent='OCR failed: '+e.message}
}
document.addEventListener('change',async e=>{
  const id=e.target.id;
  if(id==='jf')return importJson(e.target.files[0]);
  if(id!=='paper'&&id!=='keyf')return;
  const f=e.target.files[0];if(!f)return;
  const note=$(id==='paper'?'#pst':'#kst');note.textContent='Reading file…';delete note.dataset.p;
  try{
    if(id==='paper'){
      PDFBUF=null;$('#ocrbtn').style.display='none';
      const r=await readAny(f,note,false);
      $('#raw').value=r.text;RAWIMG=r.images||[];
      if(!$('#title').value)$('#title').value=f.name.replace(/\.[a-z0-9]+$/i,'');
      note.textContent='Done. Please check the text below.';
    }else{
      const r=await readAny(f,note,true);
      $('#key').value=r.text.replace(/⟦IMG:\d+⟧/g,'');
      const n=CBTParser.parseKey($('#key').value).count;
      note.textContent=n?`Done. Found ${n} answers in the key.`:'No answers found. If this is a scan, try again with OCR or paste the key text.';
    }
    if($('#raw').value.trim())await doParse();
  }catch(err){note.textContent='Could not read this file: '+err.message}
  e.target.value='';
});
let RAWIMG=[];
async function importJson(f){
  if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    const qs=Array.isArray(j)?j:j.questions;
    if(!Array.isArray(qs)||!qs.length)throw new Error('no questions');
    Q=qs.map(normQ);S=deriveSections();
    if(!Array.isArray(j)){
      $('#title').value=j.title||'';if(j.duration)$('#dur').value=j.duration;
      if(j.correct!=null)$('#pm').value=j.correct;if(j.wrong!=null)$('#nm').value=j.wrong;$('#lock').checked=!!j.lockBack;
    }
    V={only:false,page:0};render();renderSecs();toast(Q.length+' questions imported');
  }catch(e){toast('Could not read this file')}
  $('#jf').value='';
}
async function doParse(){
  const r=CBTParser.parse($('#raw').value,$('#key').value);
  Q=r.questions.map(normQ);
  // images found inside a Word file
  if(RAWIMG.length){
    const cache={};
    const get=async k=>cache[k]||(cache[k]=await compressDataUrl(RAWIMG[k],900,.8));
    const take=async(txt)=>{const ks=[];const t=String(txt).replace(/⟦IMG:(\d+)⟧/g,(_,k)=>{ks.push(+k);return ' '}).replace(/[ \t]{2,}/g,' ').trim();return{t,img:ks.length?await get(ks[0]):null,n:ks.length}};
    let extra=0;
    for(const q of Q){
      const a=await take(q.q);q.q=a.t;if(a.img)q.img=a.img;extra+=Math.max(0,a.n-1);
      for(let j=0;j<4;j++){const o=await take(q.options[j]);q.options[j]=o.t;if(o.img)q.oimg[j]=o.img}
      const e=await take(q.explanation);q.explanation=e.t;if(e.img)q.eimg=e.img;
    }
    const total=Q.reduce((a,q)=>a+(q.img?1:0)+q.oimg.filter(Boolean).length,0);
    if(total)toast(total+' images picked up from the Word file');
    if(extra)toast(extra+' extra image(s) in questions were skipped; add them by hand');
  }
  S=deriveSections();V={only:false,page:0};render();renderSecs();
}

/* ---- images ---- */
function compressDataUrl(src,maxW,q){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      let w=im.naturalWidth,h=im.naturalHeight;const sc=Math.min(1,maxW/Math.max(w,1));w=Math.round(w*sc);h=Math.round(h*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);
      let out=c.toDataURL('image/jpeg',q||.8),qq=q||.8,mw=w;
      while(out.length>260000&&qq>.45){qq-=.1;out=c.toDataURL('image/jpeg',qq)}
      if(out.length>260000){const c2=document.createElement('canvas');c2.width=Math.round(w*.7);c2.height=Math.round(h*.7);c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);out=c2.toDataURL('image/jpeg',.6)}
      res(out);
    };
    im.onerror=()=>res(null);im.src=src;
  });
}
const fileToUrl=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej();r.readAsDataURL(f)});
const getImg=(q,t)=>t==='q'?q.img:t==='e'?q.eimg:q.oimg[t];
function setImg(q,t,v){if(t==='q')q.img=v;else if(t==='e')q.eimg=v;else q.oimg[t]=v}
async function pickImg(inp,i,t){
  const f=inp.files[0];if(!f)return;
  try{const d=await compressDataUrl(await fileToUrl(f),t==='q'||t==='e'?900:520,.8);if(!d)throw 0;setImg(Q[i],t,d);redrawCard(i)}catch(e){toast('Could not use this image')}
}
function rmImg(i,t){setImg(Q[i],t,null);redrawCard(i)}
function imgCtl(i,t,label){
  const v=getImg(Q[i],t);
  return `<div class="imgctl">${v?`<img src="${v}" class="thumb"><button class="btn ghost sm" onclick="rmImg(${i},${typeof t==='string'?`'${t}'`:t})">Remove image</button>`
   :`<label class="btn ghost sm" style="cursor:pointer">📷 ${label}<input type="file" accept="image/*" style="display:none" onchange="pickImg(this,${i},${typeof t==='string'?`'${t}'`:t})"></label>${PDFBUF?`<button class="btn soft sm" onclick="openCrop(${i},${typeof t==='string'?`'${t}'`:t})">✂ Crop from PDF</button>`:''}`}</div>`;
}

   <button class="btn soft sm" id="cmode" onclick="cropMode()">Mode: Select</button><select id="czoom" onchange="cropZoom()" style="width:auto"><option value="100">Fit</option><option value="160">Zoom 160%</option><option value="240">Zoom 240%</option></select></div>

async function cropDraw(){

function cropEvents(){
  const w=$('#crw'),c=$('#crc'),box=$('#crs');w.style.touchAction='none';let st=null;
  const pos=e=>{const r=c.getBoundingClientRect();return{x:Math.min(Math.max(e.clientX-r.left,0),r.width),y:Math.min(Math.max(e.clientY-r.top,0),r.height),r}};
  w.onpointerdown=e=>{if(!CR.mode)return;st=pos(e);w.setPointerCapture(e.pointerId);box.style.display='block'};
  w.onpointermove=e=>{if(!st)return;const p=pos(e),x=Math.min(st.x,p.x),y=Math.min(st.y,p.y);
    box.style.left=x+'px';box.style.top=y+'px';box.style.width=Math.abs(p.x-st.x)+'px';box.style.height=Math.abs(p.y-st.y)+'px';
    const k=c.width/p.r.width;CR.sel={x:x*k,y:y*k,w:Math.abs(p.x-st.x)*k,h:Math.abs(p.y-st.y)*k}};
  w.onpointerup=()=>{st=null};
}

function deriveSections(){
  const out=[];Q.forEach(q=>{const s=q.sec||'';const l=out[out.length-1];if(l&&l.name===s)l.count++;else out.push({name:s,count:1})});
  return out.some(x=>x.name)?out.map(x=>({name:x.name||'General',count:x.count})):[];
}

function clearSec(){S=[];Q.forEach(q=>q.sec='');renderSecs();render()}
function applySec(){
  if(!Q.length)return toast('Build the questions first');
  let i=0;
  for(const s of S){const n=Math.max(0,+s.count||0);for(let k=0;k<n&&i<Q.length;k++)Q[i++].sec=(s.name||'').trim()}

/* ---- question list ---- */
function problems(q){
  const p=[];
  if(q.gap&&!q.q&&!q.img)p.push('Question missing in the file');
  else if(!q.q.trim()&&!q.img)p.push('Question text is empty');
  q.options.forEach((o,j)=>{if(!o.trim()&&!q.oimg[j])p.push('Option '+'ABCD'[j]+' is empty')});
  if(q.answer==null)p.push('No correct answer set');
  return p;
}

const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(10))).map(b=>b.toString(16).padStart(2,'0')).join('');
const outQ=q=>({q:q.q,options:q.options,answer:q.answer,explanation:q.explanation,sec:q.sec||'',img:q.img||null,oimg:q.oimg,eimg:q.eimg||null});

function mediaModal(sid){
  const s=CA.series.find(x=>x.id===sid);if(!s)return;
  modal(`<div class="row" style="justify-content:space-between"><h2>${esc(s.title)}</h2><button class="iconbtn" onclick="closeModal()" aria-label="Close">✕</button></div>
   <div class="h2s" style="margin-top:14px">Cover photo</div>
   <p class="sm mut" style="margin:0 0 8px">Shown on the series card for students. A wide photo works best. It is compressed automatically.</p>
   <div class="row"><label class="btn soft" style="cursor:pointer">📷 ${s.has_cover?'Change photo':'Upload photo'}<input type="file" accept="image/*" style="display:none" onchange="uploadCover('${sid}',this)"></label>${s.has_cover?`<button class="btn ghost" onclick="removeCover('${sid}')">Remove</button><span class="chip ok">Cover set</span>`:''}</div>
   <div class="h2s" style="margin-top:22px">Syllabus / schedule files</div>
   <p class="sm mut" style="margin:0 0 8px">Upload a PDF or image (up to 6 MB). Students can open it from the series page.</p>
   ${(s.files||[]).map(f=>`<div class="arow"><div class="grow"><b>${esc(f.title)}</b><div class="sm mut">${esc(f.kind)} · ${(f.size/1024).toFixed(0)} KB</div></div><button class="btn danger sm" onclick="delFile('${sid}','${f.id}')">Delete</button></div>`).join('')}
   <label class="l">File name shown to students</label><input type="text" id="fti" placeholder="e.g. Full syllabus">
   <label class="l">Type</label><select id="fk"><option value="syllabus">Syllabus</option><option value="schedule">Schedule</option><option value="notes">Notes</option></select>
   <input type="file" id="ffile" accept="application/pdf,image/*" style="margin-top:10px"><div class="sm" id="fst" style="min-height:22px;margin-top:6px"></div>
   <button class="btn block" onclick="uploadFile('${sid}')">Upload file</button>`,true);
}
async function uploadCover(sid,inp){
  const f=inp.files[0];if(!f)return;
  try{
    const d=await compressDataUrl(await fileToUrl(f),900,.78);if(!d)throw new Error('image');
    const r=await A('series_cover',{id:sid,cover:d});if(!r.ok)throw new Error(r.error);
    toast('Cover saved');await loadCatalog();renderContent();mediaModal(sid);
  }catch(e){toast('Could not save the photo')}
}
async function removeCover(sid){const r=await A('series_cover',{id:sid,cover:''});if(r.ok){toast('Cover removed');await loadCatalog();renderContent();mediaModal(sid)}}
async function delFile(sid,id){
  if(!confirm('Delete this file?'))return;
  const r=await A('file_delete',{id});if(r.ok){await loadCatalog();renderContent();mediaModal(sid)}
}
async function uploadFile(sid){
  const f=$('#ffile').files[0],st=$('#fst');
  if(!f){st.textContent='Please choose a file.';return}
  if(f.size>6*1024*1024){st.textContent='This file is larger than 6 MB. Please compress it first.';return}
  const mime=f.type==='application/pdf'?'application/pdf':/^image\/(jpeg|png|webp)$/.test(f.type)?f.type:'';
  if(!mime){st.textContent='Only PDF, JPG, PNG or WebP files are allowed.';return}
  try{
    const b64=(await fileToUrl(f)).split(',')[1],CH=300000,n=Math.ceil(b64.length/CH);let id=null;
    for(let k=0;k<n;k++){
      st.textContent=`Uploading… ${Math.round(k*100/n)}%`;
      const r=await A('file_put',{id,series_id:sid,title:$('#fti').value||f.name.replace(/\.[a-z0-9]+$/i,''),kind:$('#fk').value,name:f.name,mime,size:f.size,n:k,data:b64.slice(k*CH,(k+1)*CH),last:k===n-1});
      if(!r.ok)throw new Error(r.error==='too_big'?'file too big':r.error);
      id=r.id;
    }
    toast('File uploaded');await loadCatalog();renderContent();mediaModal(sid);
  }catch(e){st.textContent='Upload failed: '+e.message}
}

/* ================= REPORTS ================= */
const RK={wrong_answer:'Answer looks wrong',wrong_question:'Question wrong / unclear',missing_option:'Option missing / incorrect',bad_image:'Image problem',other:'Other'};
function repBadge(){const n=RP.filter(x=>x.status==='open').length,e=$('#rc');if(e){e.style.display=n?'':'none';e.textContent=n}}
async function loadReports(){
  $('#pn_reports').innerHTML='<div class="card empty">Loading…</div>';
  const [r,b]=await Promise.all([A('reports'),A('bookmark_stats')]);if(!r.ok)return;
  RP=r.reports;repBadge();window.BMS=b.ok?b.items:[];drawReports();
}
function drawReports(){
  const l=RP.filter(x=>RF==='all'||x.status===RF);
  $('#pn_reports').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h2 style="font-size:20px">Student reports</h2><div class="mut sm">Problems students found in questions or answers.</div></div>
   <select id="rfs" style="max-width:170px" onchange="RF=this.value;drawReports()"><option value="open" ${RF==='open'?'selected':''}>Open (${RP.filter(x=>x.status==='open').length})</option><option value="resolved" ${RF==='resolved'?'selected':''}>Resolved</option><option value="rejected" ${RF==='rejected'?'selected':''}>Rejected</option><option value="all" ${RF==='all'?'selected':''}>All (${RP.length})</option></select></div>
   ${l.length?l.map(x=>`<div class="card" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>${esc(x.title)} · Q${x.qidx+1}</b><span class="chip ${x.status==='open'?'warn':x.status==='resolved'?'ok':''}">${x.status}</span></div>
     <div class="sm mut" style="margin:4px 0">${esc(x.student)} (${esc(x.mobile)}) · ${ago(x.at)} · <b style="color:var(--tx)">${RK[x.kind]||x.kind}</b></div>
     ${x.note?`<div class="exp" style="margin:6px 0">${esc(x.note)}</div>`:''}
     <div class="sm" style="margin:6px 0;white-space:pre-wrap">${esc(x.q)||'<i>(question has no text)</i>'}</div><div class="sm mut">Current answer key: <b>${x.answer==null?'not set':'ABCD'[x.answer]}</b></div>
     <div class="row" style="margin-top:10px">${x.test_id?`<button class="btn soft sm" onclick="editQuestions('${x.test_id}',${x.qidx})">Open question</button>`:''}
     ${x.status!=='resolved'?`<button class="btn sm" onclick="repSet('${x.id}','resolved')">Mark resolved</button>`:''}${x.status==='open'?`<button class="btn ghost sm" onclick="repSet('${x.id}','rejected')">Reject</button>`:''}<button class="btn ghost sm" onclick="repDel('${x.id}')">Delete</button></div></div>`).join('')
   :'<div class="card empty">No reports here.</div>'}
   <div class="h2s">Most bookmarked questions</div>
   ${(window.BMS||[]).length?`<div class="card">${BMS.map(x=>`<div class="rrow" style="padding:6px 0"><div class="chip pri" style="min-width:34px;justify-content:center">${x.count}★</div><div class="grow"><b>${esc(x.title)} · Q${x.qidx+1}</b><span class="sm mut" style="white-space:normal">${esc(x.q)||'(image question)'}</span><span class="sm mut">${esc((x.students||[]).join(', '))}</span></div>${x.test_id?`<button class="btn ghost sm" onclick="editQuestions('${x.test_id}',${x.qidx})">Open</button>`:''}</div>`).join('')}</div>`:'<div class="card empty">Nobody has bookmarked a question yet.</div>'}`;
}
async function repSet(id,status){const r=await A('report_status',{id,status});if(r.ok){const x=RP.find(y=>y.id===id);if(x)x.status=status;repBadge();drawReports()}}
async function repDel(id){if(!confirm('Delete this report?'))return;const r=await A('report_delete',{id});if(r.ok){RP=RP.filter(y=>y.id!==id);repBadge();drawReports()}}

/* ================= STORAGE METER ================= */
const mb=b=>b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(b>10485760?0:1)+' MB';
async function usageHtml(){
  const u=await A('usage');if(!u.ok)return '';
  const p=Math.min(100,Math.round(u.db_bytes*100/u.limit_bytes)),col=p>=85?'var(--bad)':p>=65?'var(--warn)':'var(--ok)';
  return `<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b>Storage used</b><span class="sm mut">${mb(u.db_bytes)} of 500 MB free limit</span></div>
   <div class="bar" style="margin:8px 0"><i style="width:${p}%;background:${col}"></i></div>
   <div class="sm mut">Tests ≈ ${mb(u.tests_bytes)} · Files ≈ ${mb(u.files_bytes)} · Covers ≈ ${mb(u.covers_bytes)} · Results ≈ ${mb(u.results_bytes)}<br>${u.students} students · ${u.tests} tests · ${u.results} results</div>
   ${p>=65?`<div class="sm" style="margin-top:8px;color:${col}"><b>Getting full.</b> Download Results CSV, then delete old results or tests you no longer need.</div>`:''}</div>`;
}

/* ================= SETTINGS ================= */
async function settings(){
  const us=await usageHtml();
  modal(`<div class="row" style="justify-content:space-between"><h2>Settings</h2><button class="iconbtn" onclick="closeModal()" aria-label="Close">✕</button></div>${us}
   <label class="l">Student website link</label><div class="row"><input type="text" readonly value="${esc(siteUrl())}" style="flex:1" onclick="this.select()"><button class="btn soft sm" onclick="copyText('${esc(siteUrl())}')">Copy</button></div>
   <div class="h2s" style="margin-top:22px">Change admin password</div>
   <label class="l">New password (min 8 characters)</label><input type="password" id="np" autocomplete="new-password">
   <div id="ner" class="sm err" style="min-height:22px;margin-top:6px"></div>
   <button class="btn block" onclick="changePw()">Change password</button>
   <button class="btn ghost block" style="margin-top:14px" onclick="signOutAdmin()">Sign out</button>`,true);
}
async function changePw(){
  const np=$('#np').value;if(np.length<8){$('#ner').textContent='Password must be at least 8 characters.';return}
  const r=await A('set_password',{new_pw:np});
  if(r.ok){PW=np;try{sessionStorage.setItem('adm_pw',np)}catch(e){}closeModal();toast('Password changed')}
  else $('#ner').textContent='Could not change the password.';
}
function signOutAdmin(){PW='';try{sessionStorage.removeItem('adm_pw')}catch(e){}closeModal();gate()}

/* ---------- boot ---------- */
(async function(){
  if(!cloud)return gate();
  if(!PW)return gate();
  const r=await A('ping');
  if(r.ok)shell();else if(!['invalid','locked','not_set'].includes(r.error))gate();
})();
</script>

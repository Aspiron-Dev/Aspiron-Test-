<!doctype html>
<html lang="en" data-theme="light" data-accent="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin · CBT Test Series</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f9;--surface:#ffffff;--surface2:#eef2f6;--tx:#0e1b26;--mut:#5a6b7b;--bd:#dfe6ed;
  --pri:#1d6fe8;--pri2:#10a37f;--priSoft:#e6f0fe;
  --ok:#12945f;--okSoft:#e3f6ec;--bad:#dc3a4f;--badSoft:#fdecee;--warn:#c9780a;--warnSoft:#fff3df;
  --shadow:0 1px 2px rgba(14,27,38,.05),0 8px 24px rgba(14,27,38,.07);
  --grad:linear-gradient(135deg,#1d6fe8 0%,#12a58a 100%);
  --glow:rgba(29,111,232,.30);
  --r:16px;
}
html[data-theme="dark"]{
  --bg:#0b1117;--surface:#131b23;--surface2:#1b2631;--tx:#e7eef5;--mut:#93a4b5;--bd:#26343f;
  --pri:#5aa2ff;--pri2:#34d3a4;--priSoft:#14283f;
  --ok:#4fd69a;--okSoft:#112d22;--bad:#ff7a8a;--badSoft:#35161c;--warn:#f5b84a;--warnSoft:#33260d;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);
  --grad:linear-gradient(135deg,#2b7be8 0%,#14b08f 100%);
  --glow:rgba(43,123,232,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:var(--pri)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.hdr-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:17px;text-decoration:none;color:var(--tx)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px var(--glow)}
.sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--surface);color:var(--tx);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:hover{border-color:var(--pri)}
.chip-user{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px;cursor:pointer;color:var(--tx)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
body.intest .hdr{display:none}

.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
h1,h2,h3{letter-spacing:-.02em;margin:0}
.mut{color:var(--mut)}
.sm{font-size:13px}

/* buttons */
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--grad);color:#fff;box-shadow:0 6px 16px var(--glow);transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.soft{background:var(--priSoft);color:var(--pri);box-shadow:none}
.btn.warn{background:var(--warnSoft);color:var(--warn);box-shadow:none}
.btn.danger{background:var(--bad);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* cards */
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:24px;position:relative;overflow:hidden;box-shadow:0 14px 40px var(--glow)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-size:24px}
.hero p{margin:6px 0 0;opacity:.88}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;opacity:.85}

.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;gap:2px;max-width:100%;overflow:auto}
.seg button{border:0;background:transparent;color:var(--mut);padding:8px 16px;border-radius:9px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:18px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{display:flex;flex-direction:column;gap:12px}
.tcard h3{font-size:17px}
.tico{width:42px;height:42px;border-radius:12px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);color:var(--mut);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.chip.ok{background:var(--okSoft);color:var(--ok)}
.chip.pri{background:var(--priSoft);color:var(--pri)}
.chip.warn{background:var(--warnSoft);color:var(--warn)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}

.rrow{display:flex;align-items:center;gap:14px}
.rrow+.rrow{margin-top:10px}
.mring{width:54px;height:54px;flex:none;position:relative}
.mring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700}
.rrow .grow{flex:1;min-width:0}
.rrow .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=search],textarea,select{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--surface);color:var(--tx);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
textarea{min-height:90px;resize:vertical}
label.l{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.login{max-width:440px;margin:6vh auto 0}
.login .logo{width:52px;height:52px;border-radius:16px;margin-bottom:14px}

/* instructions */
.ins{max-width:640px;margin:20px auto}
.ins ul{padding-left:0;list-style:none;margin:14px 0}
.ins li{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--bd)}
.ins li:last-child{border:0}
.ins li svg{color:var(--pri);margin-top:2px}

/* test */
.tbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 14px}
.tb-title{font-weight:700;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-l{min-width:0;flex:1}
.timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;background:var(--priSoft);color:var(--pri);padding:7px 12px;border-radius:12px}
.timer.low{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.progress{height:3px;background:var(--surface2)}
.progress i{display:block;height:100%;background:var(--grad);transition:width .25s}
.tlayout{max-width:1080px;margin:0 auto;padding:16px 14px 150px;display:grid;grid-template-columns:1fr;gap:14px}
.qcard{padding:20px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qtext{white-space:pre-wrap;font-size:18px;line-height:1.6;margin-bottom:18px;font-weight:500}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:10px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--pri)}
.opt .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--mut)}
.opt .t{white-space:pre-wrap;padding-top:3px}
.opt.sel{border-color:var(--pri);background:var(--priSoft)}
.opt.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.pal button{height:42px;border-radius:11px;border:1.5px solid var(--bd);background:var(--surface);color:var(--tx);font-weight:600;font-size:14px;padding:0}
.pal button.na{background:var(--badSoft);border-color:transparent;color:var(--bad)}
.pal button.ans{background:var(--okSoft);border-color:transparent;color:var(--ok)}
.pal button.mark{background:var(--priSoft);border-color:transparent;color:var(--pri)}
.pal button.mans{background:var(--priSoft);border-color:var(--ok);color:var(--ok)}
.pal button.cur{box-shadow:0 0 0 2.5px var(--pri)}
.pal button:disabled{opacity:.55}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:14px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.side{display:none}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.bbar .r{display:flex;gap:8px;max-width:1080px;margin:0 auto;width:100%}
.bbar .r>*{flex:1}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(5,8,20,.55);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet .in{background:var(--surface);width:100%;max-height:82vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.grab{width:42px;height:4px;border-radius:9px;background:var(--bd);margin:0 auto 14px}
@media(min-width:960px){
  .tlayout{grid-template-columns:1fr 320px;align-items:start}
  .side{display:block;position:sticky;top:76px}
  .only-m{display:none!important}
}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,20,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:20px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow);border:1px solid var(--bd)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.mgrid div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.mgrid b{display:block;font-size:20px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;box-shadow:var(--shadow)}

/* result */
.rhero{text-align:center;padding:24px}
.ring{width:150px;height:150px;margin:6px auto 10px;position:relative}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;letter-spacing:-.03em;display:block;line-height:1.1}
.s4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.s4 div{background:var(--surface2);border-radius:12px;padding:10px 4px}
.s4 b{display:block;font-size:19px}
.s4 span{font-size:12px;color:var(--mut)}
.rv{margin-bottom:12px}
.ro{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;margin-bottom:8px;white-space:pre-wrap}
.ro.c{border-color:var(--ok);background:var(--okSoft)}
.ro.w{border-color:var(--bad);background:var(--badSoft)}
.ro .k{font-weight:700;min-width:20px}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.tag.g{background:var(--ok);color:#fff}
.tag.r{background:var(--bad);color:#fff}
.exp{background:var(--warnSoft);color:var(--tx);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin-top:8px}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.lb:last-child{border:0}
.lb .n{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700}
.lb.me{color:var(--pri);font-weight:700}

/* admin */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tbl th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow:auto;border-radius:var(--r)}
.qed{border-left:4px solid var(--pri)}
.qed.miss{border-left-color:var(--bad)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}

/* ================= v3: series / folders / admin ================= */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.scard{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s}
.scard:active{transform:scale(.99)}
.cover{height:96px;padding:14px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;right:-30px;bottom:-56px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16)}
.cover .ico{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;position:relative;z-index:1}
.cover .ico svg{width:22px;height:22px}
.pill{position:relative;z-index:1;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;letter-spacing:.03em;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);color:#4338ca}
.pill.free{color:#15803d}
.pill.paid{color:#b45309}
.pill svg{width:13px;height:13px}
.scard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.scard h3{font-size:17px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:14px;flex-wrap:wrap}
.crumb a{color:var(--mut);font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.crumb a:hover{color:var(--pri)}
.sh{border-radius:22px;color:#fff;padding:22px;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(60,60,160,.25)}
.sh:after{content:"";position:absolute;right:-50px;top:-60px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.14)}
.sh h1{font-size:23px;position:relative;z-index:1}
.sh p{margin:6px 0 0;opacity:.9;position:relative;z-index:1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{display:flex;gap:12px;align-items:center;cursor:pointer;padding:14px;transition:transform .12s}
.fcard:active{transform:scale(.99)}
.fico{width:46px;height:46px;border-radius:13px;background:var(--warnSoft);color:var(--warn);display:grid;place-items:center;flex:none}
.fcard b{display:block;line-height:1.25}
.trow{display:flex;gap:12px;align-items:center;padding:14px 16px;flex-wrap:wrap}
.trow+.trow{margin-top:10px}
.trow .info{flex:1;min-width:190px}
.trow .info h3{font-size:16px;margin-bottom:6px}
.trow .acts{display:flex;gap:8px;flex-wrap:wrap}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warnSoft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:14px;padding:12px 14px;margin:16px 0}
.banner .t{flex:1;min-width:200px}
.lockbadge{display:inline-flex;align-items:center;gap:5px}
.loading{display:grid;place-items:center;min-height:55vh;text-align:center;color:var(--mut)}
.spin{width:34px;height:34px;border:3px solid var(--surface2);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--bad)}
.okc{color:var(--ok)}
.divider{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:16px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--bd)}
.big-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:34px;font-weight:800;letter-spacing:.14em;text-align:center;background:var(--surface2);border-radius:14px;padding:16px 8px;margin:12px 0;user-select:all;-webkit-user-select:all}
.intest .qcard{user-select:none;-webkit-user-select:none}
.h2s{font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.h2s .n{font-size:13px;font-weight:700;color:var(--mut)}

/* admin */
.atabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px}
.atabs button{border:0;background:var(--surface);color:var(--mut);padding:10px 16px;border-radius:12px;font-weight:700;white-space:nowrap;border:1px solid var(--bd)}
.atabs button.on{background:var(--grad);color:#fff;border-color:transparent}
.atabs .cnt{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px}
.pane{display:none;margin-top:16px}
.pane.on{display:block}
.srow{display:flex;gap:12px;align-items:center;padding:12px 14px}
.srow+.srow{margin-top:8px}
.srow .grow{flex:1;min-width:0}
.srow .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.reqcard{border:1.5px solid var(--warn);background:var(--warnSoft)}
.acc{padding:0;overflow:hidden}
.acc>.hd{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.acc>.hd .grow{flex:1;min-width:0}
.acc>.bd{display:none;border-top:1px solid var(--bd);padding:12px 16px 16px;background:var(--surface2)}
.acc.open>.bd{display:block}
.chev{transition:transform .2s}
.acc.open .chev{transform:rotate(90deg)}
.arow{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--bd);border-radius:12px;margin-top:8px;flex-wrap:wrap}
.arow .grow{flex:1;min-width:160px}
.fhead{display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:700}
.modal .box.wide{max-width:560px;max-height:90vh;overflow:auto}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0}
.chk input{width:20px;height:20px;flex:none}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.btn.sm svg,.btn svg{width:16px;height:16px}

/* ================= v4: CBT mode, dashboard, images ================= */
.cbtbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:2px solid var(--pri);display:flex;align-items:center;gap:10px;padding:8px 14px}
.cbtbar .cand{display:flex;align-items:center;gap:5px}
.stabs{display:flex;gap:4px;overflow:auto;background:var(--surface2);padding:6px 10px;border-bottom:1px solid var(--bd);position:sticky;top:56px;z-index:19}
.stabs button{border:1px solid var(--bd);background:var(--surface);color:var(--tx);padding:7px 16px;border-radius:8px;font-weight:700;font-size:13px;white-space:nowrap}
.stabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.stabs button:disabled{opacity:.5}
.bbar .r.nav .btn{flex:1}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG=window.CBT_CONFIG||{};
const API=String(CFG.SUPABASE_URL||'').replace(/\/$/,'');
const cloud=!!(API&&CFG.SUPABASE_KEY);
const SUN='<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
const CHEV='<svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const FOLDER='<svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>';
function updTheme(){$('#thm').innerHTML=document.documentElement.dataset.theme==='dark'?SUN:MOON}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('cbt_theme',JSON.stringify(t))}catch(e){}updTheme()}
updTheme();
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function modal(h,wide){$('#layer').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box${wide?' wide':''}">${h}</div></div>`}
function closeModal(){$('#layer').innerHTML=''}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Copied')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Copy failed')}ta.remove()}
}
function ago(ms){
  if(!ms)return 'never';
  const s=Math.floor((Date.now()-ms)/1000);
  if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';
  return Math.floor(s/86400)+' d ago';
}
const siteUrl=()=>location.href.replace(/[#?].*$/,'').replace(/admin\.html$/,'');

/* ---------- api ---------- */
let PW='';try{PW=sessionStorage.getItem('adm_pw')||''}catch(e){}
async function A(action,data){
  try{
    const r=await fetch(API+'/rest/v1/rpc/cbt_admin',{method:'POST',headers:{apikey:CFG.SUPABASE_KEY,Authorization:'Bearer '+CFG.SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_pw:PW,p_action:action,p_data:data||{}})});
    if(!r.ok)return{ok:false,error:'server'};
    const j=await r.json();
    if(!j.ok&&['invalid','locked','not_set'].includes(j.error))gate(j.error);
    return j;
  }catch(e){toast('No internet connection');return{ok:false,error:'network'}}
}

/* ---------- gate ---------- */
function gate(err){
  $('#gear').style.display='none';closeModal();
  if(!cloud){$('#root').innerHTML=`<div class="card empty"><b>Not connected.</b><p class="sm">Fill in config.js with your Supabase URL and key.</p></div>`;return}
  const msg=err==='invalid'?'Wrong password.':err==='locked'?'Too many wrong attempts. Try again in 15 minutes.':'';
  $('#root').innerHTML=`<div class="card login" style="max-width:400px;margin:6vh auto 0"><h2>Admin sign in</h2><p class="mut sm" style="margin:4px 0 0">Enter your admin password.</p>
   ${err==='not_set'?`<div class="banner"><div class="t sm"><b>Admin password is not set yet.</b><br>In Supabase open <b>SQL Editor → New query</b>, type <b>select cbt_private.set_admin_password('your-password');</b> with your own password (min 8 characters), and press Run.</div></div>`:''}
   <label class="l">Password</label><input type="password" id="pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')unlock()">
   <div class="sm err" style="min-height:22px;margin-top:6px">${msg}</div>
   <button class="btn block" onclick="unlock()">Sign in</button></div>`;
}
async function unlock(){
  PW=$('#pw').value;if(!PW)return;
  const r=await A('ping');
  if(r.ok){try{sessionStorage.setItem('adm_pw',PW)}catch(e){}shell()}
}

/* ---------- shell ---------- */
let ST=[],CA={series:[],folders:[],tests:[]},Q=[],EDIT=null,CUR='students',OPEN={},SF={q:'',s:'all'},RP=[],RF='open';
function shell(){
  $('#gear').style.display='';
  $('#root').innerHTML=`<div class="atabs">
    <button id="tb_students" onclick="tab('students')">Students <span class="cnt" id="pc" style="display:none"></span></button>
    <button id="tb_content" onclick="tab('content')">Series &amp; tests</button>
    <button id="tb_create" onclick="tab('create')">Create test</button>
    <button id="tb_results" onclick="tab('results')">Results</button>
    <button id="tb_reports" onclick="tab('reports')">Reports <span class="cnt" id="rc" style="display:none"></span></button></div>
   <div class="pane" id="pn_students"></div><div class="pane" id="pn_content"></div><div class="pane" id="pn_create"></div><div class="pane" id="pn_results"></div><div class="pane" id="pn_reports"></div>`;
  buildCreate();
  tab('students');
  A('reports').then(r=>{if(r.ok){RP=r.reports;repBadge()}});
}
async function tab(t){
  CUR=t;
  for(const k of ['students','content','create','results','reports']){$('#tb_'+k).classList.toggle('on',k===t);$('#pn_'+k).classList.toggle('on',k===t)}
  if(t==='students')await loadStudents();
  if(t==='content')await loadContent();
  if(t==='create'){await loadCatalog();syncSelects()}
  if(t==='results')await loadResults();
  if(t==='reports')await loadReports();
}
async function loadCatalog(){const r=await A('catalog');if(r.ok)CA={series:r.series,folders:r.folders,tests:r.tests};return r.ok}

/* ================= STUDENTS ================= */
async function loadStudents(){
  const [r]=await Promise.all([A('students'),loadCatalog()]);
  if(!r.ok)return;ST=r.students;renderStudents();
}
function badge(){
  const n=ST.filter(s=>s.status==='pending').length,e=$('#pc');
  if(e){e.style.display=n?'':'none';e.textContent=n}
}
function renderStudents(){
  badge();
  const pend=ST.filter(s=>s.status==='pending');

async function addBulk(){
  const lines=$('#ab').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!lines.length)return;
  $('#abtn').disabled=true;const out=[];
  for(let i=0;i<lines.length;i++){
    $('#abtn').textContent=`Creating ${i+1} of ${lines.length}…`;
    const m=lines[i].match(/(\+?\d[\d\s\-]{8,}\d)/);
    if(!m){out.push({line:lines[i],err:'no mobile number found'});continue}
    const mobile=m[1].replace(/\D/g,'').slice(-10);
    const name=lines[i].replace(m[1],'').replace(/^[\s,;:|\-–]+|[\s,;:|\-–]+$/g,'');
    const r=await A('student_add',{name,mobile});
    out.push(r.ok?{name:r.name,mobile:r.mobile,code:r.code}:{line:lines[i],err:r.error==='exists'?'already has an account':'invalid'});
  }
  await loadStudents();
  const good=out.filter(x=>x.code);
  window._bulk=good.map(x=>`${x.name} | ${x.mobile} | ${x.code.slice(0,4)}-${x.code.slice(4)}`).join('\n');
  $('#abtn').style.display='none';
  $('#about').innerHTML=`<p class="sm" style="margin:14px 0 6px"><b>${good.length}</b> created${out.length>good.length?`, <span class="err">${out.length-good.length} skipped</span>`:''}. Copy this list now, the codes cannot be shown again.</p>
   <div class="scroll"><table class="tbl"><tbody>${out.map(x=>x.code?`<tr><td>${esc(x.name)}</td><td>${esc(x.mobile)}</td><td><b>${x.code.slice(0,4)}-${x.code.slice(4)}</b></td></tr>`:`<tr><td colspan="3" class="err">${esc(x.line)}: ${esc(x.err)}</td></tr>`).join('')}</tbody></table></div>
   <button class="btn block" style="margin-top:12px" onclick="copyText(window._bulk)">Copy all codes</button>`;
}

function loadScript(src,test){
  return new Promise((res,rej)=>{
    if(test())return res();
    const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load a helper library. Check your internet connection.'));document.head.appendChild(s);

async function pdfOpen(buf){
  if(!window.pdfjsLib)throw new Error('PDF reader could not load. Check your internet and reload.');
  return pdfjsLib.getDocument({data:buf.slice(0)}).promise;
}
async function pdfText(pdf,spaced,note){
  let out='';
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    let last=null,cur='',lines=[];
    for(const it of tc.items){
      const y=Math.round(it.transform[5]);
      if(last!==null&&Math.abs(y-last)>3){lines.push(cur);cur=''}
      cur+=it.str+(spaced?' ':'');last=y;
    }
    lines.push(cur);out+=lines.join('\n')+'\n';
    note.textContent=`Reading page ${p} of ${pdf.numPages}…`;
  }
  return out;
}
async function ocrRun(count,getCanvas,note){
  await loadScript(TESS_URL,()=>window.Tesseract);
  note.textContent='Starting OCR (first time downloads the language data, please wait)…';
  const w=await Tesseract.createWorker($('#olang').value,1,{logger:m=>{if(m.status==='recognizing text'&&m.progress!=null)note.dataset.p=Math.round(m.progress*100)}});
  let out='';
  try{
    for(let i=1;i<=count;i++){
      note.textContent=`OCR: reading page ${i} of ${count}… ${note.dataset.p?note.dataset.p+'%':''}`;
      const c=await getCanvas(i);
      const r=await w.recognize(c);out+=r.data.text+'\n';
    }
  }finally{await w.terminate()}
  return out;
}
async function pdfOcr(pdf,note){
  return ocrRun(pdf.numPages,async i=>{
    const pg=await pdf.getPage(i),vp=pg.getViewport({scale:2.2}),c=document.createElement('canvas');
    c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c;
  },note);
}
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','−':'⁻','=':'⁼','(':'⁽',')':'⁾','n':'ⁿ','i':'ⁱ'};
const SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋','−':'₋','=':'₌','(':'₍',')':'₎','a':'ₐ','e':'ₑ','o':'ₒ','x':'ₓ','i':'ᵢ','n':'ₙ'};
const unxml=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
async function docxRead(f){
  await loadScript(JSZIP_URL,()=>window.JSZip);
  const z=await JSZip.loadAsync(await f.arrayBuffer());
  const df=z.file('word/document.xml');if(!df)throw new Error('This does not look like a Word (.docx) file. Old .doc files must be saved as .docx first.');
  const xml=await df.async('string');
  const rels={};const rf=z.file('word/_rels/document.xml.rels');
  if(rf)(await rf.async('string')).replace(/<Relationship\b[^>]*>/g,t=>{const id=(t.match(/\bId="([^"]+)"/)||[])[1],tg=(t.match(/\bTarget="([^"]+)"/)||[])[1];if(id&&tg)rels[id]=tg});
  const imgs=[],idx={};
  const paras=xml.match(/<w:p[ >][\s\S]*?<\/w:p>/g)||[];
  const lines=[];
  for(const p of paras){
    let line='',va='';
    const re=/<w:t(?:\s[^>]*)?>([^<]*)<\/w:t>|<m:t(?:\s[^>]*)?>([^<]*)<\/m:t>|<w:br\s*\/>|<w:tab\s*\/>|<a:blip\s[^>]*?r:embed="([^"]+)"|<v:imagedata\s[^>]*?r:id="([^"]+)"|<w:vertAlign\s+w:val="(superscript|subscript)"\s*\/>|<\/w:r>/g;
    let m;
    while((m=re.exec(p))){
      if(m[1]!=null||m[2]!=null){
        let t=unxml(m[1]!=null?m[1]:m[2]);
        if(va==='superscript')t=[...t].map(c=>SUP[c]||c).join('');
        else if(va==='subscript')t=[...t].map(c=>SUB[c]||c).join('');
        line+=t;
      }else if(m[0]==='</w:r>'){va=''}
      else if(m[5]){va=m[5]}
      else if(m[3]||m[4]){
        const tg=rels[m[3]||m[4]];
        if(tg&&/\.(png|jpe?g|gif|webp|bmp)$/i.test(tg)){
          const path=tg.startsWith('/')?tg.slice(1):'word/'+tg.replace(/^\.\//,'');
          if(!(path in idx)){
            const ze=z.file(path);
            if(ze){const ext=path.split('.').pop().toLowerCase();const mime=ext==='jpg'?'jpeg':ext;
              try{imgs.push('data:image/'+mime+';base64,'+await ze.async('base64'));idx[path]=imgs.length-1}catch(e){idx[path]=-1}}
            else idx[path]=-1;
          }
          if(idx[path]>=0)line+=` ⟦IMG:${idx[path]}⟧ `;
        }
      }
      else line+=' ';
    }
    lines.push(line);
  }
  return{text:lines.join('\n'),images:imgs};
}
async function readAny(f,note,isKey){
  const n=f.name.toLowerCase();
  if(n.endsWith('.pdf')||f.type==='application/pdf'){
    const buf=await f.arrayBuffer();
    if(!isKey)PDFBUF=buf;
    const pdf=await pdfOpen(buf);
    let t=await pdfText(pdf,isKey,note);
    const chars=t.replace(/\s/g,'').length;
    if(chars<40*pdf.numPages){
      if(confirm('This PDF looks like a scanned image (no typed text found). Read it with OCR? This is free but can take a few minutes.'))t=await pdfOcr(pdf,note);
    }else if(!isKey)$('#ocrbtn').style.display='';
    return{text:t};
  }
  if(n.endsWith('.docx'))return isKey?{text:(await docxRead(f)).text}:docxRead(f);
  if(n.endsWith('.doc'))throw new Error('Old .doc files are not supported. Open it in Word and "Save as" .docx, or save as PDF.');
  if(f.type.startsWith('image/')){
    const url=URL.createObjectURL(f);
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not open this image'));i.src=url});
    const scale=Math.min(2.5,2400/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=img.width*scale;c.height=img.height*scale;const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    return{text:await ocrRun(1,async()=>c,note)};
  }
  return{text:await f.text()};
}

function compressDataUrl(src,maxW,q){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      let w=im.naturalWidth,h=im.naturalHeight;const sc=Math.min(1,maxW/Math.max(w,1));w=Math.round(w*sc);h=Math.round(h*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);
      let out=c.toDataURL('image/jpeg',q||.8),qq=q||.8,mw=w;
      while(out.length>260000&&qq>.45){qq-=.1;out=c.toDataURL('image/jpeg',qq)}
      if(out.length>260000){const c2=document.createElement('canvas');c2.width=Math.round(w*.7);c2.height=Math.round(h*.7);c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);out=c2.toDataURL('image/jpeg',.6)}
      res(out);
    };
    im.onerror=()=>res(null);im.src=src;
  });
}

  $('#secs').innerHTML=S.length?S.map((s,i)=>`<div class="row" style="margin-bottom:8px"><input type="text" value="${esc(s.name)}" placeholder="Section name" style="flex:2;min-width:130px" oninput="S[${i}].name=this.value"><input type="number" min="0" value="${s.count}" style="flex:1;min-width:80px" oninput="S[${i}].count=+this.value;secSum()"><span class="sm mut">questions</span><button class="iconbtn sm" onclick="S.splice(${i},1);renderSecs()">✕</button></div>`).join('')
    +`<div class="sm mut" id="ssum">Total ${tot} of ${Q.length} questions</div>`:'<div class="sm mut">No sections. The test will show all questions together.</div>';
}
function secSum(){const e=$('#ssum');if(e)e.textContent=`Total ${S.reduce((a,x)=>a+(+x.count||0),0)} of ${Q.length} questions`}
function presetSec(k){S=k==='neet'?[{name:'Physics',count:45},{name:'Chemistry',count:45},{name:'Botany',count:45},{name:'Zoology',count:45}]:[{name:'Physics',count:30},{name:'Chemistry',count:30},{name:'Mathematics',count:30}];renderSecs()}
function addSec(){S.push({name:'',count:0});renderSecs()}
function clearSec(){S=[];Q.forEach(q=>q.sec='');renderSecs();render()}
function applySec(){
  if(!Q.length)return toast('Build the questions first');
  let i=0;
  for(const s of S){const n=Math.max(0,+s.count||0);for(let k=0;k<n&&i<Q.length;k++)Q[i++].sec=(s.name||'').trim()}
  if(i<Q.length){const last=S.length?(S[S.length-1].name||'').trim():'';for(;i<Q.length;i++)Q[i].sec=last}
  toast('Sections applied');render();
}

/* ---- question list ---- */
function problems(q){
  const p=[];
  if(q.gap&&!q.q&&!q.img)p.push('Question missing in the file');
  else if(!q.q.trim()&&!q.img)p.push('Question text is empty');
  q.options.forEach((o,j)=>{if(!o.trim()&&!q.oimg[j])p.push('Option '+'ABCD'[j]+' is empty')});
  if(q.answer==null)p.push('No correct answer set');
  return p;
}
const bad=q=>problems(q).length>0;
function summary(){
  const bl=[];Q.forEach((q,i)=>{if(bad(q))bl.push(i)});
  $('#sum').innerHTML=`${Q.length} questions · ${bl.length?`<span class="err">${bl.length} need attention</span>`:'<span class="okc">all look complete</span>'}`;
  $('#probs').innerHTML=bl.length?`<div class="card" style="border-color:var(--bad)"><div class="row" style="justify-content:space-between"><b>Questions with problems</b>
    <label class="chk" style="padding:0"><input type="checkbox" ${V.only?'checked':''} onchange="V.only=this.checked;V.page=0;render()"><span class="sm">Show only these</span></label></div>
    <div class="plist">${bl.map(i=>`<button class="pchip" onclick="jumpQ(${i})" title="${esc(problems(Q[i]).join(', '))}">Q${i+1}<small>${esc(problems(Q[i])[0].replace('Question ','').replace('is empty','empty').replace('No correct answer set','no answer'))}</small></button>`).join('')}</div></div>`:'';
}
function visible(){const a=[];Q.forEach((q,i)=>{if(!V.only||bad(q))a.push(i)});return a}
function cardHtml(i){
  const q=Q[i],pr=problems(q),names=S.map(s=>s.name||'General');
  return `<div class="card qed ${pr.length?'miss':''}" id="qc${i}" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>Question ${i+1}</b>
    <span class="row" style="gap:6px">${pr.map(p=>`<span class="chip" style="background:var(--badSoft);color:var(--bad)">${esc(p)}</span>`).join('')}<button class="btn danger sm" onclick="delQ(${i})">Delete</button></span></div>
    <textarea oninput="Q[${i}].q=this.value;touch(${i})" style="margin-top:8px">${esc(q.q)}</textarea>${imgCtl(i,'q','Add diagram')}
    ${q.options.map((o,j)=>`<label class="l">Option ${'ABCD'[j]}</label><input type="text" value="${esc(o)}" oninput="Q[${i}].options[${j}]=this.value;touch(${i})">${imgCtl(i,j,'Option image')}`).join('')}
    <div class="g2"><div><label class="l">Correct answer</label><select onchange="Q[${i}].answer=this.value===''?null:+this.value;touch(${i})"><option value="">Select…</option>${[0,1,2,3].map(j=>`<option value="${j}" ${q.answer===j?'selected':''}>${'ABCD'[j]}</option>`).join('')}</select></div>
    ${names.length?`<div><label class="l">Section</label><select onchange="Q[${i}].sec=this.value">${['',...names].map(n=>`<option value="${esc(n)}" ${(q.sec||'')===n?'selected':''}>${n||'—'}</option>`).join('')}</select></div>`:''}</div>
    <label class="l">Explanation (optional)</label><input type="text" value="${esc(q.explanation)}" oninput="Q[${i}].explanation=this.value">${imgCtl(i,'e','Explanation image')}</div>`;
}
function redrawCard(i){const e=$('#qc'+i);if(e){const t=document.createElement('div');t.innerHTML=cardHtml(i);e.replaceWith(t.firstElementChild)}summary()}
function touch(i){
  const e=$('#qc'+i);if(!e)return;const pr=problems(Q[i]);e.classList.toggle('miss',pr.length>0);
  const tags=e.querySelector('.row .row');if(tags){const btn=tags.querySelector('button');tags.innerHTML=pr.map(p=>`<span class="chip" style="background:var(--badSoft);color:var(--bad)">${esc(p)}</span>`).join('');tags.appendChild(btn)}
  summary();
}
function render(){
  summary();
  const vis=visible(),pages=Math.max(1,Math.ceil(vis.length/PAGE));if(V.page>=pages)V.page=pages-1;
  const sl=vis.slice(V.page*PAGE,V.page*PAGE+PAGE);
  const nav=pages>1?`<div class="row pnav" style="justify-content:center;margin:10px 0"><button class="btn ghost sm" ${V.page?'':'disabled'} onclick="V.page--;render();window.scrollTo(0,$('#sum').offsetTop)">‹ Prev</button><span class="sm">Page ${V.page+1} of ${pages} · ${vis.length} questions</span><button class="btn ghost sm" ${V.page<pages-1?'':'disabled'} onclick="V.page++;render();window.scrollTo(0,$('#sum').offsetTop)">Next ›</button></div>`:'';
  $('#list').innerHTML=nav+sl.map(cardHtml).join('')+nav+`<button class="btn soft" onclick="addQ()">+ Add a question</button>`;
  $('#outbox').style.display=Q.length?'block':'none';
}
function jumpQ(i){
  if(V.only){V.page=Math.floor(visible().indexOf(i)/PAGE)}else V.page=Math.floor(i/PAGE);
  render();const e=$('#qc'+i);if(e){e.scrollIntoView({behavior:'smooth',block:'start'});e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),2000)}
}
function delQ(i){if(!confirm('Delete question '+(i+1)+'?'))return;Q.splice(i,1);render()}
function addQ(){Q.push(emptyQ());V.only=false;V.page=Math.floor((Q.length-1)/PAGE);render()}

/* ---- publish (in small parts, so large tests with images work) ---- */
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(10))).map(b=>b.toString(16).padStart(2,'0')).join('');
const outQ=q=>({q:q.q,options:q.options,answer:q.answer,explanation:q.explanation,sec:q.sec||'',img:q.img||null,oimg:q.oimg,eimg:q.eimg||null});
async function publish(){
  if(!Q.length)return toast('No questions yet');
  const title=$('#title').value.trim(),sid=$('#ps').value;
  if(!title)return toast('Please enter a test name');
  if(!sid)return toast('Please choose a series');
  const n=Q.filter(bad).length;
  if(n&&!confirm(`${n} question(s) have problems (missing answer or option). Publish anyway?`))return;
  const b=$('#pubbtn'),st=$('#pubst');b.disabled=true;b.textContent='Publishing…';
  try{
    const fid=await resolveFolder(sid,$('#pf').value);
    const token=rnd();let batch=[],size=0,part=0;
    let sent=0;
    const flush=async()=>{if(!batch.length)return;
      const r=await A('test_stage',{token,n:part,questions:batch});if(!r.ok)throw new Error('upload failed ('+(r.error||'')+')');part++;sent+=batch.length;st.textContent=`Uploading… ${sent} of ${Q.length}`;batch=[];size=0};
    for(const q of Q){const o=outQ(q),len=JSON.stringify(o).length;if(batch.length&&(size+len>450000||batch.length>=40))await flush();batch.push(o);size+=len}
    await flush();
    const m=EDIT&&EDIT.meta||{};
    const r=await A('test_save',{id:EDIT?EDIT.id:null,series_id:sid,folder_id:fid,title,duration:+$('#dur').value||180,correct:+$('#pm').value,wrong:+$('#nm').value,
      lock_back:$('#lock').checked,free_preview:$('#prev').checked,active:m.active!==false,sort_order:m.sort_order||0,opens_at:fromLocal($('#opens').value),stage_token:token,count:Q.length});
    if(!r.ok)throw new Error(r.error==='incomplete'?'upload was incomplete, please try again':r.error==='questions'?'add at least one question':(r.detail||r.error));
    EDIT={id:r.id,meta:m};st.textContent='';
    $('#editbar').innerHTML=`<div class="banner"><div class="t"><b>Published ✓</b><div class="sm mut">"${esc(title)}" is live${$('#opens').value?' and will open at the time you set':''}. You can keep editing and press Update.</div></div></div>`;
    $('#pubbtn').textContent='Update test';toast('Published ✓');
    await loadCatalog();syncSelects();$('#ps').value=sid;onSeries();
  }catch(err){toast('Could not publish: '+err.message);st.textContent='Failed: '+err.message}
  finally{b.disabled=false;b.textContent=EDIT?'Update test':'Publish test'}
}
async function editQuestions(id,qi){
  const r=await A('test_get',{id});if(!r.ok||!r.test)return toast('Could not load the test');
  const t=r.test;
  Q=(t.data||[]).map(normQ);S=deriveSections();RAWIMG=[];PDFBUF=null;V={only:false,page:0};
  EDIT={id:t.id,meta:{active:t.active,sort_order:t.sort_order}};
  await tab('create');
  $('#title').value=t.title;$('#dur').value=t.duration;$('#pm').value=t.correct_marks;$('#nm').value=t.wrong_marks;$('#lock').checked=!!t.lock_back;$('#prev').checked=!!t.free_preview;$('#opens').value=toLocal(t.opens_at);
  $('#ps').value=t.series_id;onSeries();const f=CA.folders.find(x=>x.id===t.folder_id);$('#pf').value=f?f.title:'';
  $('#editbar').innerHTML=`<div class="banner"><div class="t"><b>Editing: ${esc(t.title)}</b><div class="sm mut">Change anything below, then press Update test at the bottom.</div></div><button class="btn ghost sm" onclick="newTest()">Cancel</button></div>`;
  $('#pubbtn').textContent='Update test';render();renderSecs();
  if(qi!=null)jumpQ(qi);else window.scrollTo(0,0);
}

async function delRes(id){

function csv(){

  const lines=[['Name','Mobile','Test','Score','Max','Correct','Wrong','Skipped','Time(sec)','Late','Date'].map(q).join(',')].concat(f.map(x=>[x.student,x.mobile,x.title,x.score,x.max,x.correct,x.wrong,x.skipped,x.used,x.late?'yes':'',new Date(x.at).toLocaleString('en-IN')].map(q).join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv'}));a.download='results.csv';document.body.appendChild(a);a.click();a.remove();
}

   <div class="row"><label class="btn soft" style="cursor:pointer">📷 ${s.has_cover?'Change photo':'Upload photo'}<input type="file" accept="image/*" style="display:none" onchange="uploadCover('${sid}',this)"></label>${s.has_cover?`<button class="btn ghost" onclick="removeCover('${sid}')">Remove</button><span class="chip ok">Cover set</span>`:''}</div>
   <div class="h2s" style="margin-top:22px">Syllabus / schedule files</div>

   <label class="l">Type</label><select id="fk"><option value="syllabus">Syllabus</option><option value="schedule">Schedule</option><option value="notes">Notes</option></select>
   <input type="file" id="ffile" accept="application/pdf,image/*" style="margin-top:10px"><div class="sm" id="fst" style="min-height:22px;margin-top:6px"></div>
   <button class="btn block" onclick="uploadFile('${sid}')">Upload file</button>`,true);
}
async function uploadCover(sid,inp){
  const f=inp.files[0];if(!f)return;
  try{
    const d=await compressDataUrl(await fileToUrl(f),900,.78);if(!d)throw new Error('image');
    const r=await A('series_cover',{id:sid,cover:d});if(!r.ok)throw new Error(r.error);
    toast('Cover saved');await loadCatalog();renderContent();mediaModal(sid);
  }catch(e){toast('Could not save the photo')}
}
async function removeCover(sid){const r=await A('series_cover',{id:sid,cover:''});if(r.ok){toast('Cover removed');await loadCatalog();renderContent();mediaModal(sid)}}
async function delFile(sid,id){
  if(!confirm('Delete this file?'))return;
  const r=await A('file_delete',{id});if(r.ok){await loadCatalog();renderContent();mediaModal(sid)}
}
async function uploadFile(sid){
  const f=$('#ffile').files[0],st=$('#fst');
  if(!f){st.textContent='Please choose a file.';return}
  if(f.size>6*1024*1024){st.textContent='This file is larger than 6 MB. Please compress it first.';return}
  const mime=f.type==='application/pdf'?'application/pdf':/^image\/(jpeg|png|webp)$/.test(f.type)?f.type:'';
  if(!mime){st.textContent='Only PDF, JPG, PNG or WebP files are allowed.';return}
  try{
    const b64=(await fileToUrl(f)).split(',')[1],CH=300000,n=Math.ceil(b64.length/CH);let id=null;
    for(let k=0;k<n;k++){
      st.textContent=`Uploading… ${Math.round(k*100/n)}%`;
      const r=await A('file_put',{id,series_id:sid,title:$('#fti').value||f.name.replace(/\.[a-z0-9]+$/i,''),kind:$('#fk').value,name:f.name,mime,size:f.size,n:k,data:b64.slice(k*CH,(k+1)*CH),last:k===n-1});
      if(!r.ok)throw new Error(r.error==='too_big'?'file too big':r.error);
      id=r.id;
    }
    toast('File uploaded');await loadCatalog();renderContent();mediaModal(sid);
  }catch(e){st.textContent='Upload failed: '+e.message}
}

# Secret scan of every push and pull request (whole history, all branches), and a check of the live website for files
# that must not be served: after every change to main, every Monday and on demand. Uses gitleaks (pinned version, checksum checked) and scripts/check-exposed.sh.
name: Security checks
on:
  push: {}
  pull_request: {}
  schedule:
    - cron: '17 3 * * 1'        # Mondays 8:47 AM India time
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks (all history)
        run: |
          set -euo pipefail
          V=8.21.2
          curl -sSLo gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSLo sums.txt "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" sums.txt | sed 's/ .*//' > want.txt
          echo "$(cat want.txt)  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*' || true
          ./gitleaks git --log-opts="--all" --redact --no-banner -c .gitleaks.toml .
      - name: Repository files
        run: bash scripts/check-exposed.sh --local
  live:
    # weekly, on demand, and after every change to main (GitHub Pages needs a minute or two to publish it)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Wait for GitHub Pages to publish
        if: github.event_name == 'push'
        run: sleep 150
      - name: Live website
        run: bash scripts/check-exposed.sh

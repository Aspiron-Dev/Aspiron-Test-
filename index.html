.xfo-s{min-height:22px;margin-top:6px;display:flex}
.xfo-s .liveb{font-size:10px;padding:3px 8px}
.xfo .xbar{width:100%;height:4px;margin-top:8px}

@media(hover:hover){.xfo:hover{transform:translateY(-3px);box-shadow:var(--x-shH)}}
.xchip{display:inline-flex;align-items:center;gap:4px;font:700 11px var(--fb);padding:4px 8px;border-radius:7px;background:var(--x-sub);color:var(--mut);white-space:nowrap}
.xchip.ok{background:var(--okSoft);color:var(--ok)}.xchip.pri{background:var(--priSoft);color:var(--x-acc)}.xchip.warn{background:var(--warnSoft);color:var(--warn)}.xchip.lk{background:var(--x-luxSoft);color:var(--x-luxTx)}
/* test list */
.xtf .chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px}
.xtf .chip{flex:none;height:34px;margin:0;padding:0 12px;border-radius:99px;border:1px solid var(--x-line);background:var(--x-card);color:var(--tx);font:600 12.5px var(--fb);display:inline-flex;align-items:center;gap:5px;cursor:pointer}

<script>/* start-up animation: full show once per app launch (sessionStorage), quick logo after that. Only transform /
   opacity move (the phone's graphics chip does it), so it stays smooth while the app loads underneath.
   Sound only where the phone lets the page play it (installed app), never if turned off in Settings. */
(function(){var s=document.getElementById('splash');if(!s)return;var t0=performance.now(),q=false,rm=false,snd=true,H=document.documentElement;
try{q=sessionStorage.getItem('asp_spl')==='1';sessionStorage.setItem('asp_spl','1')}catch(e){}
try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
try{snd=JSON.parse(localStorage.getItem('cbt_snd'))!==false}catch(e){}
s.addEventListener('click',function(){window.__splEnd=0;if(window.__splReady&&window.hideSplash)hideSplash()});
/* header logo: a soft shine passes over ASPIRON every few seconds (not when the app is in the background or in a test) */
if(!rm)setTimeout(function(){var sh=function(){var w=document.querySelector('.bmk-w');if(!w||document.hidden||document.body.classList.contains('intest')||!w.offsetWidth)return;w.classList.remove('bmk-go');void w.offsetWidth;w.classList.add('bmk-go')};sh();setInterval(sh,H.dataset.lite?16000:8000)},(q||rm?600:2300));
if(q||rm){s.classList.add('q');window.__splEnd=t0+(q?300:700);return}
s.classList.add('go');window.__splEnd=t0+1800;
if(!snd)return;
try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
var run=function(late){var c=new AC(),done=false;
 var play=function(){if(done)return;done=true;var el=late?.8:(performance.now()-t0)/1000,T=c.currentTime,
  at=function(x){return x<el-.1?-1:T+Math.max(0,x-el)},
  out=c.createDynamicsCompressor(),m=c.createGain();m.gain.value=.5;m.connect(out);out.connect(c.destination);
  /* small generated room reverb */
  var rv=c.createConvolver(),wet=c.createGain(),L=Math.floor(c.sampleRate*1.3),ir=c.createBuffer(2,L,c.sampleRate);
  for(var ch=0;ch<2;ch++){var d=ir.getChannelData(ch);for(var i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3)}
  rv.buffer=ir;wet.gain.value=.3;m.connect(rv);rv.connect(wet);wet.connect(out);
  var env=function(g,t,a,p,r){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+r)};
  /* 1. warm chord swell under the show (A major add9) */
  var t=T+Math.max(0,.05-el);{var lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1300;var pg=c.createGain();lp.connect(pg);pg.connect(m);
   pg.gain.setValueAtTime(0.0001,t);pg.gain.exponentialRampToValueAtTime(.05,t+.8);pg.gain.setValueAtTime(.05,t+1.25);pg.gain.exponentialRampToValueAtTime(0.0001,t+2.4);
   [220,329.63,554.37,659.25].forEach(function(f,k){[-4,4].forEach(function(dt){var o=c.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=dt;var og=c.createGain();og.gain.value=k>2?.35:.6;o.connect(og);og.connect(lp);o.start(t);o.stop(t+2.5)})})}
  /* 2. soft whoosh with the gold swoosh (left to right) */
  t=at(.25);if(t>=0){var n=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=n.getChannelData(0);for(var j=0;j<nd.length;j++)nd[j]=Math.random()*2-1;
   var ns=c.createBufferSource();ns.buffer=n;var bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=.9;bp.frequency.setValueAtTime(320,t);bp.frequency.exponentialRampToValueAtTime(2600,t+.34);bp.frequency.exponentialRampToValueAtTime(1100,t+.6);
   var wg=c.createGain();wg.gain.setValueAtTime(0.0001,t);wg.gain.linearRampToValueAtTime(.2,t+.26);wg.gain.exponentialRampToValueAtTime(0.0001,t+.62);
   ns.connect(bp);bp.connect(wg);if(c.createStereoPanner){var pn=c.createStereoPanner();pn.pan.setValueAtTime(-.7,t);pn.pan.linearRampToValueAtTime(.7,t+.6);wg.connect(pn);pn.connect(m)}else wg.connect(m);ns.start(t);ns.stop(t+.65)}
  /* 3. gentle tap when the cap lands on the A */
  t=at(.85);if(t>=0){var o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(72,t+.14);var g=c.createGain();env(g,t,.006,.3,.2);o.connect(g);g.connect(m);o.start(t);o.stop(t+.25)}
  /* 4. sparkle chime with the star */
  [[.9,1318.51],[1,1975.53]].forEach(function(nt){var t=at(nt[0]);if(t<0)return;[[1,1,1.7],[2.01,.32,1],[3,.16,.6],[4.2,.07,.35]].forEach(function(p){var o=c.createOscillator();o.type='sine';o.frequency.value=nt[1]*p[0];var g=c.createGain();env(g,t,.004,.12*p[1],p[2]);o.connect(g);g.connect(m);o.start(t);o.stop(t+p[2]+.05)})});
  setTimeout(function(){try{c.close()}catch(e){}},4200)};
 /* late = the first tap in a browser tab (Chrome keeps sound blocked until then): only the tap and the sparkle chime play */
 if(late){var r2=c.state==='running'?null:c.resume();if(!r2)play();else if(r2.then)r2.then(function(){if(c.state==='running')play();else try{c.close()}catch(e){}},function(){try{c.close()}catch(e){}});return}
 if(c.state==='running')play();else{var r=c.resume();if(r&&r.then)r.then(function(){if(c.state==='running'&&performance.now()-t0<500)play()},function(){})}

 try{if(JSON.parse(localStorage.getItem('cbt_snd'))===false)return}catch(x){}

run(false);
}catch(e){}})();</script>

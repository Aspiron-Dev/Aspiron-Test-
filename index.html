<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b5bf0">
<title>CBT Test Series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=JSON.parse(localStorage.getItem('cbt_theme'));if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="config.js"></script>
</head>
<body>
<header class="hdr"><div class="hdr-in">
  <a class="brand" href="#/"><span class="logo" id="lg"></span><span id="sn">CBT Test Series</span></a>
  <div class="sp"></div>
  <div id="usr"></div>
  <button class="iconbtn" id="thm" aria-label="Toggle theme" onclick="toggleTheme()"></button>
</div></header>
<main id="app"></main>
<div id="layer"></div>

<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=sec=>{sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const IC={
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 file:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
 flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
 right:'<path d="M9 6l6 6-6 6"/>',left:'<path d="M15 6l-6 6 6 6"/>',
 trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0z"/><path d="M17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/>',
 play:'<path d="M7 4l13 8-13 8z"/>',check:'<path d="M5 12l5 5L20 7"/>',
 lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
 folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
 logout:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',
 book:'<path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5z"/><path d="M4 19.5V21h16"/>',
 crown:'<path d="M3 7l4 4 5-7 5 7 4-4-2 12H5z"/>',
 msg:'<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>',
 wifi:'<path d="M1 1l22 22M16.7 11.1A10.9 10.9 0 0119 12.6M5 12.6a10.9 10.9 0 015.2-2.5M8.5 16.1a6 6 0 016.9 0M12 20h.01"/>',
 eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 download:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',
 home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L21 2M16 7l3 3M14 9l2 2"/>'
};
const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}>${IC[n]}</svg>`;
const L='ABCD';
const CFG=window.CBT_CONFIG||{};
const API=String(CFG.SUPABASE_URL||'').replace(/\/$/,'');
const cloud=!!(API&&CFG.SUPABASE_KEY);

/* ---------- device id ---------- */
function devId(){
  let d=LS.get('cbt_dev',null);
  if(!d||String(d).length<8){
    try{d=Array.from(crypto.getRandomValues(new Uint8Array(10))).map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){d=(Math.random().toString(16).slice(2)+Math.random().toString(16).slice(2)).slice(0,20)}
    LS.set('cbt_dev',d);
  }
  return d;
}
const DEV=devId();

/* ---------- state ---------- */
let AUTH=LS.get('cbt_auth',null);      // {mobile, code, name}
let SOFF=0, BM=new Set(), SEC=null, FILEURL={}, opTimer=null;
let CAT=null, T=null, P=null, timer=null, INTEST=false, palOpen=false, warned=false, RV=null, retryT=null, RET='#/', LOGINERR='';

/* ---------- api ---------- */
async function rpc(fn,args,noAuth){
  const body=noAuth?args:Object.assign({p_mobile:AUTH.mobile,p_code:AUTH.code,p_device:DEV},args||{});
  try{
    const r=await fetch(API+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.SUPABASE_KEY,Authorization:'Bearer '+CFG.SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)return{ok:false,error:'server',status:r.status};
    return await r.json();
  }catch(e){return{ok:false,error:'network'}}
}
const AUTHERR=['invalid','blocked','pending','device_limit','locked','device'];
function errText(r){
  switch(r&&r.error){
    case 'invalid':return 'Mobile number or access code is incorrect.';
    case 'pending':return 'Your request is waiting for approval. You will receive your access code once the admin approves it.';
    case 'blocked':return 'Your access has been blocked. Please contact the admin.';
    case 'locked':return `Too many wrong attempts. Please try again in ${r.wait||15} minutes.`;
    case 'device_limit':return 'This code is already active on the maximum number of devices. Ask the admin to reset your devices.';
    case 'network':return 'No internet connection. Please check and try again.';
    default:return 'Something went wrong. Please try again.';
  }
}
function authErr(r){
  if(r&&!r.ok&&AUTHERR.includes(r.error)){
    LOGINERR=r.error==='invalid'?'Your session is no longer valid. Please sign in again.':errText(r);
    AUTH=null;LS.del('cbt_auth');CAT=null;INTEST=false;document.body.classList.remove('intest');login();
    return true;
  }
  return false;
}

/* ---------- theme / header / helpers ---------- */
function updateTheme(){$('#thm').innerHTML=ic(document.documentElement.dataset.theme==='dark'?'sun':'moon')}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;LS.set('cbt_theme',t);updateTheme()}
function updateHeader(){
  $('#lg').innerHTML=ic('target',20);
  $('#sn').textContent=CFG.SITE_NAME||'CBT Test Series';document.title=CFG.SITE_NAME||'CBT Test Series';
  $('#usr').innerHTML=AUTH?`<button class="chip-user" onclick="signOut()" title="Sign out"><span class="avatar">${esc((AUTH.name||'?').trim()[0].toUpperCase())}</span>${esc((AUTH.name||'').split(' ')[0])}</button>`:'';
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function modal(h){$('#layer').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box">${h}</div></div>`}
function closeModal(){$('#layer').innerHTML=''}
function setApp(h){clearInterval(opTimer);opTimer=null;$('#app').innerHTML=h;window.scrollTo(0,0);startOp();loadCovers()}
function loading(m){setApp(`<div class="loading"><div><div class="spin"></div>${esc(m||'Loading…')}</div></div>`)}
const GR=[['#5b5bf0','#8b5cf6'],['#0ea5e9','#6366f1'],['#10b981','#0ea5e9'],['#f59e0b','#ef4444'],['#ec4899','#8b5cf6'],['#14b8a6','#22c55e']];
function grad(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;const g=GR[h%GR.length];return `linear-gradient(135deg,${g[0]},${g[1]})`}
const pct=(s,m)=>m?Math.max(0,Math.round(s*100/m)):0;
function ring(p,size,sw,col){
  const r=(size-sw)/2,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col||'var(--pri)'}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(100,p)/100)}"/></svg>`;
}
const ringCol=p=>p>=60?'var(--ok)':p>=35?'var(--warn)':'var(--bad)';
function waLink(text){
  const n=String(CFG.CONTACT_WHATSAPP||'').replace(/\D/g,'');
  return n?`https://wa.me/${n}?text=${encodeURIComponent(text)}`:'';
}

/* ---------- login / request ---------- */
function login(mode){
  INTEST=false;document.body.classList.remove('intest');clearTimeout(retryT);updateHeader();
  if(!cloud){setApp(`<div class="wrap"><div class="card empty"><b>Website is not connected yet.</b><p class="sm">The admin needs to fill in config.js.</p></div></div>`);return}
  if(mode==='request')return requestView();
  const wa=waLink('Hi, I would like to get access to '+(CFG.SITE_NAME||'the test series')+'.');
  setApp(`<div class="wrap"><div class="card login">
   <div class="logo">${ic('key',26)}</div>
   <h1 style="font-size:26px">Student login</h1>
   <p class="mut" style="margin:6px 0 0">Enter your mobile number and the access code given to you.</p>
   <label class="l">Mobile number</label><input type="tel" id="ph" inputmode="numeric" maxlength="14" autocomplete="tel" placeholder="10-digit mobile number">
   <label class="l">Access code</label><input type="text" id="cd" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="12" placeholder="e.g. A1B2-C3D4">
   <div id="er" class="sm err" style="min-height:22px;margin-top:8px">${esc(LOGINERR)}</div>
   <button class="btn block" id="lbtn" onclick="doLogin()">Sign in ${ic('right')}</button>
   <div class="divider">New student?</div>
   <button class="btn ghost block" onclick="login('request')">Request access</button>
   ${wa?`<a class="btn soft block" style="margin-top:10px;text-decoration:none" href="${wa}" target="_blank" rel="noopener">${ic('msg')} Contact on WhatsApp</a>`:''}
  </div></div>`);
  LOGINERR='';
  ['ph','cd'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()}));
}
async function doLogin(){
  const m=$('#ph').value.replace(/\D/g,'').slice(-10),c=$('#cd').value.replace(/[^0-9a-zA-Z]/g,'').toUpperCase();
  if(m.length!==10){$('#er').textContent='Please enter a valid 10-digit mobile number.';return}
  if(c.length<4){$('#er').textContent='Please enter your access code.';return}
  const b=$('#lbtn');b.disabled=true;b.textContent='Checking…';$('#er').textContent='';
  const r=await rpc('cbt_login',{p_mobile:m,p_code:c,p_device:DEV},true);
  if(!r.ok){$('#er').textContent=errText(r);b.disabled=false;b.innerHTML='Sign in '+ic('right');return}
  AUTH={mobile:m,code:c,name:r.name};LS.set('cbt_auth',AUTH);updateHeader();CAT=null;
  await flushPending();
  location.hash='#/';route();
}
function requestView(){
  setApp(`<div class="wrap"><div class="card login" id="rq">
   <button class="btn ghost sm" onclick="login()">${ic('back')} Back</button>
   <h1 style="font-size:24px;margin-top:16px">Request access</h1>
   <p class="mut" style="margin:6px 0 0">Send your details. Once the admin approves you, you will get a personal access code.</p>
   <label class="l">Full name</label><input type="text" id="rn" autocomplete="name" placeholder="e.g. Rahul Sharma">
   <label class="l">Mobile number</label><input type="tel" id="rp" inputmode="numeric" maxlength="14" autocomplete="tel" placeholder="10-digit mobile number">
   <div id="er" class="sm err" style="min-height:22px;margin-top:8px"></div>
   <button class="btn block" id="rbtn" onclick="doRequest()">Send request</button>
  </div></div>`);
}
async function doRequest(){
  const n=$('#rn').value.trim(),m=$('#rp').value.replace(/\D/g,'').slice(-10);
  if(n.length<2){$('#er').textContent='Please enter your name.';return}
  if(m.length!==10){$('#er').textContent='Please enter a valid 10-digit mobile number.';return}
  const b=$('#rbtn');b.disabled=true;b.textContent='Sending…';
  const r=await rpc('cbt_request_access',{p_name:n,p_mobile:m},true);
  if(!r.ok){$('#er').textContent=r.error==='blocked'?'Your access has been blocked. Please contact the admin.':r.error==='busy'?'Too many pending requests right now. Please try again later.':errText(r);b.disabled=false;b.textContent='Send request';return}
  const wa=waLink(`Hi, I am ${n} (${m}). I have requested access to ${CFG.SITE_NAME||'the test series'}.`);
  const msg=r.status==='approved'?`<h2>You are already approved</h2><p class="mut">Go back and sign in with your access code. If you lost your code, ask the admin for a new one.</p>`
    :`<h2>Request sent ✓</h2><p class="mut">The admin will review your request. After approval you will receive an access code on your mobile. Then come back here and sign in.</p>`;
  $('#rq').innerHTML=`<div class="logo" style="background:var(--ok)">${ic('check',26)}</div>${msg}
    ${wa?`<a class="btn soft block" style="margin:8px 0;text-decoration:none" href="${wa}" target="_blank" rel="noopener">${ic('msg')} Message the admin</a>`:''}
    <button class="btn block" onclick="login()">Back to sign in</button>`;
}
function signOut(){
  modal(`<h2>Sign out?</h2><p class="mut">You will need your access code to sign in again. Tests in progress stay saved on this device.</p>
  <div class="row"><button class="btn ghost" style="flex:1" onclick="closeModal()">Cancel</button><button class="btn danger" style="flex:1" onclick="doSignOut()">Sign out</button></div>`);
}
function doSignOut(){closeModal();AUTH=null;LS.del('cbt_auth');CAT=null;login()}

/* ---------- catalog / routing ---------- */
let CATAT=0;
async function loadCat(silent){
  const r=await rpc('cbt_catalog',{});
  if(!r.ok){
    if(authErr(r))return false;
    if(!silent)setApp(`<div class="wrap"><div class="card empty">${ic('wifi',30)}<h3 style="margin:10px 0 4px">Could not load</h3><p class="sm">${esc(errText(r))}</p><button class="btn" onclick="route()">Try again</button></div></div>`);
    return false;
  }
  CAT=r;CATAT=Date.now();SOFF=r.now-Date.now();BM=new Set((r.bookmarks||[]).map(b=>b.t+':'+b.i));if(r.name&&AUTH&&AUTH.name!==r.name){AUTH.name=r.name;LS.set('cbt_auth',AUTH);updateHeader()}
  return true;
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AUTH&&!INTEST&&CAT&&Date.now()-CATAT>30000)route()});
async function route(){
  if(INTEST||!AUTH)return;
  if(!CAT){loading('Loading your tests…');if(!(await loadCat()))return}
  else if(Date.now()-CATAT>30000){await loadCat(true);if(!AUTH||INTEST)return}
  const h=location.hash||'#/';let m;
  if((m=h.match(/^#\/s\/(.+)$/)))return viewSeries(m[1]);
  if((m=h.match(/^#\/f\/(.+)$/)))return viewFolder(m[1]);
  if(h==='#/r')return viewHome('results');
  if(h==='#/b')return viewBookmarks();
  if(h==='#/series')return viewHome('series');
  return viewHome('dash');
}
window.addEventListener('hashchange',()=>{if(!INTEST)route()});


/* ---------- time helpers / schedule ---------- */
const srvNow=()=>Date.now()+SOFF;
const fmtWhen=ms=>new Date(ms).toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit',hour12:true});
const fmtCd=sec=>{sec=Math.max(0,Math.floor(sec));const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;
  if(d)return d+'d '+h+'h '+m+'m';
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
const isWait=t=>t.opens_at&&t.opens_at>srvNow();
let opFired=false;
function startOp(){
  opFired=false;
  if(!document.querySelector('[data-op]'))return;
  const f=()=>{
    let fire=false;
    document.querySelectorAll('[data-op]').forEach(e=>{const left=(+e.dataset.op-srvNow())/1000;if(left<=0)fire=true;else e.textContent=fmtCd(left)});
    if(fire&&!opFired&&!INTEST){opFired=true;clearInterval(opTimer);CAT=null;route()}
  };
  f();opTimer=setInterval(f,1000);
}

/* ---------- covers ---------- */
const COVQ={};
async function loadCovers(){
  document.querySelectorAll('[data-cov]').forEach(async el=>{
    const id=el.dataset.cov,v=+el.dataset.v;if(!id||!v)return;
    let d=null;
    try{const c=JSON.parse(localStorage.getItem('cbt_cov_'+id)||'null');if(c&&c.v===v)d=c.d}catch(e){}
    if(!d){
      if(!COVQ[id])COVQ[id]=rpc('cbt_cover',{p_series:id});
      const r=await COVQ[id];delete COVQ[id];
      if(r&&r.ok&&r.cover){d=r.cover;try{localStorage.setItem('cbt_cov_'+id,JSON.stringify({v:r.v,d}))}catch(e){}}
    }
    if(d)el.style.backgroundImage=`linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45)),url(${d})`,el.classList.add('hascov');
  });
}

/* ---------- home / dashboard ---------- */
function spark(vals){
  if(vals.length<2)return '';
  const w=220,h=54,mx=Math.max(100,...vals),pts=vals.map((v,i)=>[i*(w/(vals.length-1)),h-4-(v/mx)*(h-10)]);
  return `<svg viewBox="0 0 ${w} ${h}" class="spark"><polyline fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="currentColor"/>`).join('')}</svg>`;
}
function tabsHtml(tab){
  const b=(k,h,t)=>`<button class="${tab===k?'on':''}" onclick="location.hash='${h}'">${t}</button>`;
  return `<div class="sec-h"><div class="seg">${b('dash','#/','Dashboard')}${b('series','#/series','Test series')}${b('bm','#/b','Bookmarks')}${b('results','#/r','Results')}</div></div>`;
}
function resultRow(x){
  const p=pct(x.score,x.max);
  return `<div class="rrow"><div class="mring">${ring(p,54,6,ringCol(p))}<span>${p}%</span></div>
    <div class="grow"><b>${esc(x.title)}</b><span class="sm mut">${new Date(x.at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})} · ${x.score}/${x.max} · ✓${x.correct} ✗${x.wrong}</span></div>
    <button class="btn soft sm" onclick="openReview('${x.id}')">Review</button></div>`;
}
function viewHome(tab){
  const R=CAT.results||[];
  const avg=R.length?Math.round(R.reduce((a,x)=>a+pct(x.score,x.max),0)/R.length):0;
  const best=R.length?Math.max(...R.map(x=>pct(x.score,x.max))):0;
  const hr=new Date().getHours(),gr=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  let o=`<div class="wrap"><div class="hero"><h1>${gr}, ${esc((AUTH.name||'').split(' ')[0])}</h1><p>Practise in real exam mode and track your progress.</p>
  <div class="stats"><div class="stat"><b>${R.length}</b><span>Tests taken</span></div><div class="stat"><b>${avg}%</b><span>Average</span></div><div class="stat"><b>${best}%</b><span>Best</span></div></div></div>${tabsHtml(tab)}`;
  if(tab==='dash')o+=dashBody(R,avg);
  else if(tab==='series')o+=seriesList();
  else{
    if(!R.length)o+=`<div class="card empty">You have not attempted any test yet.</div>`;
    else o+=`<div class="card">${R.map(resultRow).join('')}</div>`;
  }
  setApp(o+'</div>');
}
function dashBody(R,avg){
  let o='';
  const prog=CAT.tests.filter(t=>t.in_progress&&!t.locked);
  if(prog.length)o+=`<div class="h2s">${ic('play',20)} Continue your test</div>${prog.map(testRow).join('')}`;
  const up=CAT.tests.filter(t=>isWait(t)).sort((a,b)=>a.opens_at-b.opens_at);
  if(up.length)o+=`<div class="h2s">${ic('calendar',20)} Upcoming tests <span class="n">${up.length}</span></div>${up.map(testRow).join('')}`;
  const tot=R.reduce((a,x)=>a+x.correct+x.wrong,0),cor=R.reduce((a,x)=>a+x.correct,0);
  const acc=tot?Math.round(cor*100/tot):0;
  const secs=R.reduce((a,x)=>a+(x.used||0),0);

async function openFile(id){
  if(FILEURL[id])return showFile(id);
  modal(`<div class="spin"></div><p class="mut" style="text-align:center" id="fp">Downloading…</p>`);
  const parts=[];let n=0,total=1,mime='application/pdf',name='file';
  while(n<total){
    const r=await rpc('cbt_file_part',{p_file:id,p_n:n});
    if(!r.ok){closeModal();if(!authErr(r))toast('Could not download this file.');return}
    total=r.parts;mime=r.mime;name=r.name;parts.push(r.data||'');n++;
    const e=$('#fp');if(e)e.textContent=`Downloading… ${Math.round(n*100/total)}%`;
  }
  try{
    const bin=atob(parts.join(''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    FILEURL[id]={url:URL.createObjectURL(new Blob([u],{type:mime})),name};

  showFile(id);
}

async function startTest(id){
  loading('Starting your test…');
  const r=await rpc('cbt_start',{p_test:id});
  if(!r.ok){
    if(authErr(r))return;
    if(r.error==='locked'||r.error==='not_found')LS.del(progKey(id));
    if(r.error==='locked'){CAT=null;await route();toast('This test is locked.');return}
    if(r.error==='not_open'){CAT=null;await route();toast('This test opens on '+fmtWhen(r.opens_at));return}
    toast(r.error==='not_found'?'This test is no longer available.':errText(r));CAT=null;route();return;
  }
  T=r.test;const off=r.now-Date.now();SOFF=off;
  let p=getProg(id);
  if(!(p&&p.sid===r.session.id))p={tid:id,sid:r.session.id,cid:uuid(),ans:{},mark:{},vis:{0:1},cur:0,title:T.title};
  p.ends=r.session.ends_at;p.off=off;
  if(p.cur>=T.questions.length)p.cur=0;
  P=p;saveProg();
  if(P.ends-(Date.now()+P.off)<=0){return finish(true)}
  INTEST=true;warned=false;run();
}
function secSetup(){
  const names=[];T.questions.forEach(q=>{const s=q.sec||'';if(!names.includes(s))names.push(s)});
  SEC={names,has:names.some(x=>x),of:i=>T.questions[i].sec||'',label:s=>s||'General'};
}
function run(){
  document.body.classList.add('intest');palOpen=false;secSetup();
  window.onbeforeunload=e=>{e.preventDefault();e.returnValue=''};
  clearInterval(timer);draw();timer=setInterval(tick,1000);tick();
}
function tick(){
  if(!P)return;
  const left=Math.round((P.ends-(Date.now()+P.off))/1000);
  const e=$('#tm');if(e){e.querySelector('span').textContent=fmt(left);e.classList.toggle('low',left<=300)}
  if(T&&T.duration>10&&left<=300&&left>295&&!warned){warned=true;toast('Only 5 minutes left!')}
  if(left<=0){clearInterval(timer);toast("Time's up! Submitting your test…");finish(true)}
}
const stOf=i=>{const has=P.ans[i]!=null,mk=P.mark[i];return mk?(has?'mans':'mark'):has?'ans':P.vis[i]?'na':'nv'};
function countsOf(idx){
  const c={nv:0,na:0,ans:0,mark:0,mans:0};idx.forEach(i=>c[stOf(i)]++);return c;
}
const allIdx=()=>T.questions.map((_,i)=>i);
const secIdx=name=>allIdx().filter(i=>SEC.of(i)===name);

function palHtml(){
  const lock=!!T.lock_back,cur=SEC.of(P.cur),idx=SEC.has?secIdx(cur):allIdx(),c=countsOf(idx);
  return `${SEC.has?`<div class="sm mut" style="margin-bottom:8px"><b style="color:var(--tx)">${esc(SEC.label(cur))}</b></div>`:''}
  <div class="pal">${idx.map(i=>`<button class="${stOf(i)} ${i===P.cur?'cur':''}" ${lock?'disabled':''} onclick="go(${i})">${i+1}</button>`).join('')}</div>
  <div class="leg2"><span><i class="lg ans">${c.ans}</i>Answered</span><span><i class="lg na">${c.na}</i>Not answered</span><span><i class="lg nv">${c.nv}</i>Not visited</span><span><i class="lg mark">${c.mark}</i>Marked</span><span style="grid-column:1/3"><i class="lg mans">${c.mans}</i>Answered &amp; marked (will be evaluated)</span></div>`;
}
function draw(){
  const n=T.questions.length,q=T.questions[P.cur],a=P.ans[P.cur],lock=!!T.lock_back;
  P.vis[P.cur]=1;
  const secTabs=SEC.has?`<div class="stabs">${SEC.names.map(s=>`<button class="${s===SEC.of(P.cur)?'on':''}" ${lock?'disabled':''} onclick="goSec(${JSON.stringify(s).replace(/"/g,'&quot;')})">${esc(SEC.label(s))}</button>`).join('')}</div>`:'';
  $('#app').innerHTML=(`<div class="cbtbar"><div class="tb-l"><div class="tb-title">${esc(T.title)}</div><div class="sm mut cand">${ic('user',13)} ${esc(AUTH.name||'')}</div></div>
   <div class="timer" id="tm">${ic('clock')}<span>--:--</span></div><button class="btn danger sm" onclick="submitAsk()">Submit</button></div>${secTabs}
   <div class="tlayout"><section class="card qcard"><div class="qmeta"><b>Question ${P.cur+1} <span class="mut" style="font-weight:500">of ${n}</span></b><span class="chip ok">+${T.correct}</span><span class="chip warn">−${T.wrong}</span>${P.mark[P.cur]?'<span class="chip pri">Marked</span>':''}<span style="flex:1"></span>${bmBtn(P.tid,P.cur)}${rpBtn(P.tid,P.cur)}</div>
   <div class="qtext">${esc(q.q)}</div>${imgTag(q.img)}
   ${q.options.map((o,i)=>(o||(q.oimg&&q.oimg[i]))?`<button class="opt ${a===i?'sel':''}" onclick="sel(${i})"><span class="k">${L[i]}</span><span class="t">${esc(o)}${imgTag(q.oimg&&q.oimg[i],'oi')}</span></button>`:'').join('')}</section>
   <aside class="side card"><div class="candbox"><div class="avatar" style="width:40px;height:40px;font-size:16px">${esc((AUTH.name||'?').trim()[0].toUpperCase())}</div><div><b>${esc(AUTH.name||'')}</b><div class="sm mut">Candidate</div></div></div>${palHtml()}
   <button class="btn danger block" style="margin-top:14px" onclick="submitAsk()">Submit test</button></aside></div>
   <div class="bbar"><div class="r"><button class="btn warn sm" onclick="markNext()">${ic('flag')} Mark &amp; Next</button><button class="btn ghost sm" onclick="clr()">Clear</button><button class="btn sm" onclick="saveNext()">Save &amp; Next ${ic('right')}</button></div>
   <div class="r nav">${lock?'':`<button class="btn ghost sm" ${P.cur===0?'disabled':''} onclick="go(${P.cur-1})">${ic('left')} Back</button>`}<button class="btn soft sm only-m" onclick="pal(true)">${ic('grid')} Palette</button>${lock?'':`<button class="btn ghost sm" ${P.cur===n-1?'disabled':''} onclick="go(${P.cur+1})">Next ${ic('right')}</button>`}</div></div>
   <div class="sheet ${palOpen?'open':''}" onclick="if(event.target===this)pal(false)"><div class="in"><div class="grab"></div><b>Question palette</b><div style="margin-top:12px">${palHtml()}</div>
   <button class="btn danger block" style="margin-top:14px" onclick="submitAsk()">Submit test</button></div></div>`);
  tick();
}
function pal(v){palOpen=v;const s=document.querySelector('.sheet');if(s)s.classList.toggle('open',v)}
function go(i){if(i<0||i>=T.questions.length)return;P.cur=i;palOpen=false;saveProg();draw();window.scrollTo(0,0)}
function goSec(name){const idx=secIdx(name);if(!idx.length)return;go(idx.includes(P.cur)?P.cur:idx[0])}
function sel(i){P.ans[P.cur]=i;saveProg();draw()}
function clr(){delete P.ans[P.cur];saveProg();draw()}
function saveNext(){delete P.mark[P.cur];nxt()}
function markNext(){P.mark[P.cur]=1;nxt()}
function nxt(){if(P.cur<T.questions.length-1)P.cur++;saveProg();draw();window.scrollTo(0,0)}

/* ---------- submitting (answers are marked on the server) ---------- */

const pendKey=()=>'cbt_pend_'+AUTH.mobile;
const getPend=()=>LS.get(pendKey(),[]);
function addPend(it){const l=getPend().filter(x=>x.cid!==it.cid);l.push(it);LS.set(pendKey(),l)}
function delPend(cid){LS.set(pendKey(),getPend().filter(x=>x.cid!==cid))}
function submitAsk(){
  const c=counts();
  const rows=SEC.has?SEC.names.map(s=>{const idx=secIdx(s),k=countsOf(idx);return `<tr><td>${esc(SEC.label(s))}</td><td>${idx.length}</td><td>${k.ans+k.mans}</td><td>${k.na+k.nv}</td><td>${k.mark+k.mans}</td></tr>`}).join(''):'';
  modal(`<h2>Submit test?</h2><p class="mut" style="margin:6px 0 0">You won't be able to change your answers after this.</p>
  ${SEC.has?`<div class="scroll" style="margin-top:12px"><table class="tbl sm"><tr><th>Section</th><th>Total</th><th>Done</th><th>Left</th><th>Marked</th></tr>${rows}</table></div>`
  :`<div class="mgrid"><div><b style="color:var(--ok)">${c.a}</b><span class="sm mut">Answered</span></div><div><b style="color:var(--bad)">${c.u}</b><span class="sm mut">Unanswered</span></div><div><b style="color:var(--pri)">${c.m}</b><span class="sm mut">Marked</span></div></div>`}
  <div class="row" style="margin-top:16px"><button class="btn ghost" style="flex:1" onclick="closeModal()">Keep going</button><button class="btn danger" style="flex:1" onclick="closeModal();finish(false)">Submit</button></div>`);
}
async function finish(auto){
  clearInterval(timer);window.onbeforeunload=null;
  const it={tid:P.tid,cid:P.cid,ans:P.ans,title:(T&&T.title)||P.title,ts:Date.now()};
  addPend(it);LS.del(progKey(P.tid));
  INTEST=false;P=null;T=null;document.body.classList.remove('intest');
  await sendPending(it);
}
let CURPEND=null;
async function sendPending(it){
  CURPEND=it;clearTimeout(retryT);loading('Submitting your answers…');
  const r=await rpc('cbt_submit',{p_test:it.tid,p_answers:it.ans,p_client_id:it.cid});
  if(r.ok){
    delPend(it.cid);CAT=null;
    RV={result:r.result,review:r.review,filter:'all'};
    showResult();lb(r.result);return;
  }
  if(r.error==='network'||r.error==='server'){
    setApp(`<div class="wrap"><div class="card empty">${ic('wifi',32)}<h3 style="margin:10px 0 4px">No connection</h3>
      <p class="sm">Your answers are saved on this phone. We will keep trying to submit them. Please stay on this page.</p>
      <button class="btn" onclick="sendPending(CURPEND)">Try again now</button></div></div>`);
    retryT=setTimeout(()=>sendPending(it),8000);return;
  }
  if(authErr(r))return;
  delPend(it.cid);CAT=null;
  toast(r.error==='no_session'?'This attempt was already closed.':'Could not submit this test.');
  location.hash=RET;route();
}
async function flushPending(){
  if(!AUTH)return;
  // expired local progress -> submit
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('cbt_prog_'+AUTH.mobile+'_')){
        const p=LS.get(k,null);
        if(p&&p.ends&&p.ends<=Date.now()+(p.off||0)){addPend({tid:p.tid,cid:p.cid,ans:p.ans||{},title:p.title,ts:Date.now()});LS.del(k)}
      }
    }
  }catch(e){}
  for(const it of getPend()){
    const r=await rpc('cbt_submit',{p_test:it.tid,p_answers:it.ans,p_client_id:it.cid});
    if(r.ok||['no_session','not_found'].includes(r.error))delPend(it.cid);
    if(r.ok)toast('Your earlier test was submitted.');
  }
}


/* ---------- result / review ---------- */
async function openReview(id){
  loading('Loading your answers…');
  const r=await rpc('cbt_review',{p_result:id});
  if(!r.ok){if(authErr(r))return;toast('Could not load this result.');route();return}
  if(r.gone){toast('This test is no longer available for review.');route();return}
  if(!CAT)await loadCat(true);
  BM=BM||new Set();
  RV={result:r.result,review:r.review,filter:'all',sec:'*'};showResult();lb(r.result);
}
async function lb(res){
  if(!res.test_id)return;
  const r=await rpc('cbt_leaderboard',{p_test:res.test_id});
  const el=$('#lb');if(!el||!r.ok||!r.top||!r.top.length)return;
  el.innerHTML=`<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><b>${ic('trophy')} Leaderboard</b>${r.my_rank?`<span class="chip pri">Your rank #${r.my_rank} of ${r.total}</span>`:''}</div>
   ${r.top.map(x=>`<div class="lb ${x.me?'me':''}"><span class="n">${x.rank}</span><span style="flex:1">${esc(x.name)}${x.me?' (you)':''}</span><b>${x.score}</b></div>`).join('')}</div>`;
}
function setFilter(f){RV.filter=f;showResult()}
function setSecF(s){RV.sec=s;showResult()}
function doneResult(){RV=null;CAT=null;const h=RET&&RET!=='#/'?RET:'#/r';history.replaceState(null,'',h);route()}
function showResult(){
  document.body.classList.remove('intest');
  const rec=RV.result,f=RV.filter,Qs=RV.review,ans=rec.answers||{};
  const p=pct(rec.score,rec.max),col=ringCol(p),acc=rec.correct+rec.wrong?Math.round(rec.correct*100/(rec.correct+rec.wrong)):0;
  const all=Qs.map((q,i)=>{const a=ans[i]!=null?+ans[i]:null;return{q,i,a,st:q.answer==null||a==null?'s':(a===q.answer?'c':'w')}});
  const names=[];Qs.forEach(q=>{const s=q.sec||'';if(!names.includes(s))names.push(s)});
  const hasSec=names.some(x=>x);
  const cm=Qs.length?rec.max/Qs.length:0,wm=rec.wrong?(rec.correct*cm-rec.score)/rec.wrong:0;
  const secRows=hasSec?names.map(s=>{
    const it=all.filter(x=>(x.q.sec||'')===s),c=it.filter(x=>x.st==='c').length,w=it.filter(x=>x.st==='w').length,k=it.length-c-w;
    return `<tr><td><b>${esc(s||'General')}</b></td><td>${it.length}</td><td style="color:var(--ok)">${c}</td><td style="color:var(--bad)">${w}</td><td>${k}</td><td><b>${Math.round((c*cm-w*wm)*100)/100}</b>/${Math.round(it.length*cm*100)/100}</td></tr>`}).join(''):'';
  const sf=RV.sec||'*';
  const items=all.filter(x=>(f==='all'||x.st===f)&&(!hasSec||sf==='*'||(x.q.sec||'')===sf));
  const fb=(k,t)=>`<button class="${f===k?'on':''}" onclick="setFilter('${k}')">${t}</button>`;
  const sb=(k,t)=>`<button class="${sf===k?'on':''}" onclick="setSecF(${JSON.stringify(k).replace(/"/g,'&quot;')})">${esc(t)}</button>`;
  const tid=rec.test_id;
  setApp(`<div class="wrap"><div class="card rhero"><div class="mut sm">${esc(rec.title)}</div>
   <div class="ring">${ring(p,150,12,col)}<div class="c"><div><b>${rec.score}</b><span class="sm mut">out of ${rec.max}</span></div></div></div>
   <h2>${p>=75?'Excellent work! 🎉':p>=50?'Good effort 👍':'Keep practising 💪'}</h2><div class="mut sm" style="margin-top:4px">${p}% · Accuracy ${acc}% · Time ${fmt(rec.used)}${rec.late?' · Submitted late':''}</div>
   <div class="s4"><div><b style="color:var(--ok)">${rec.correct}</b><span>Correct</span></div><div><b style="color:var(--bad)">${rec.wrong}</b><span>Wrong</span></div><div><b>${rec.skipped}</b><span>Skipped</span></div><div><b>${Qs.length}</b><span>Total</span></div></div></div>
   ${hasSec?`<div class="card" style="margin-top:12px"><b>Section-wise performance</b><div class="scroll" style="margin-top:8px"><table class="tbl sm"><tr><th>Section</th><th>Qs</th><th>✓</th><th>✗</th><th>Skip</th><th>Marks</th></tr>${secRows}</table></div></div>`:''}
   <div id="lb"></div>
   <div class="sec-h"><div class="seg">${fb('all','All')}${fb('c','Correct')}${fb('w','Wrong')}${fb('s','Skipped')}</div><button class="btn ghost sm" onclick="doneResult()">Done</button></div>
   ${hasSec?`<div class="seg" style="margin-bottom:12px">${sb('*','All sections')}${names.map(s=>sb(s,s||'General')).join('')}</div>`:''}
   ${items.map(({q,i,a,st})=>`<div class="card rv"><div class="row" style="margin-bottom:8px"><b>Q${i+1}</b>${st==='c'?'<span class="chip ok">Correct</span>':st==='w'?'<span class="chip" style="background:var(--badSoft);color:var(--bad)">Wrong</span>':'<span class="chip">Skipped</span>'}${q.sec?`<span class="chip">${esc(q.sec)}</span>`:''}<span style="flex:1"></span>${tid?bmBtn(tid,i)+rpBtn(tid,i):''}</div>
    <div class="qt">${esc(q.q)}</div>${imgTag(q.img)}
    ${q.options.map((o,j)=>{if(!o&&!(q.oimg&&q.oimg[j]))return '';const isC=j===q.answer,isY=j===a;return `<div class="ro ${isC?'c':(isY?'w':'')}"><span class="k">${L[j]}</span><span style="flex:1">${esc(o)}${imgTag(q.oimg&&q.oimg[j],'oi')}${isC||isY?`<span style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${isC?'<span class="tag g" style="margin:0">Correct answer</span>':''}${isY&&!isC?'<span class="tag r" style="margin:0">Your answer</span>':''}${isY&&isC?'<span class="tag g" style="margin:0">Your answer</span>':''}</span>`:''}</span></div>`}).join('')}
    ${q.answer==null?'<div class="sm mut" style="margin-top:6px">No answer key was set for this question, so it is not marked.</div>':''}
    ${q.explanation||q.eimg?`<div class="exp"><b>Explanation:</b> ${esc(q.explanation||'')}${imgTag(q.eimg)}</div>`:''}</div>`).join('')||'<div class="card empty">Nothing to show here.</div>'}
   <div style="text-align:center;margin-top:8px"><button class="btn" onclick="doneResult()">Back to tests</button></div></div>`);
}


/* ---------- boot ---------- */
async function init(){
  updateTheme();updateHeader();
  if(!cloud)return login();
  if(!AUTH)return login();
  loading('Loading…');
  await flushPending();
  // a test is still running on this device -> go straight back into it
  const rid=runningTest();
  if(rid){RET='#/';return startTest(rid)}
  route();
}
function runningTest(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('cbt_prog_'+AUTH.mobile+'_')){const p=LS.get(k,null);if(p&&p.tid)return p.tid}
    }
  }catch(e){}
  return null;
}
init();
</script>

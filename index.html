<!doctype html>
<html lang="en" data-theme="light" data-accent="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d6fe8">
<title>CBT Test Series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f9;--surface:#ffffff;--surface2:#eef2f6;--tx:#0e1b26;--mut:#5a6b7b;--bd:#dfe6ed;
  --pri:#1d6fe8;--pri2:#10a37f;--priSoft:#e6f0fe;
  --ok:#12945f;--okSoft:#e3f6ec;--bad:#dc3a4f;--badSoft:#fdecee;--warn:#c9780a;--warnSoft:#fff3df;
  --shadow:0 1px 2px rgba(14,27,38,.05),0 8px 24px rgba(14,27,38,.07);
  --grad:linear-gradient(135deg,#1d6fe8 0%,#12a58a 100%);
  --glow:rgba(29,111,232,.30);
  --r:16px;
}
html[data-theme="dark"]{
  --bg:#0b1117;--surface:#131b23;--surface2:#1b2631;--tx:#e7eef5;--mut:#93a4b5;--bd:#26343f;
  --pri:#5aa2ff;--pri2:#34d3a4;--priSoft:#14283f;
  --ok:#4fd69a;--okSoft:#112d22;--bad:#ff7a8a;--badSoft:#35161c;--warn:#f5b84a;--warnSoft:#33260d;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);
  --grad:linear-gradient(135deg,#2b7be8 0%,#14b08f 100%);
  --glow:rgba(43,123,232,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:var(--pri)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.hdr-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:17px;text-decoration:none;color:var(--tx)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px var(--glow)}
.sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--surface);color:var(--tx);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:hover{border-color:var(--pri)}
.chip-user{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px;cursor:pointer;color:var(--tx)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
body.intest .hdr{display:none}

.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
h1,h2,h3{letter-spacing:-.02em;margin:0}
.mut{color:var(--mut)}
.sm{font-size:13px}

/* buttons */
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--grad);color:#fff;box-shadow:0 6px 16px var(--glow);transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.soft{background:var(--priSoft);color:var(--pri);box-shadow:none}
.btn.warn{background:var(--warnSoft);color:var(--warn);box-shadow:none}
.btn.danger{background:var(--bad);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* cards */
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:24px;position:relative;overflow:hidden;box-shadow:0 14px 40px var(--glow)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-size:24px}
.hero p{margin:6px 0 0;opacity:.88}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;opacity:.85}

.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;gap:2px;max-width:100%;overflow:auto}
.seg button{border:0;background:transparent;color:var(--mut);padding:8px 16px;border-radius:9px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:18px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{display:flex;flex-direction:column;gap:12px}
.tcard h3{font-size:17px}
.tico{width:42px;height:42px;border-radius:12px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);color:var(--mut);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.chip.ok{background:var(--okSoft);color:var(--ok)}
.chip.pri{background:var(--priSoft);color:var(--pri)}
.chip.warn{background:var(--warnSoft);color:var(--warn)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}

.rrow{display:flex;align-items:center;gap:14px}
.rrow+.rrow{margin-top:10px}
.mring{width:54px;height:54px;flex:none;position:relative}
.mring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700}
.rrow .grow{flex:1;min-width:0}
.rrow .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=search],textarea,select{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--surface);color:var(--tx);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
textarea{min-height:90px;resize:vertical}
label.l{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.login{max-width:440px;margin:6vh auto 0}
.login .logo{width:52px;height:52px;border-radius:16px;margin-bottom:14px}

/* instructions */
.ins{max-width:640px;margin:20px auto}
.ins ul{padding-left:0;list-style:none;margin:14px 0}
.ins li{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--bd)}
.ins li:last-child{border:0}
.ins li svg{color:var(--pri);margin-top:2px}

/* test */
.tbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 14px}
.tb-title{font-weight:700;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-l{min-width:0;flex:1}
.timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;background:var(--priSoft);color:var(--pri);padding:7px 12px;border-radius:12px}
.timer.low{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.progress{height:3px;background:var(--surface2)}
.progress i{display:block;height:100%;background:var(--grad);transition:width .25s}
.tlayout{max-width:1080px;margin:0 auto;padding:16px 14px 150px;display:grid;grid-template-columns:1fr;gap:14px}
.qcard{padding:20px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qtext{white-space:pre-wrap;font-size:18px;line-height:1.6;margin-bottom:18px;font-weight:500}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:10px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--pri)}
.opt .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--mut)}
.opt .t{white-space:pre-wrap;padding-top:3px}
.opt.sel{border-color:var(--pri);background:var(--priSoft)}
.opt.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.pal button{height:42px;border-radius:11px;border:1.5px solid var(--bd);background:var(--surface);color:var(--tx);font-weight:600;font-size:14px;padding:0}
.pal button.na{background:var(--badSoft);border-color:transparent;color:var(--bad)}
.pal button.ans{background:var(--okSoft);border-color:transparent;color:var(--ok)}
.pal button.mark{background:var(--priSoft);border-color:transparent;color:var(--pri)}
.pal button.mans{background:var(--priSoft);border-color:var(--ok);color:var(--ok)}
.pal button.cur{box-shadow:0 0 0 2.5px var(--pri)}
.pal button:disabled{opacity:.55}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:14px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.side{display:none}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.bbar .r{display:flex;gap:8px;max-width:1080px;margin:0 auto;width:100%}
.bbar .r>*{flex:1}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(5,8,20,.55);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet .in{background:var(--surface);width:100%;max-height:82vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.grab{width:42px;height:4px;border-radius:9px;background:var(--bd);margin:0 auto 14px}
@media(min-width:960px){
  .tlayout{grid-template-columns:1fr 320px;align-items:start}
  .side{display:block;position:sticky;top:76px}
  .only-m{display:none!important}
}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,20,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:20px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow);border:1px solid var(--bd)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.mgrid div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.mgrid b{display:block;font-size:20px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;box-shadow:var(--shadow)}

/* result */
.rhero{text-align:center;padding:24px}
.ring{width:150px;height:150px;margin:6px auto 10px;position:relative}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;letter-spacing:-.03em;display:block;line-height:1.1}
.s4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.s4 div{background:var(--surface2);border-radius:12px;padding:10px 4px}
.s4 b{display:block;font-size:19px}
.s4 span{font-size:12px;color:var(--mut)}
.rv{margin-bottom:12px}
.ro{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;margin-bottom:8px;white-space:pre-wrap}
.ro.c{border-color:var(--ok);background:var(--okSoft)}
.ro.w{border-color:var(--bad);background:var(--badSoft)}
.ro .k{font-weight:700;min-width:20px}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.tag.g{background:var(--ok);color:#fff}
.tag.r{background:var(--bad);color:#fff}
.exp{background:var(--warnSoft);color:var(--tx);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin-top:8px}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.lb:last-child{border:0}
.lb .n{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700}
.lb.me{color:var(--pri);font-weight:700}

/* admin */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tbl th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow:auto;border-radius:var(--r)}
.qed{border-left:4px solid var(--pri)}
.qed.miss{border-left-color:var(--bad)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}

/* ================= v3: series / folders / admin ================= */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.scard{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s}
.scard:active{transform:scale(.99)}
.cover{height:96px;padding:14px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;right:-30px;bottom:-56px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16)}
.cover .ico{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;position:relative;z-index:1}
.cover .ico svg{width:22px;height:22px}
.pill{position:relative;z-index:1;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;letter-spacing:.03em;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);color:#4338ca}
.pill.free{color:#15803d}
.pill.paid{color:#b45309}
.pill svg{width:13px;height:13px}
.scard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.scard h3{font-size:17px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:14px;flex-wrap:wrap}
.crumb a{color:var(--mut);font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.crumb a:hover{color:var(--pri)}
.sh{border-radius:22px;color:#fff;padding:22px;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(60,60,160,.25)}
.sh:after{content:"";position:absolute;right:-50px;top:-60px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.14)}
.sh h1{font-size:23px;position:relative;z-index:1}
.sh p{margin:6px 0 0;opacity:.9;position:relative;z-index:1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{display:flex;gap:12px;align-items:center;cursor:pointer;padding:14px;transition:transform .12s}
.fcard:active{transform:scale(.99)}
.fico{width:46px;height:46px;border-radius:13px;background:var(--warnSoft);color:var(--warn);display:grid;place-items:center;flex:none}
.fcard b{display:block;line-height:1.25}
.trow{display:flex;gap:12px;align-items:center;padding:14px 16px;flex-wrap:wrap}
.trow+.trow{margin-top:10px}
.trow .info{flex:1;min-width:190px}
.trow .info h3{font-size:16px;margin-bottom:6px}
.trow .acts{display:flex;gap:8px;flex-wrap:wrap}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warnSoft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:14px;padding:12px 14px;margin:16px 0}
.banner .t{flex:1;min-width:200px}
.lockbadge{display:inline-flex;align-items:center;gap:5px}
.loading{display:grid;place-items:center;min-height:55vh;text-align:center;color:var(--mut)}
.spin{width:34px;height:34px;border:3px solid var(--surface2);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--bad)}
.okc{color:var(--ok)}
.divider{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:16px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--bd)}
.big-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:34px;font-weight:800;letter-spacing:.14em;text-align:center;background:var(--surface2);border-radius:14px;padding:16px 8px;margin:12px 0;user-select:all;-webkit-user-select:all}
.intest .qcard{user-select:none;-webkit-user-select:none}
.h2s{font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.h2s .n{font-size:13px;font-weight:700;color:var(--mut)}

/* admin */
.atabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px}
.atabs button{border:0;background:var(--surface);color:var(--mut);padding:10px 16px;border-radius:12px;font-weight:700;white-space:nowrap;border:1px solid var(--bd)}
.atabs button.on{background:var(--grad);color:#fff;border-color:transparent}
.atabs .cnt{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px}
.pane{display:none;margin-top:16px}
.pane.on{display:block}
.srow{display:flex;gap:12px;align-items:center;padding:12px 14px}
.srow+.srow{margin-top:8px}
.srow .grow{flex:1;min-width:0}
.srow .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.reqcard{border:1.5px solid var(--warn);background:var(--warnSoft)}
.acc{padding:0;overflow:hidden}
.acc>.hd{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.acc>.hd .grow{flex:1;min-width:0}
.acc>.bd{display:none;border-top:1px solid var(--bd);padding:12px 16px 16px;background:var(--surface2)}
.acc.open>.bd{display:block}
.chev{transition:transform .2s}
.acc.open .chev{transform:rotate(90deg)}
.arow{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--bd);border-radius:12px;margin-top:8px;flex-wrap:wrap}
.arow .grow{flex:1;min-width:160px}
.fhead{display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:700}
.modal .box.wide{max-width:560px;max-height:90vh;overflow:auto}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0}
.chk input{width:20px;height:20px;flex:none}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.btn.sm svg,.btn svg{width:16px;height:16px}

/* ================= v4: CBT mode, dashboard, images ================= */
.cbtbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:2px solid var(--pri);display:flex;align-items:center;gap:10px;padding:8px 14px}
.cbtbar .cand{display:flex;align-items:center;gap:5px}
.stabs{display:flex;gap:4px;overflow:auto;background:var(--surface2);padding:6px 10px;border-bottom:1px solid var(--bd);position:sticky;top:56px;z-index:19}
.stabs button{border:1px solid var(--bd);background:var(--surface);color:var(--tx);padding:7px 16px;border-radius:8px;font-weight:700;font-size:13px;white-space:nowrap}
.stabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.stabs button:disabled{opacity:.5}
.bbar .r.nav .btn{flex:1}

/* ---------- progress stats / profile ---------- */
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
function pstats(R){
  const days=new Set(R.map(x=>dkey(x.at)));
  let streak=0,d=new Date();
  if(!days.has(dkey(d)))d.setDate(d.getDate()-1);
  while(days.has(dkey(d))){streak++;d.setDate(d.getDate()-1)}
  const week=[];
  for(let i=6;i>=0;i--){const e=new Date();e.setDate(e.getDate()-i);const k=dkey(e);
    week.push({l:e.toLocaleDateString('en-IN',{weekday:'short'}).slice(0,2),n:R.filter(x=>dkey(x.at)===k).length})}
  const tot=R.reduce((a,x)=>a+x.correct+x.wrong,0),cor=R.reduce((a,x)=>a+x.correct,0);
  const best=R.length?Math.max(...R.map(x=>pct(x.score,x.max))):0;
  const avg=R.length?Math.round(R.reduce((a,x)=>a+pct(x.score,x.max),0)/R.length):0;
  const n=R.length,lvl=n>=25?'Champion':n>=10?'Achiever':n>=3?'Learner':'Beginner';
  const badges=[
    {i:'🚀',t:'First test',on:n>=1},{i:'📚',t:'5 tests done',on:n>=5},{i:'🏅',t:'20 tests done',on:n>=20},
    {i:'🎯',t:'Score 70%+',on:best>=70},{i:'🔥',t:'3-day streak',on:streak>=3},{i:'⭐',t:'10 bookmarks',on:BM.size>=10}];
  return{streak,week,tot,cor,acc:tot?Math.round(cor*100/tot):0,best,avg,n,lvl,badges,secs:R.reduce((a,x)=>a+(x.used||0),0)};
}
const maskMob=m=>{m=String(m||'');return m.length>=10?m.slice(0,2)+'••••••'+m.slice(-2):m};

function spark(vals){

}

  if(nxt)o+=`<div class="h2s">${ic('play',20)} Up next for you</div><div class="next"><div class="grow"><b>${esc(nxt.title)}</b><div class="sm mut">${nxt.questions} questions · ${nxt.duration} min</div></div><button class="btn sm" onclick="openTest('${nxt.id}')">Start</button></div>`;
  if(R.length){

      <div class="card"><b>This week</b><span class="sm mut"> · tests per day</span><div class="week">${P.week.map(w=>`<div><i class="${w.n?'':'z'}" style="height:${w.n?Math.max(14,w.n/mx*100):0}%"></i>${w.l}</div>`).join('')}</div></div></div>
      ${trend.length>1?`<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><b>Score trend</b><span class="sm mut">Last ${trend.length} tests · best ${P.best}%</span></div><div class="trend">${spark(trend)}</div></div>`:''}
      <div class="h2s">${ic('trophy',20)} Achievements <span class="n">${P.badges.filter(b=>b.on).length}/${P.badges.length}</span></div><div class="badges">${P.badges.map(b=>`<div class="bdg ${b.on?'on':''}"><b>${b.i}</b>${b.t}</div>`).join('')}</div>

function lockBanner(s){
  if(s.is_free||s.unlocked)return '';
  const wa=waLink(`Hi, I am ${AUTH.name} (${AUTH.mobile}). Please unlock "${s.title}" for me.`);
  return `<div class="banner"><div style="color:var(--warn)">${ic('lock',26)}</div><div class="t"><b>Premium series</b><div class="sm mut">${esc(s.price_label?s.price_label+' · ':'')}Ask the admin to unlock this series for you. Some tests may be open as a free preview.</div></div>
   ${wa?`<a class="btn sm" style="text-decoration:none" href="${wa}" target="_blank" rel="noopener">${ic('msg')} Unlock</a>`:''}</div>`;
}
const KIND={syllabus:'Syllabus',schedule:'Schedule',notes:'Notes'};
const fsize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function filesBlock(s){
  const fl=s.files||[];if(!fl.length)return '';
  return `<div class="h2s">${ic('file',20)} Syllabus &amp; schedule</div><div class="card">${fl.map(f=>`<div class="rrow"><div class="tico">${ic('file')}</div>
    <div class="grow"><b>${esc(f.title)}</b><span class="sm mut">${KIND[f.kind]||'File'} · ${fsize(f.size)}</span></div>
    <button class="btn soft sm" onclick="openFile('${f.id}')">${ic('download')} Open</button></div>`).join('')}</div>`;
}
async function openFile(id){
  if(FILEURL[id])return showFile(id);
  modal(`<div class="spin"></div><p class="mut" style="text-align:center" id="fp">Downloading…</p>`);
  const parts=[];let n=0,total=1,mime='application/pdf',name='file';
  while(n<total){
    const r=await rpc('cbt_file_part',{p_file:id,p_n:n});
    if(!r.ok){closeModal();if(!authErr(r))toast('Could not download this file.');return}
    total=r.parts;mime=r.mime;name=r.name;parts.push(r.data||'');n++;
    const e=$('#fp');if(e)e.textContent=`Downloading… ${Math.round(n*100/total)}%`;
  }
  try{
    const bin=atob(parts.join(''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    FILEURL[id]={url:URL.createObjectURL(new Blob([u],{type:mime})),name};
  }catch(e){closeModal();toast('This file is damaged.');return}
  showFile(id);
}
function showFile(id){
  const f=FILEURL[id];
  modal(`<div class="logo" style="background:var(--ok)">${ic('check',24)}</div><h2>File ready</h2><p class="mut" style="margin:6px 0 14px">${esc(f.name)}</p>
   <div class="row"><a class="btn" style="flex:1;text-decoration:none" href="${f.url}" target="_blank" rel="noopener">${ic('eye')} View</a><a class="btn soft" style="flex:1;text-decoration:none" href="${f.url}" download="${esc(f.name)}">${ic('download')} Save</a></div>
   <button class="btn ghost block" style="margin-top:10px" onclick="closeModal()">Close</button>`);
}
function viewSeries(id){

  <div class="sh" style="background:${grad(s.id)}" data-cov="${s.id}" data-v="${s.cover_v||0}"><div style="position:relative;z-index:1;margin-bottom:8px">${badge(s)}</div>
   <h1>${esc(s.title)}</h1>${s.description?`<p>${esc(s.description)}</p>`:''}</div>${lockBanner(s)}${filesBlock(s)}`;

function viewFolder(id){

function testRow(t){
  const p=t.best!=null&&t.best_max?pct(t.best,t.best_max):null;
  const last=(CAT.results||[]).find(r=>r.test_id===t.id);
  const wait=isWait(t);
  const status=t.in_progress?'<span class="chip warn">In progress</span>':wait?`<span class="chip pri">${ic('calendar',12)} ${esc(fmtWhen(t.opens_at))}</span>`:t.locked?`<span class="chip lockbadge">${ic('lock',12)} Locked</span>`
    :t.attempts?`<span class="chip ok">Attempted ${t.attempts}×</span>`:'<span class="chip pri">New</span>';
  const cta=t.locked?`<button class="btn ghost sm" onclick="openTest('${t.id}')">${ic('lock')} Unlock</button>`
    :(wait&&!t.in_progress)?`<button class="btn ghost sm" disabled>${ic('clock')} <span data-op="${t.opens_at}">--:--</span></button>`
    :`<button class="btn sm" onclick="openTest('${t.id}')">${t.in_progress?'Resume':t.attempts?'Try again':'Start'} ${ic('right')}</button>`;
  return `<div class="card trow"><div class="tico">${ic(t.locked?'lock':wait?'calendar':'file')}</div>
   <div class="info"><h3>${esc(t.title)}</h3><div class="chips"><span class="chip">${t.questions} questions</span><span class="chip">${t.duration} min</span>${status}${t.free_preview&&t.locked===false?'<span class="chip pri">Free preview</span>':''}</div>
   ${p!=null?`<div style="margin-top:10px"><div class="row sm mut" style="justify-content:space-between;margin-bottom:5px"><span>Best score</span><b style="color:var(--tx)">${t.best}/${t.best_max} · ${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`:''}</div>
   <div class="acts">${last?`<button class="btn soft sm" onclick="openReview('${last.id}')">${ic('eye')} Review</button>`:''}${cta}</div></div>`;
}

async function toggleBM(tid,i,fromBM){
  const k=tid+':'+i,on=!BM.has(k);
  if(on)BM.add(k);else BM.delete(k);
  const b=document.querySelector(`[data-bm="${k}"]`);if(b)b.classList.toggle('on',on);
  const r=await rpc('cbt_bookmark',{p_test:tid,p_qidx:i,p_on:on});
  if(!r.ok){
    if(on)BM.delete(k);else BM.add(k);
    if(b)b.classList.toggle('on',!on);
    toast(r.error==='limit'?'Bookmark limit reached (500).':'Could not save the bookmark.');return;
  }
  if(fromBM){const c=document.querySelector(`[data-bmcard="${k}"]`);if(c&&!on)c.remove()}
  else toast(on?'Bookmarked ★':'Bookmark removed');
}

async function startTest(id){
  loading('Starting your test…');
  const r=await rpc('cbt_start',{p_test:id});
  if(!r.ok){
    if(authErr(r))return;
    if(r.error==='locked'||r.error==='not_found')LS.del(progKey(id));
    if(r.error==='locked'){CAT=null;await route();toast('This test is locked.');return}
    if(r.error==='not_open'){CAT=null;await route();toast('This test opens on '+fmtWhen(r.opens_at));return}
    toast(r.error==='not_found'?'This test is no longer available.':errText(r));CAT=null;route();return;
  }
  T=r.test;const off=r.now-Date.now();SOFF=off;
  let p=getProg(id);
  if(!(p&&p.sid===r.session.id))p={tid:id,sid:r.session.id,cid:uuid(),ans:{},mark:{},vis:{0:1},cur:0,title:T.title};
  p.ends=r.session.ends_at;p.off=off;
  if(p.cur>=T.questions.length)p.cur=0;
  P=p;saveProg();
  if(P.ends-(Date.now()+P.off)<=0){return finish(true)}
  INTEST=true;warned=false;run();
}
function secSetup(){
  const names=[];T.questions.forEach(q=>{const s=q.sec||'';if(!names.includes(s))names.push(s)});
  SEC={names,has:names.some(x=>x),of:i=>T.questions[i].sec||'',label:s=>s||'General'};
}
function run(){
  document.body.classList.add('intest');palOpen=false;secSetup();
  window.onbeforeunload=e=>{e.preventDefault();e.returnValue=''};
  clearInterval(timer);draw();timer=setInterval(tick,1000);tick();
}
function tick(){
  if(!P)return;
  const left=Math.round((P.ends-(Date.now()+P.off))/1000);
  const e=$('#tm');if(e){e.querySelector('span').textContent=fmt(left);e.classList.toggle('low',left<=300)}
  if(T&&T.duration>10&&left<=300&&left>295&&!warned){warned=true;toast('Only 5 minutes left!')}
  if(left<=0){clearInterval(timer);toast("Time's up! Submitting your test…");finish(true)}
}
const stOf=i=>{const has=P.ans[i]!=null,mk=P.mark[i];return mk?(has?'mans':'mark'):has?'ans':P.vis[i]?'na':'nv'};
function countsOf(idx){
  const c={nv:0,na:0,ans:0,mark:0,mans:0};idx.forEach(i=>c[stOf(i)]++);return c;
}
const allIdx=()=>T.questions.map((_,i)=>i);
const secIdx=name=>allIdx().filter(i=>SEC.of(i)===name);
function counts(){const c=countsOf(allIdx());return{a:c.ans+c.mans,u:T.questions.length-c.ans-c.mans,m:c.mark+c.mans,n:T.questions.length}}
function palHtml(){
  const lock=!!T.lock_back,cur=SEC.of(P.cur),idx=SEC.has?secIdx(cur):allIdx(),c=countsOf(idx);
  return `${SEC.has?`<div class="sm mut" style="margin-bottom:8px"><b style="color:var(--tx)">${esc(SEC.label(cur))}</b></div>`:''}
  <div class="pal">${idx.map(i=>`<button class="${stOf(i)} ${i===P.cur?'cur':''}" ${lock?'disabled':''} onclick="go(${i})">${i+1}</button>`).join('')}</div>
  <div class="leg2"><span><i class="lg ans">${c.ans}</i>Answered</span><span><i class="lg na">${c.na}</i>Not answered</span><span><i class="lg nv">${c.nv}</i>Not visited</span><span><i class="lg mark">${c.mark}</i>Marked</span><span style="grid-column:1/3"><i class="lg mans">${c.mans}</i>Answered &amp; marked (will be evaluated)</span></div>`;
}
function draw(){
  const n=T.questions.length,q=T.questions[P.cur],a=P.ans[P.cur],lock=!!T.lock_back;
  P.vis[P.cur]=1;
  const secTabs=SEC.has?`<div class="stabs">${SEC.names.map(s=>`<button class="${s===SEC.of(P.cur)?'on':''}" ${lock?'disabled':''} onclick="goSec(${JSON.stringify(s).replace(/"/g,'&quot;')})">${esc(SEC.label(s))}</button>`).join('')}</div>`:'';
  $('#app').innerHTML=(`<div class="cbtbar"><div class="tb-l"><div class="tb-title">${esc(T.title)}</div><div class="sm mut cand">${ic('user',13)} ${esc(AUTH.name||'')}</div></div>
   <div class="timer" id="tm">${ic('clock')}<span>--:--</span></div><button class="btn danger sm" onclick="submitAsk()">Submit</button></div>${secTabs}
   <div class="tlayout"><section class="card qcard"><div class="qmeta"><b>Question ${P.cur+1} <span class="mut" style="font-weight:500">of ${n}</span></b><span class="chip ok">+${T.correct}</span><span class="chip warn">−${T.wrong}</span>${P.mark[P.cur]?'<span class="chip pri">Marked</span>':''}<span style="flex:1"></span>${bmBtn(P.tid,P.cur)}${rpBtn(P.tid,P.cur)}</div>
   <div class="qtext">${esc(q.q)}</div>${imgTag(q.img)}
   ${q.options.map((o,i)=>(o||(q.oimg&&q.oimg[i]))?`<button class="opt ${a===i?'sel':''}" onclick="sel(${i})"><span class="k">${L[i]}</span><span class="t">${esc(o)}${imgTag(q.oimg&&q.oimg[i],'oi')}</span></button>`:'').join('')}</section>
   <aside class="side card"><div class="candbox"><div class="avatar" style="width:40px;height:40px;font-size:16px">${esc((AUTH.name||'?').trim()[0].toUpperCase())}</div><div><b>${esc(AUTH.name||'')}</b><div class="sm mut">Candidate</div></div></div>${palHtml()}
   <button class="btn danger block" style="margin-top:14px" onclick="submitAsk()">Submit test</button></aside></div>
   <div class="bbar"><div class="r"><button class="btn warn sm" onclick="markNext()">${ic('flag')} Mark &amp; Next</button><button class="btn ghost sm" onclick="clr()">Clear</button><button class="btn sm" onclick="saveNext()">Save &amp; Next ${ic('right')}</button></div>
   <div class="r nav">${lock?'':`<button class="btn ghost sm" ${P.cur===0?'disabled':''} onclick="go(${P.cur-1})">${ic('left')} Back</button>`}<button class="btn soft sm only-m" onclick="pal(true)">${ic('grid')} Palette</button>${lock?'':`<button class="btn ghost sm" ${P.cur===n-1?'disabled':''} onclick="go(${P.cur+1})">Next ${ic('right')}</button>`}</div></div>
   <div class="sheet ${palOpen?'open':''}" onclick="if(event.target===this)pal(false)"><div class="in"><div class="grab"></div><b>Question palette</b><div style="margin-top:12px">${palHtml()}</div>
   <button class="btn danger block" style="margin-top:14px" onclick="submitAsk()">Submit test</button></div></div>`);
  tick();
}
function pal(v){palOpen=v;const s=document.querySelector('.sheet');if(s)s.classList.toggle('open',v)}
function go(i){if(i<0||i>=T.questions.length)return;P.cur=i;palOpen=false;saveProg();draw();window.scrollTo(0,0)}
function goSec(name){const idx=secIdx(name);if(!idx.length)return;go(idx.includes(P.cur)?P.cur:idx[0])}
function sel(i){P.ans[P.cur]=i;saveProg();draw()}
function clr(){delete P.ans[P.cur];saveProg();draw()}
function saveNext(){delete P.mark[P.cur];nxt()}
function markNext(){P.mark[P.cur]=1;nxt()}
function nxt(){if(P.cur<T.questions.length-1)P.cur++;saveProg();draw();window.scrollTo(0,0)}

/* ---------- submitting (answers are marked on the server) ---------- */

const pendKey=()=>'cbt_pend_'+AUTH.mobile;
const getPend=()=>LS.get(pendKey(),[]);
function addPend(it){const l=getPend().filter(x=>x.cid!==it.cid);l.push(it);LS.set(pendKey(),l)}
function delPend(cid){LS.set(pendKey(),getPend().filter(x=>x.cid!==cid))}
function submitAsk(){
  const c=counts();
  const rows=SEC.has?SEC.names.map(s=>{const idx=secIdx(s),k=countsOf(idx);return `<tr><td>${esc(SEC.label(s))}</td><td>${idx.length}</td><td>${k.ans+k.mans}</td><td>${k.na+k.nv}</td><td>${k.mark+k.mans}</td></tr>`}).join(''):'';
  modal(`<h2>Submit test?</h2><p class="mut" style="margin:6px 0 0">You won't be able to change your answers after this.</p>
  ${SEC.has?`<div class="scroll" style="margin-top:12px"><table class="tbl sm"><tr><th>Section</th><th>Total</th><th>Done</th><th>Left</th><th>Marked</th></tr>${rows}</table></div>`
  :`<div class="mgrid"><div><b style="color:var(--ok)">${c.a}</b><span class="sm mut">Answered</span></div><div><b style="color:var(--bad)">${c.u}</b><span class="sm mut">Unanswered</span></div><div><b style="color:var(--pri)">${c.m}</b><span class="sm mut">Marked</span></div></div>`}
  <div class="row" style="margin-top:16px"><button class="btn ghost" style="flex:1" onclick="closeModal()">Keep going</button><button class="btn danger" style="flex:1" onclick="closeModal();finish(false)">Submit</button></div>`);
}
async function finish(auto){
  clearInterval(timer);window.onbeforeunload=null;
  const it={tid:P.tid,cid:P.cid,ans:P.ans,title:(T&&T.title)||P.title,ts:Date.now()};
  addPend(it);LS.del(progKey(P.tid));
  INTEST=false;P=null;T=null;document.body.classList.remove('intest');
  await sendPending(it);
}
let CURPEND=null;
async function sendPending(it){
  CURPEND=it;clearTimeout(retryT);loading('Submitting your answers…');
  const r=await rpc('cbt_submit',{p_test:it.tid,p_answers:it.ans,p_client_id:it.cid});
  if(r.ok){
    delPend(it.cid);CAT=null;
    RV={result:r.result,review:r.review,filter:'all'};
    showResult();lb(r.result);return;
  }
  if(r.error==='network'||r.error==='server'){
    setApp(`<div class="wrap"><div class="card empty">${ic('wifi',32)}<h3 style="margin:10px 0 4px">No connection</h3>
      <p class="sm">Your answers are saved on this phone. We will keep trying to submit them. Please stay on this page.</p>
      <button class="btn" onclick="sendPending(CURPEND)">Try again now</button></div></div>`);
    retryT=setTimeout(()=>sendPending(it),8000);return;
  }
  if(authErr(r))return;
  delPend(it.cid);CAT=null;
  toast(r.error==='no_session'?'This attempt was already closed.':'Could not submit this test.');
  location.hash=RET;route();
}
async function flushPending(){
  if(!AUTH)return;
  // expired local progress -> submit
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('cbt_prog_'+AUTH.mobile+'_')){
        const p=LS.get(k,null);
        if(p&&p.ends&&p.ends<=Date.now()+(p.off||0)){addPend({tid:p.tid,cid:p.cid,ans:p.ans||{},title:p.title,ts:Date.now()});LS.del(k)}
      }
    }
  }catch(e){}
  for(const it of getPend()){
    const r=await rpc('cbt_submit',{p_test:it.tid,p_answers:it.ans,p_client_id:it.cid});
    if(r.ok||['no_session','not_found'].includes(r.error))delPend(it.cid);
    if(r.ok)toast('Your earlier test was submitted.');
  }
}


/* ---------- result / review ---------- */
async function openReview(id){
  loading('Loading your answers…');
  const r=await rpc('cbt_review',{p_result:id});
  if(!r.ok){if(authErr(r))return;toast('Could not load this result.');route();return}
  if(r.gone){toast('This test is no longer available for review.');route();return}
  if(!CAT)await loadCat(true);
  BM=BM||new Set();
  RV={result:r.result,review:r.review,filter:'all',sec:'*'};showResult();lb(r.result);
}
async function lb(res){
  if(!res.test_id)return;
  const r=await rpc('cbt_leaderboard',{p_test:res.test_id});
  const el=$('#lb');if(!el||!r.ok||!r.top||!r.top.length)return;
  el.innerHTML=`<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><b>${ic('trophy')} Leaderboard</b>${r.my_rank?`<span class="chip pri">Your rank #${r.my_rank} of ${r.total}</span>`:''}</div>
   ${r.top.map(x=>`<div class="lb ${x.me?'me':''}"><span class="n">${x.rank}</span><span style="flex:1">${esc(x.name)}${x.me?' (you)':''}</span><b>${x.score}</b></div>`).join('')}</div>`;
}
function setFilter(f){RV.filter=f;showResult()}
function setSecF(s){RV.sec=s;showResult()}
function doneResult(){RV=null;CAT=null;const h=RET&&RET!=='#/'?RET:'#/r';history.replaceState(null,'',h);route()}
function showResult(){
  document.body.classList.remove('intest');
  const rec=RV.result,f=RV.filter,Qs=RV.review,ans=rec.answers||{};
  const p=pct(rec.score,rec.max),col=ringCol(p),acc=rec.correct+rec.wrong?Math.round(rec.correct*100/(rec.correct+rec.wrong)):0;
  const all=Qs.map((q,i)=>{const a=ans[i]!=null?+ans[i]:null;return{q,i,a,st:q.answer==null||a==null?'s':(a===q.answer?'c':'w')}});
  const names=[];Qs.forEach(q=>{const s=q.sec||'';if(!names.includes(s))names.push(s)});
  const hasSec=names.some(x=>x);
  const cm=Qs.length?rec.max/Qs.length:0,wm=rec.wrong?(rec.correct*cm-rec.score)/rec.wrong:0;
  const secRows=hasSec?names.map(s=>{
    const it=all.filter(x=>(x.q.sec||'')===s),c=it.filter(x=>x.st==='c').length,w=it.filter(x=>x.st==='w').length,k=it.length-c-w;
    return `<tr><td><b>${esc(s||'General')}</b></td><td>${it.length}</td><td style="color:var(--ok)">${c}</td><td style="color:var(--bad)">${w}</td><td>${k}</td><td><b>${Math.round((c*cm-w*wm)*100)/100}</b>/${Math.round(it.length*cm*100)/100}</td></tr>`}).join(''):'';
  const sf=RV.sec||'*';
  const items=all.filter(x=>(f==='all'||x.st===f)&&(!hasSec||sf==='*'||(x.q.sec||'')===sf));
  const fb=(k,t)=>`<button class="${f===k?'on':''}" onclick="setFilter('${k}')">${t}</button>`;
  const sb=(k,t)=>`<button class="${sf===k?'on':''}" onclick="setSecF(${JSON.stringify(k).replace(/"/g,'&quot;')})">${esc(t)}</button>`;
  const tid=rec.test_id;
  setApp(`<div class="wrap"><div class="card rhero"><div class="mut sm">${esc(rec.title)}</div>
   <div class="ring">${ring(p,150,12,col)}<div class="c"><div><b>${rec.score}</b><span class="sm mut">out of ${rec.max}</span></div></div></div>
   <h2>${p>=75?'Excellent work! 🎉':p>=50?'Good effort 👍':'Keep practising 💪'}</h2><div class="mut sm" style="margin-top:4px">${p}% · Accuracy ${acc}% · Time ${fmt(rec.used)}${rec.late?' · Submitted late':''}</div>
   <div class="s4"><div><b style="color:var(--ok)">${rec.correct}</b><span>Correct</span></div><div><b style="color:var(--bad)">${rec.wrong}</b><span>Wrong</span></div><div><b>${rec.skipped}</b><span>Skipped</span></div><div><b>${Qs.length}</b><span>Total</span></div></div></div>
   ${hasSec?`<div class="card" style="margin-top:12px"><b>Section-wise performance</b><div class="scroll" style="margin-top:8px"><table class="tbl sm"><tr><th>Section</th><th>Qs</th><th>✓</th><th>✗</th><th>Skip</th><th>Marks</th></tr>${secRows}</table></div></div>`:''}
   <div id="lb"></div>
   <div class="sec-h"><div class="seg">${fb('all','All')}${fb('c','Correct')}${fb('w','Wrong')}${fb('s','Skipped')}</div><button class="btn ghost sm" onclick="doneResult()">Done</button></div>
   ${hasSec?`<div class="seg" style="margin-bottom:12px">${sb('*','All sections')}${names.map(s=>sb(s,s||'General')).join('')}</div>`:''}
   ${items.map(({q,i,a,st})=>`<div class="card rv"><div class="row" style="margin-bottom:8px"><b>Q${i+1}</b>${st==='c'?'<span class="chip ok">Correct</span>':st==='w'?'<span class="chip" style="background:var(--badSoft);color:var(--bad)">Wrong</span>':'<span class="chip">Skipped</span>'}${q.sec?`<span class="chip">${esc(q.sec)}</span>`:''}<span style="flex:1"></span>${tid?bmBtn(tid,i)+rpBtn(tid,i):''}</div>
    <div class="qt">${esc(q.q)}</div>${imgTag(q.img)}
    ${q.options.map((o,j)=>{if(!o&&!(q.oimg&&q.oimg[j]))return '';const isC=j===q.answer,isY=j===a;return `<div class="ro ${isC?'c':(isY?'w':'')}"><span class="k">${L[j]}</span><span style="flex:1">${esc(o)}${imgTag(q.oimg&&q.oimg[j],'oi')}${isC||isY?`<span style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${isC?'<span class="tag g" style="margin:0">Correct answer</span>':''}${isY&&!isC?'<span class="tag r" style="margin:0">Your answer</span>':''}${isY&&isC?'<span class="tag g" style="margin:0">Your answer</span>':''}</span>`:''}</span></div>`}).join('')}
    ${q.answer==null?'<div class="sm mut" style="margin-top:6px">No answer key was set for this question, so it is not marked.</div>':''}
    ${q.explanation||q.eimg?`<div class="exp"><b>Explanation:</b> ${esc(q.explanation||'')}${imgTag(q.eimg)}</div>`:''}</div>`).join('')||'<div class="card empty">Nothing to show here.</div>'}
   <div style="text-align:center;margin-top:8px"><button class="btn" onclick="doneResult()">Back to tests</button></div></div>`);
}


/* ---------- boot ---------- */
async function init(){
  updateTheme();updateHeader();
  if(getComputedStyle(document.documentElement).getPropertyValue('--cssv').trim()!=='5'){const b=document.createElement('div');b.className='cssbanner';b.textContent='Design is not fully updated. Please upload the new style.css to GitHub, then refresh.';b.style.cssText='position:fixed;left:12px;right:12px;top:12px;z-index:99;background:#c9780a;color:#fff;border-radius:14px;padding:12px 14px;font-weight:600';document.body.appendChild(b)}
  if(!cloud)return login();
  if(!AUTH)return login();
  loading('Loading…');
  await flushPending();
  // a test is still running on this device -> go straight back into it
  const rid=runningTest();
  if(rid){RET='#/';return startTest(rid)}
  route();
}
function runningTest(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('cbt_prog_'+AUTH.mobile+'_')){const p=LS.get(k,null);if(p&&p.tid)return p.tid}
    }
  }catch(e){}
  return null;
}
init();
</script>

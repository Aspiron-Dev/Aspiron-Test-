<!doctype html>
<html lang="en" data-theme="light" data-accent="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6f9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CBT Tests">
<title>CBT Test Series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f9;--surface:#ffffff;--surface2:#eef2f6;--tx:#0e1b26;--mut:#5a6b7b;--bd:#dfe6ed;
  --pri:#1d6fe8;--pri2:#10a37f;--priSoft:#e6f0fe;
  --ok:#12945f;--okSoft:#e3f6ec;--bad:#dc3a4f;--badSoft:#fdecee;--warn:#c9780a;--warnSoft:#fff3df;
  --shadow:0 1px 2px rgba(14,27,38,.05),0 8px 24px rgba(14,27,38,.07);
  --grad:linear-gradient(135deg,#1d6fe8 0%,#12a58a 100%);
  --glow:rgba(29,111,232,.30);
  --r:16px;
}
html[data-theme="dark"]{
  --bg:#0b1117;--surface:#131b23;--surface2:#1b2631;--tx:#e7eef5;--mut:#93a4b5;--bd:#26343f;
  --pri:#5aa2ff;--pri2:#34d3a4;--priSoft:#14283f;
  --ok:#4fd69a;--okSoft:#112d22;--bad:#ff7a8a;--badSoft:#35161c;--warn:#f5b84a;--warnSoft:#33260d;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);
  --grad:linear-gradient(135deg,#2b7be8 0%,#14b08f 100%);
  --glow:rgba(43,123,232,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:var(--pri)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.hdr-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:17px;text-decoration:none;color:var(--tx)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px var(--glow)}
.sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--surface);color:var(--tx);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:hover{border-color:var(--pri)}
.chip-user{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px;cursor:pointer;color:var(--tx)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
body.intest .hdr{display:none}

.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
h1,h2,h3{letter-spacing:-.02em;margin:0}
.mut{color:var(--mut)}
.sm{font-size:13px}

/* buttons */
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--grad);color:#fff;box-shadow:0 6px 16px var(--glow);transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.soft{background:var(--priSoft);color:var(--pri);box-shadow:none}
.btn.warn{background:var(--warnSoft);color:var(--warn);box-shadow:none}
.btn.danger{background:var(--bad);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* cards */
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:24px;position:relative;overflow:hidden;box-shadow:0 14px 40px var(--glow)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-size:24px}
.hero p{margin:6px 0 0;opacity:.88}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;opacity:.85}

.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;gap:2px;max-width:100%;overflow:auto}
.seg button{border:0;background:transparent;color:var(--mut);padding:8px 16px;border-radius:9px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:18px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{display:flex;flex-direction:column;gap:12px}
.tcard h3{font-size:17px}
.tico{width:42px;height:42px;border-radius:12px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);color:var(--mut);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.chip.ok{background:var(--okSoft);color:var(--ok)}
.chip.pri{background:var(--priSoft);color:var(--pri)}
.chip.warn{background:var(--warnSoft);color:var(--warn)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}

.rrow{display:flex;align-items:center;gap:14px}
.rrow+.rrow{margin-top:10px}
.mring{width:54px;height:54px;flex:none;position:relative}
.mring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700}
.rrow .grow{flex:1;min-width:0}
.rrow .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=search],textarea,select{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--surface);color:var(--tx);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
textarea{min-height:90px;resize:vertical}
label.l{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.login{max-width:440px;margin:6vh auto 0}
.login .logo{width:52px;height:52px;border-radius:16px;margin-bottom:14px}

/* instructions */
.ins{max-width:640px;margin:20px auto}
.ins ul{padding-left:0;list-style:none;margin:14px 0}
.ins li{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--bd)}
.ins li:last-child{border:0}
.ins li svg{color:var(--pri);margin-top:2px}

/* test */
.tbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 14px}
.tb-title{font-weight:700;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-l{min-width:0;flex:1}
.timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;background:var(--priSoft);color:var(--pri);padding:7px 12px;border-radius:12px}
.timer.low{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.progress{height:3px;background:var(--surface2)}
.progress i{display:block;height:100%;background:var(--grad);transition:width .25s}
.tlayout{max-width:1080px;margin:0 auto;padding:16px 14px 150px;display:grid;grid-template-columns:1fr;gap:14px}
.qcard{padding:20px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qtext{white-space:pre-wrap;font-size:18px;line-height:1.6;margin-bottom:18px;font-weight:500}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:10px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--pri)}
.opt .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--mut)}
.opt .t{white-space:pre-wrap;padding-top:3px}
.opt.sel{border-color:var(--pri);background:var(--priSoft)}
.opt.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.pal button{height:42px;border-radius:11px;border:1.5px solid var(--bd);background:var(--surface);color:var(--tx);font-weight:600;font-size:14px;padding:0}
.pal button.na{background:var(--badSoft);border-color:transparent;color:var(--bad)}
.pal button.ans{background:var(--okSoft);border-color:transparent;color:var(--ok)}
.pal button.mark{background:var(--priSoft);border-color:transparent;color:var(--pri)}
.pal button.mans{background:var(--priSoft);border-color:var(--ok);color:var(--ok)}
.pal button.cur{box-shadow:0 0 0 2.5px var(--pri)}
.pal button:disabled{opacity:.55}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:14px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.side{display:none}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.bbar .r{display:flex;gap:8px;max-width:1080px;margin:0 auto;width:100%}
.bbar .r>*{flex:1}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(5,8,20,.55);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet .in{background:var(--surface);width:100%;max-height:82vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.grab{width:42px;height:4px;border-radius:9px;background:var(--bd);margin:0 auto 14px}
@media(min-width:960px){
  .tlayout{grid-template-columns:1fr 320px;align-items:start}
  .side{display:block;position:sticky;top:76px}
  .only-m{display:none!important}
}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,20,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:20px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow);border:1px solid var(--bd)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.mgrid div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.mgrid b{display:block;font-size:20px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;box-shadow:var(--shadow)}

/* result */
.rhero{text-align:center;padding:24px}
.ring{width:150px;height:150px;margin:6px auto 10px;position:relative}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;letter-spacing:-.03em;display:block;line-height:1.1}
.s4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.s4 div{background:var(--surface2);border-radius:12px;padding:10px 4px}
.s4 b{display:block;font-size:19px}
.s4 span{font-size:12px;color:var(--mut)}
.rv{margin-bottom:12px}
.ro{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;margin-bottom:8px;white-space:pre-wrap}
.ro.c{border-color:var(--ok);background:var(--okSoft)}
.ro.w{border-color:var(--bad);background:var(--badSoft)}
.ro .k{font-weight:700;min-width:20px}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.tag.g{background:var(--ok);color:#fff}
.tag.r{background:var(--bad);color:#fff}
.exp{background:var(--warnSoft);color:var(--tx);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin-top:8px}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.lb:last-child{border:0}
.lb .n{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700}
.lb.me{color:var(--pri);font-weight:700}

/* admin */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tbl th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow:auto;border-radius:var(--r)}
.qed{border-left:4px solid var(--pri)}
.qed.miss{border-left-color:var(--bad)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}

/* ================= v3: series / folders / admin ================= */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.scard{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s}
.scard:active{transform:scale(.99)}
.cover{height:96px;padding:14px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;right:-30px;bottom:-56px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16)}
.cover .ico{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;position:relative;z-index:1}
.cover .ico svg{width:22px;height:22px}
.pill{position:relative;z-index:1;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;letter-spacing:.03em;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);color:#4338ca}
.pill.free{color:#15803d}
.pill.paid{color:#b45309}
.pill svg{width:13px;height:13px}
.scard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.scard h3{font-size:17px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:14px;flex-wrap:wrap}
.crumb a{color:var(--mut);font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.crumb a:hover{color:var(--pri)}
.sh{border-radius:22px;color:#fff;padding:22px;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(60,60,160,.25)}
.sh:after{content:"";position:absolute;right:-50px;top:-60px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.14)}
.sh h1{font-size:23px;position:relative;z-index:1}
.sh p{margin:6px 0 0;opacity:.9;position:relative;z-index:1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{display:flex;gap:12px;align-items:center;cursor:pointer;padding:14px;transition:transform .12s}
.fcard:active{transform:scale(.99)}
.fico{width:46px;height:46px;border-radius:13px;background:var(--warnSoft);color:var(--warn);display:grid;place-items:center;flex:none}
.fcard b{display:block;line-height:1.25}
.trow{display:flex;gap:12px;align-items:center;padding:14px 16px;flex-wrap:wrap}
.trow+.trow{margin-top:10px}
.trow .info{flex:1;min-width:190px}
.trow .info h3{font-size:16px;margin-bottom:6px}
.trow .acts{display:flex;gap:8px;flex-wrap:wrap}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warnSoft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:14px;padding:12px 14px;margin:16px 0}
.banner .t{flex:1;min-width:200px}
.lockbadge{display:inline-flex;align-items:center;gap:5px}
.loading{display:grid;place-items:center;min-height:55vh;text-align:center;color:var(--mut)}
.spin{width:34px;height:34px;border:3px solid var(--surface2);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--bad)}
.okc{color:var(--ok)}
.divider{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:16px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--bd)}
.big-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:34px;font-weight:800;letter-spacing:.14em;text-align:center;background:var(--surface2);border-radius:14px;padding:16px 8px;margin:12px 0;user-select:all;-webkit-user-select:all}
.intest .qcard{user-select:none;-webkit-user-select:none}
.h2s{font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.h2s .n{font-size:13px;font-weight:700;color:var(--mut)}

/* admin */
.atabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px}
.atabs button{border:0;background:var(--surface);color:var(--mut);padding:10px 16px;border-radius:12px;font-weight:700;white-space:nowrap;border:1px solid var(--bd)}
.atabs button.on{background:var(--grad);color:#fff;border-color:transparent}
.atabs .cnt{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px}
.pane{display:none;margin-top:16px}
.pane.on{display:block}
.srow{display:flex;gap:12px;align-items:center;padding:12px 14px}
.srow+.srow{margin-top:8px}
.srow .grow{flex:1;min-width:0}
.srow .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.reqcard{border:1.5px solid var(--warn);background:var(--warnSoft)}
.acc{padding:0;overflow:hidden}
.acc>.hd{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.acc>.hd .grow{flex:1;min-width:0}
.acc>.bd{display:none;border-top:1px solid var(--bd);padding:12px 16px 16px;background:var(--surface2)}
.acc.open>.bd{display:block}
.chev{transition:transform .2s}
.acc.open .chev{transform:rotate(90deg)}
.arow{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--bd);border-radius:12px;margin-top:8px;flex-wrap:wrap}
.arow .grow{flex:1;min-width:160px}
.fhead{display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:700}
.modal .box.wide{max-width:560px;max-height:90vh;overflow:auto}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0}
.chk input{width:20px;height:20px;flex:none}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.btn.sm svg,.btn svg{width:16px;height:16px}

/* ================= v4: CBT mode, dashboard, images ================= */
.cbtbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:2px solid var(--pri);display:flex;align-items:center;gap:10px;padding:8px 14px}
.cbtbar .cand{display:flex;align-items:center;gap:5px}
.stabs{display:flex;gap:4px;overflow:auto;background:var(--surface2);padding:6px 10px;border-bottom:1px solid var(--bd);position:sticky;top:56px;z-index:19}
.stabs button{border:1px solid var(--bd);background:var(--surface);color:var(--tx);padding:7px 16px;border-radius:8px;font-weight:700;font-size:13px;white-space:nowrap}
.stabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.stabs button:disabled{opacity:.5}
.bbar .r.nav .btn{flex:1}
.lg{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 5px;font-style:normal;font-weight:700;font-size:12px;border-radius:6px 6px 11px 11px;background:#e5e7eb;color:#374151;margin-right:6px;vertical-align:middle;position:relative}
.lg.nv{background:#e5e7eb;color:#374151;border-radius:6px}
.lg.na{background:#e5533d;color:#fff;border-radius:11px 11px 6px 6px}
.lg.ans{background:#22a35a;color:#fff;border-radius:6px 6px 11px 11px}
.lg.mark{background:#7c3aed;color:#fff;border-radius:50%}
.lg.mans{background:#7c3aed;color:#fff;border-radius:50%}
.lg.mans:after,.pal button.mans:after{content:"";position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:#22a35a;border:2px solid var(--surface)}
html[data-theme=dark] .lg.nv,html[data-theme=dark] .pal button.nv{background:#2a3454;color:#cbd5e1}
.lg-row{line-height:2.2}
.pal button{position:relative;border:0;color:#fff;font-weight:700}
.pal button.nv{background:#e5e7eb;color:#374151;border-radius:8px}
.pal button.na{background:#e5533d;color:#fff;border-radius:14px 14px 8px 8px}
.pal button.ans{background:#22a35a;color:#fff;border-radius:8px 8px 14px 14px}
.pal button.mark,.pal button.mans{background:#7c3aed;color:#fff;border-radius:50%}
.pal button.cur{box-shadow:0 0 0 3px var(--tx)}
.leg2{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;font-size:12px;color:var(--mut);margin-top:14px}
.leg2 .lg{margin-right:5px}
.candbox{display:flex;gap:10px;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.qi{display:block;max-width:100%;max-height:340px;border-radius:10px;border:1px solid var(--bd);background:#fff;margin:4px 0 14px;cursor:zoom-in}
.qi.oi{max-height:150px;margin:8px 0 0}
.qt{white-space:pre-wrap;font-weight:500;margin-bottom:12px;line-height:1.6}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px}
.lightbox img{max-width:100%;max-height:82vh;background:#fff;border-radius:8px}
.iconbtn.sm{width:34px;height:34px;border-radius:10px}
.iconbtn.bmb.on{background:#fef3c7;border-color:#f59e0b;color:#d97706}
.iconbtn.bmb.on svg{fill:currentColor}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.dgrid div{background:var(--surface2);border-radius:12px;padding:12px;text-align:center}
.dgrid b{display:block;font-size:22px;letter-spacing:-.02em}
.dgrid span{font-size:12px;color:var(--mut)}
.trend{margin-top:14px;color:var(--pri)}
.spark{width:100%;max-width:360px;height:60px;display:block;margin-top:6px}
.prow{padding:10px 0;cursor:pointer}
.prow+.prow{border-top:1px dashed var(--bd)}
.cover.hascov,.sh.hascov{background-size:cover!important;background-position:center!important}
.cover.hascov .ico{display:none}
.cover{height:110px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.g3 div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.g3 b{display:block;font-size:17px}.g3 span{font-size:12px;color:var(--mut)}
.decl{background:var(--surface2);border-radius:12px;padding:10px 12px;margin:12px 0}
.tbl.sm th,.tbl.sm td{padding:7px 9px}

/* v4 admin */
.imgctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 2px}
.imgctl .thumb{max-height:80px;max-width:140px;border-radius:8px;border:1px solid var(--bd);background:#fff}
.plist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;max-height:150px;overflow:auto}
.pchip{border:1px solid var(--bad);background:var(--badSoft);color:var(--bad);border-radius:10px;padding:4px 10px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.pchip small{font-weight:500;font-size:10px}
.cropwrap{overflow:auto;max-height:58vh;border:1px solid var(--bd);border-radius:10px;background:#888}
.cropsel{position:absolute;border:2px dashed #ef4444;background:rgba(239,68,68,.15);pointer-events:none}
.qed.flash{animation:fl 1.6s}
@keyframes fl{0%,60%{box-shadow:0 0 0 4px var(--pri)}100%{box-shadow:none}}

@media(max-width:520px){.seg button{padding:8px 11px;font-size:13.5px}.sec-h .seg{width:100%;display:flex}.sec-h .seg button{flex:1;padding:8px 6px}}

/* ---- v4.1 dashboard & profile ---- */
.hero{padding:20px}
.hero .who{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hero .bigav{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.hero .lvl{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;background:rgba(255,255,255,.2);border-radius:99px;padding:2px 10px}
.hero .streak{margin-left:auto;text-align:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:6px 12px;position:relative;z-index:1}
.hero .streak b{display:block;font-size:20px;line-height:1.1}.hero .streak span{font-size:11px;opacity:.9}
.dtop{display:grid;grid-template-columns:1fr;gap:12px;margin-top:6px}
@media(min-width:760px){.dtop{grid-template-columns:1fr 1fr}}
.accwrap{display:flex;align-items:center;gap:16px}
.accwrap .ringbox{position:relative;width:96px;height:96px;flex:none}
.accwrap .ringbox span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:20px}
.week{display:flex;align-items:flex-end;gap:8px;height:84px;margin-top:8px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.week i{display:block;border-radius:6px 6px 3px 3px;background:var(--grad);min-height:4px;margin-bottom:4px}
.week i.z{background:var(--surface2)}
.next{display:flex;align-items:center;gap:12px;background:var(--priSoft);border:1px solid var(--bd);border-radius:14px;padding:12px}
.next .grow{flex:1;min-width:0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bdg{border:1px dashed var(--bd);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mut);opacity:.7}
.bdg.on{border:1px solid var(--pri2);background:var(--okSoft);color:var(--tx);opacity:1}
.bdg b{display:block;font-size:20px}
.prof{text-align:center}
.prof .bigav{width:84px;height:84px;margin:4px auto 10px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:36px;font-weight:800;box-shadow:0 10px 26px var(--glow)}
.prof .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.prof .kv div{background:var(--surface2);border-radius:12px;padding:10px 4px}.prof .kv b{display:block;font-size:18px}.prof .kv span{font-size:11px;color:var(--mut)}

/* ---- v4.2  accent colours: blue / green / gray  x  light / dark ---- */
html[data-theme="light"][data-accent="blue"]{--bg:#f1f5fb;--surface2:#e8eff9;--bd:#d9e3f1;--pri:#1d6fe8;--pri2:#3b9bff;--priSoft:#e4efff;--grad:linear-gradient(135deg,#1c5fe0 0%,#3b9bff 100%);--glow:rgba(29,111,232,.30)}
html[data-theme="light"][data-accent="green"]{--bg:#f1f8f4;--surface2:#e6f3ec;--bd:#d5e8dc;--pri:#0f8a55;--pri2:#3cc47f;--priSoft:#dff4e8;--grad:linear-gradient(135deg,#0c7a4b 0%,#3cc47f 100%);--glow:rgba(15,138,85,.30)}
html[data-theme="light"][data-accent="gray"]{--bg:#f3f4f6;--surface2:#eaecef;--bd:#dadde2;--pri:#3f4b5c;--pri2:#6b7686;--priSoft:#e6e9ee;--grad:linear-gradient(135deg,#2f3b4d 0%,#6b7686 100%);--glow:rgba(47,59,77,.28)}
html[data-theme="dark"][data-accent="blue"]{--bg:#09111f;--surface:#101b2e;--surface2:#172640;--bd:#233654;--pri:#5aa2ff;--pri2:#3b9bff;--priSoft:#14284a;--grad:linear-gradient(135deg,#2160e0 0%,#3b9bff 100%);--glow:rgba(43,123,232,.30)}
html[data-theme="dark"][data-accent="green"]{--bg:#09130e;--surface:#101c16;--surface2:#172a20;--bd:#233b2e;--pri:#4fd69a;--pri2:#34c47e;--priSoft:#12321f;--grad:linear-gradient(135deg,#11804f 0%,#34c47e 100%);--glow:rgba(52,196,126,.25)}
html[data-theme="dark"][data-accent="gray"]{--bg:#0f1114;--surface:#171a1e;--surface2:#21252b;--bd:#2e333a;--pri:#b4bdca;--pri2:#8a95a5;--priSoft:#252a31;--grad:linear-gradient(135deg,#4a5463 0%,#7a8696 100%);--glow:rgba(0,0,0,.35)}
.lookrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 16px}
.look{border:2px solid var(--bd);background:var(--surface);color:var(--tx);border-radius:14px;padding:12px 6px;text-align:center;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px}
.look.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--priSoft)}
.look i{width:34px;height:34px;border-radius:50%;display:block;border:2px solid rgba(127,127,127,.35)}
.look.m i{border-radius:10px}

/* ---- v4.3  flat modern look (no outlines), bottom nav, motion ---- */
:root{--cssv:5}
body{background-color:var(--bg);background-image:radial-gradient(900px 380px at 50% -120px,color-mix(in srgb,var(--pri) 14%,transparent),transparent);background-repeat:no-repeat;background-attachment:fixed}
.card{border:0}
.modal .box{border:0}
.iconbtn,.chip-user{border:0;box-shadow:var(--shadow)}
.iconbtn:hover{box-shadow:var(--shadow),0 0 0 2px var(--priSoft)}
.btn.ghost{border:0;background:var(--surface2);color:var(--tx)}
.hdr{border-bottom:0;box-shadow:0 1px 0 color-mix(in srgb,var(--bd) 55%,transparent)}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=search],textarea,select{border:0;background:var(--surface2)}
input:focus,textarea:focus,select:focus{background:var(--surface)}
.hero .bigav{border:0;background:rgba(255,255,255,.22)}
.hero .stat,.hero .streak{border:0;background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.hero:before{content:"";position:absolute;left:-40px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.look{border:0;background:var(--surface2);cursor:pointer;font-family:inherit;transition:background .15s,transform .1s}
.look:active{transform:scale(.97)}
.look.on{background:var(--priSoft);color:var(--pri);box-shadow:none}
.look.on:after{content:"\2713";font-size:12px;line-height:1}
.look i{border:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.next,.bdg,.bdg.on{border:0}
.bdg{background:var(--surface2);opacity:.65}
.bdg.on{background:var(--okSoft)}
.scard,.card{transition:transform .18s,box-shadow .18s}
@media(hover:hover){.scard:hover{transform:translateY(-3px);box-shadow:0 14px 34px var(--glow)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app>.wrap{animation:pageIn .34s cubic-bezier(.22,.8,.24,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.searchbox{position:relative;margin:4px 0 6px}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.searchbox input{padding-left:42px;border-radius:14px;box-shadow:var(--shadow);background:var(--surface)}
.bnav{display:none}
@media(max-width:700px){
  .hometabs{display:none}
  body.hasnav .wrap{padding-bottom:110px}
  body.hasnav .bnav{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;padding:6px;box-shadow:0 10px 36px rgba(0,0,0,.22);gap:4px}
  .bnav button{flex:1;border:0;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;font-size:11px;font-weight:700;transition:background .2s,color .2s}
  .bnav button.on{background:var(--priSoft);color:var(--pri)}
  .toast{bottom:104px}
}
.cssbanner{position:fixed;left:12px;right:12px;top:12px;z-index:99;background:var(--warn);color:#fff;border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}

/* ---- v4.4 cover/title layout, tags, glass ---- */
.cover{height:auto;aspect-ratio:16/7;padding:0;display:grid;place-items:center}
.cover:after{display:none}
.cover .ico{margin:auto}
.cover.hascov{background-size:cover!important;background-position:center!important}
.scard .ttl,.shx .ttl{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.scard .ttl h3{flex:1;min-width:0}
.shx{padding:0;overflow:hidden}
.shx .shc{border-radius:0}
.shx .shb{padding:16px 18px 18px}
.shx h1{font-size:21px;flex:1;min-width:0}
.shx p{margin:8px 0 0}
.tag{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--mut);white-space:nowrap}
.tag.free{background:var(--okSoft);color:var(--ok)}
.tag.ok{background:var(--priSoft);color:var(--pri)}
.tag.paid{background:var(--warnSoft);color:var(--warn)}
.card{background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.25);backdrop-filter:blur(14px) saturate(1.25);
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 30px -12px var(--glow),inset 0 1px 0 rgba(255,255,255,.55)}
html[data-theme="dark"] .card{box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 38px -14px var(--glow),inset 0 1px 0 rgba(255,255,255,.07)}
body.intest .card,.tlayout .card{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface);box-shadow:var(--shadow)}

/* ===== v4 additions ===== */
@keyframes rg{from{stroke-dashoffset:var(--c)}}
@keyframes grow{from{width:0}}
@keyframes growh{from{height:0}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.toast{animation:toastIn .25s cubic-bezier(.22,.8,.24,1)}
#app>.wrap>*{animation:rise .5s cubic-bezier(.22,.8,.24,1) backwards}
#app>.wrap>*:nth-child(2){animation-delay:.05s}#app>.wrap>*:nth-child(3){animation-delay:.1s}#app>.wrap>*:nth-child(4){animation-delay:.15s}
#app>.wrap>*:nth-child(5){animation-delay:.2s}#app>.wrap>*:nth-child(n+6){animation-delay:.25s}
.bar i{animation:grow .9s cubic-bezier(.22,.8,.24,1) backwards}
.sk{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--surface2) 25%,color-mix(in srgb,var(--surface2) 55%,var(--surface)) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite}
.card:active{transform:scale(.995)}
.btn,.seg button,.bnav button,.opt{transition:transform .12s,background .2s,color .2s,box-shadow .2s}
.opt:active{transform:scale(.985)}
.rtabs{position:sticky;top:57px;z-index:6;padding:10px 0;margin:6px 0 2px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.rtabs .seg{width:100%;display:flex}.rtabs .seg button{flex:1;padding:9px 4px}
#rbody>*{animation:rise .35s cubic-bezier(.22,.8,.24,1) backwards}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.tiles>div{background:var(--surface);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.tiles b{display:block;font-size:18px;letter-spacing:-.02em}.tiles span{font-size:11.5px;color:var(--mut)}
.rankc{background:var(--grad);color:#fff;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 14px 34px var(--glow)}
.rankc .rk{text-align:center;min-width:84px}.rankc .rk b{display:block;font-size:42px;line-height:1;letter-spacing:-.04em}.rankc .rk span{opacity:.85}
.rankc .rkr{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.rankc .rkr>div{background:rgba(255,255,255,.16);border-radius:12px;padding:8px;text-align:center}.rankc .rkr b{display:block;font-size:18px}.rankc .rkr span{font-size:11px;opacity:.85}
.lb .n.m1{background:#f5c542;color:#4a3500}.lb .n.m2{background:#cfd6de;color:#2b3440}.lb .n.m3{background:#e0a56b;color:#4a2a08}
.hist{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:12px}
.hb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--mut)}
.hb i{width:100%;background:var(--surface2);border-radius:5px 5px 2px 2px;animation:growh .8s cubic-bezier(.22,.8,.24,1) backwards;flex:none}
.hb.me i{background:var(--grad)}.hb.me{color:var(--pri);font-weight:700}
.stk{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:10px 0 8px}
.stk i{display:block;height:100%}.stk .c{background:var(--ok)}.stk .w{background:var(--bad)}.stk .s{background:var(--bd)}
.subc,.tipc{margin-top:12px}
.tipc{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tipc b{display:block;margin:2px 0 6px}
.tipc1{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.tchart{display:flex;align-items:flex-end;gap:3px;height:130px;margin-top:12px;padding-bottom:18px}
.tb{flex:1;height:100%;border:0;background:transparent;padding:0;position:relative;display:flex;align-items:flex-end}
.tb i{display:block;width:100%;border-radius:4px 4px 1px 1px;animation:growh .8s cubic-bezier(.22,.8,.24,1) backwards}
.tb.c i{background:var(--ok)}.tb.w i{background:var(--bad)}.tb.s i{background:var(--bd)}
.tb span{position:absolute;left:0;right:0;bottom:-16px;font-size:9px;color:var(--mut);text-align:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.c{background:var(--ok)}.dot.w{background:var(--bad)}.dot.s{background:var(--bd)}
.rv.flash{animation:fl 1.6s}
.mkcard,.instbar{display:flex;align-items:center;gap:12px;cursor:pointer}
.mkcard{margin-top:12px}.grow{flex:1;min-width:0}
.mki{width:40px;height:40px;border-radius:12px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;flex:none}
.ro.pick{cursor:pointer;transition:background .2s,border-color .2s,transform .12s}.ro.pick:active{transform:scale(.99)}
.mkc{transition:opacity .25s,transform .25s,max-height .3s}.mkc.out{opacity:0;transform:translateX(30px)}
.instbar{position:fixed;left:12px;right:12px;bottom:92px;z-index:40;background:var(--surface);border-radius:18px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.28);animation:slideUp .4s cubic-bezier(.22,.8,.24,1);max-width:520px;margin:0 auto;cursor:default}
body.intest .instbar{display:none}
@media(min-width:701px){.instbar{bottom:20px}}
@media(max-width:700px){.bnav button{font-size:10.5px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
/* ===== v4b: skeleton screens, splash, glass, smoother pages ===== */
@keyframes pageIn2{from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
#app>.wrap{animation:pageIn2 .42s cubic-bezier(.22,.8,.24,1) backwards}
.grid>*{animation:rise .5s cubic-bezier(.22,.8,.24,1) backwards}
.grid>*:nth-child(2){animation-delay:.05s}.grid>*:nth-child(3){animation-delay:.1s}.grid>*:nth-child(4){animation-delay:.15s}.grid>*:nth-child(n+5){animation-delay:.2s}
.skpage .skhero{height:150px;border-radius:22px;margin-bottom:16px}

/* -- fonts -- */
:root{--fh:Syne,"DM Sans","Noto Sans Devanagari",system-ui,sans-serif;--fb:"DM Sans",Inter,"Noto Sans Devanagari",system-ui,sans-serif;--ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--gold:#d9a441;--goldg:linear-gradient(135deg,#f6dc8f,#d9a441 55%,#b9822a)}

h1,h2,h3,.h2s,.brand,#splash b{font-family:var(--fh);font-weight:700;letter-spacing:-.01em}
.stat b,.tiles b,.kv b,.timer,.mring span,.hs b,.hcmp b,.hdl b,.cdn,.big,.score,.ring-c b{font-family:var(--fb);font-weight:700;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}

/* -- mode tokens (neutral backgrounds; accent only tints) -- */
html[data-theme="light"],html[data-theme="light"][data-accent]{
 --bg:#f4f6fa;--surface:#ffffff;--surface2:#eef1f6;--bd:#e2e7ef;--tx:#0e1726;--mut:#5d6879;
 --glass:rgba(255,255,255,.74);--hair:rgba(15,23,42,.07);--hi:rgba(255,255,255,.95);
 --sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);--shadow:var(--sh);
 --ok:#0f9d63;--okSoft:#e3f6ec;--bad:#dc143c;--badSoft:#fde8ec;--warn:#ea580c;--warnSoft:#fff1e6;--goldTx:#8a5d0c;--goldSoft:#fbf1dc;
 --nav:rgba(255,255,255,.78);--hdrg:rgba(244,246,250,.72);--amb:.55}
html[data-theme="dark"],html[data-theme="dark"][data-accent]{
 --bg:#0d1117;--surface:#151b24;--surface2:#1d2531;--bd:#273142;--tx:#e9eef5;--mut:#95a2b4;
 --glass:rgba(255,255,255,.045);--hair:rgba(255,255,255,.08);--hi:rgba(255,255,255,.06);
 --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.32);--shadow:var(--sh);
 --ok:#3ddc97;--okSoft:#10291f;--bad:#ff5c7a;--badSoft:#341119;--warn:#fb923c;--warnSoft:#33200f;--goldTx:#f3d27a;--goldSoft:#2e2410;
 --nav:rgba(21,27,36,.72);--hdrg:rgba(13,17,23,.66);--amb:1}
html[data-theme="dark"][data-oled="1"],html[data-theme="dark"][data-oled="1"][data-accent]{
 --bg:#000;--surface:#0b0b0d;--surface2:#141418;--bd:#1f1f25;--tx:#f2f4f7;--mut:#8e98a7;
 --glass:rgba(255,255,255,.035);--hair:rgba(255,255,255,.075);--hi:rgba(255,255,255,.05);
 --sh:0 10px 30px rgba(0,0,0,.6);--shadow:var(--sh);--nav:rgba(12,12,14,.74);--hdrg:rgba(0,0,0,.66);--amb:.6}

/* -- accent tokens -- */
html[data-accent="cyber"][data-theme="light"]{--pri:#0b84c6;--pri2:#4f46e5;--grad:linear-gradient(135deg,#0891b2,#4f46e5);--glow:rgba(8,132,198,.28);--rgb3:#22d3ee}
html[data-accent="cyber"][data-theme="dark"]{--pri:#38d4f0;--pri2:#6d72f6;--grad:linear-gradient(135deg,#0ea5c6,#6366f1);--glow:rgba(34,211,238,.32);--rgb3:#6366f1}
html[data-accent="green"][data-theme="light"]{--pri:#059669;--pri2:#0d9488;--grad:linear-gradient(135deg,#047857,#10b981);--glow:rgba(5,150,105,.28);--rgb3:#22d3ee}
html[data-accent="green"][data-theme="dark"]{--pri:#34d399;--pri2:#2dd4bf;--grad:linear-gradient(135deg,#059669,#10b981);--glow:rgba(52,211,153,.3);--rgb3:#22d3ee}
html[data-accent="royal"][data-theme="light"]{--pri:#7c3aed;--pri2:#c026d3;--grad:linear-gradient(135deg,#6d28d9,#8b5cf6);--glow:rgba(124,58,237,.28);--rgb3:#ec4899}
html[data-accent="royal"][data-theme="dark"]{--pri:#a78bfa;--pri2:#d946ef;--grad:linear-gradient(135deg,#7c3aed,#a855f7);--glow:rgba(167,139,250,.34);--rgb3:#ec4899}
html[data-accent="blue"][data-theme="light"]{--pri:#1d6fe8;--pri2:#0ea5e9;--grad:linear-gradient(135deg,#1c5fe0,#3b9bff);--glow:rgba(29,111,232,.28);--rgb3:#14b8a6}
html[data-accent="blue"][data-theme="dark"]{--pri:#62a8ff;--pri2:#38bdf8;--grad:linear-gradient(135deg,#2160e0,#3b9bff);--glow:rgba(59,155,255,.32);--rgb3:#14b8a6}
html[data-accent="rose"][data-theme="light"]{--pri:#e11d48;--pri2:#f97316;--grad:linear-gradient(135deg,#e11d48,#fb7185);--glow:rgba(225,29,72,.26);--rgb3:#a855f7}
html[data-accent="rose"][data-theme="dark"]{--pri:#fb7185;--pri2:#fb923c;--grad:linear-gradient(135deg,#e11d48,#f43f5e);--glow:rgba(251,113,133,.32);--rgb3:#a855f7}
html[data-accent="gray"][data-theme="light"]{--pri:#334155;--pri2:#64748b;--grad:linear-gradient(135deg,#1e293b,#475569);--glow:rgba(51,65,85,.24);--rgb3:#64748b}
html[data-accent="gray"][data-theme="dark"]{--pri:#cbd5e1;--pri2:#94a3b8;--grad:linear-gradient(135deg,#475569,#64748b);--glow:rgba(148,163,184,.26);--rgb3:#64748b}
html[data-theme]{--priSoft:color-mix(in srgb,var(--pri) 13%,var(--surface));--accent-color:var(--pri)}
html[data-theme="dark"][data-oled="1"]{--priSoft:color-mix(in srgb,var(--pri) 16%,#000)}

/* -- ambient RGB light: static gradients, no blur filter, no animation (cheap) -- */
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--amb);transform:translateZ(0);
 background:radial-gradient(70% 42% at 0% 0%,color-mix(in srgb,var(--pri) 16%,transparent),transparent 70%),
  radial-gradient(60% 38% at 100% 18%,color-mix(in srgb,var(--pri2) 12%,transparent),transparent 70%),
  radial-gradient(70% 40% at 50% 105%,color-mix(in srgb,var(--rgb3,var(--pri)) 10%,transparent),transparent 70%)!important}
html[data-theme="light"] body::before{opacity:.5}
body.intest::before{display:none}

/* -- glass surfaces: translucent fill + hairline + inner light (no per-card backdrop blur = smooth scroll) -- */
.card,.tiles>div{background:var(--glass);border:1px solid var(--hair)!important;box-shadow:inset 0 1px 0 var(--hi),var(--sh);-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html[data-theme="light"] .card{background:var(--glass)}
.hero .stat,.hero .streak{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.rankc,.hero{border:1px solid rgba(255,255,255,.18)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 16px 40px -12px var(--glow)!important}
.pendc{background:color-mix(in srgb,var(--warn) 9%,var(--glass))}
.notice{background:color-mix(in srgb,var(--pri) 7%,var(--glass))}
.rtabs{background:color-mix(in srgb,var(--bg) 88%,transparent)}
.qcard,body.intest .card,.tlayout .card{background:var(--surface)!important;box-shadow:var(--sh)}
.chip,.pill,.seg,.look,.bdg{border-color:var(--hair)}
input,select,textarea{background:var(--surface);border:1px solid var(--bd);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 16%,transparent)}
.iconbtn{background:var(--glass);border:1px solid var(--hair)!important;box-shadow:inset 0 1px 0 var(--hi),0 2px 8px rgba(0,0,0,.05)}

/* secondary accents: crimson / warm orange / gold */
.tag.paid,.pill.paid{background:var(--goldSoft);color:var(--goldTx)}
.prem{position:absolute;left:12px;top:12px;z-index:2;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.9px;color:#4a3003;background:var(--goldg);border-radius:99px;padding:4px 10px 4px 8px;box-shadow:0 4px 14px rgba(217,164,65,.45)}
.prem svg{width:12px;height:12px;fill:currentColor}
.h2s svg{color:var(--gold)}
.hero .lvl.gold{background:var(--goldg);color:#4a3003;border:0;box-shadow:0 4px 14px rgba(217,164,65,.45)}
.hero .lvl svg{vertical-align:-2px;margin-right:3px;width:12px;height:12px}
.bdg.on{background:var(--goldSoft);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);color:var(--tx)}

/* -- buttons & press feel (press down, spring back) -- */
.btn{background:var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 20px -6px var(--glow);transition:transform .38s var(--spring),box-shadow .2s var(--ease),opacity .2s}
.btn.ghost{background:var(--surface2);box-shadow:none}
.btn.soft{background:var(--priSoft);color:var(--pri);box-shadow:none}
.btn:active,.iconbtn:active,.look:active,.chip:active,.seg button:active,.dri:active{transform:scale(.96);transition-duration:.08s}
.card.scard,.fcard,.hscard,.mkcard,.tksub,.rrow{transition:transform .38s var(--spring)}
.card.scard:active,.fcard:active,.hscard:active,.mkcard:active,.tksub:active{transform:scale(.975);transition-duration:.1s}
@media(hover:hover){.btn:hover,.iconbtn:hover{transform:scale(1.02)}.card.scard:hover{transform:translateY(-3px)}}

/* -- header: clear at top, light frosted blur once you scroll -- */
.hdr{background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none;backdrop-filter:none;transition:background-color .25s var(--ease),box-shadow .25s var(--ease)}
.hdr.sc{background:var(--hdrg)!important;-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 1px 0 var(--hair)!important}
.hdr-in{gap:8px;padding:10px 14px}
.hdr .brand{flex:1;min-width:0;justify-content:center;text-align:center;gap:0}
#mnu[style*="none"]+.brand{justify-content:flex-start}
.brand #sn{font-size:15.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;max-width:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 background:linear-gradient(100deg,var(--tx) 0%,var(--tx) 38%,var(--pri) 50%,var(--tx) 62%,var(--tx) 100%);background-size:260% auto;background-position:100% center;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shim 2.4s var(--ease) .5s 1 both}
@keyframes shim{from{background-position:100% center}to{background-position:0% center}}
.iconbtn{width:38px;height:38px;border-radius:12px}
.iconbtn.av{border-radius:50%;padding:0;overflow:hidden;background:var(--grad)!important;color:#fff;font-family:var(--fh);font-weight:800;font-size:15px;border:2px solid color-mix(in srgb,var(--pri) 30%,transparent)!important;box-shadow:0 4px 14px -4px var(--glow)}
.pfimg{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
#bell .dot,#bell .n,#bell b{pointer-events:none}

/* -- bottom nav: floating glass dock, sliding pill, glowing active icon -- */
@media(max-width:700px){
 body.hasnav .bnav{--i:0;background:var(--nav);border:1px solid var(--hair);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:inset 0 1px 0 var(--hi),0 12px 34px rgba(0,0,0,.18);border-radius:24px;transform:translateZ(0)}
 .bnav:before{content:"";position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 32px)/6);border-radius:17px;background:color-mix(in srgb,var(--pri) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pri) 22%,transparent),0 0 18px -4px var(--glow);transform:translate3d(calc(var(--i)*(100% + 4px)),0,0);transition:transform .45s var(--spring)}
 .bnav button{position:relative;z-index:1;background:transparent!important;color:var(--mut);font-size:9.5px!important;font-weight:700;letter-spacing:.3px;text-transform:uppercase;transition:color .25s var(--ease)}
 .bnav button svg{opacity:.6;transition:transform .4s var(--spring),opacity .25s}
 .bnav button.on{color:var(--pri)}
 .bnav button.on svg{opacity:1;transform:translateY(-1px) scale(1.1);filter:drop-shadow(0 0 6px var(--glow))}
 .bnav button:active svg{transform:scale(.88)}
}
body.intest .bnav{display:none!important}

/* -- page transition: one cheap slide+fade of #app, only on navigation -- */
#app>.wrap,#app>.wrap>*{animation:none!important}
#app.pg{animation:pgIn .3s var(--ease)}
@keyframes pgIn{from{opacity:0;transform:translate3d(var(--dx,16px),0,0)}to{opacity:1;transform:none}}
#app.pgf{animation:pgF .22s var(--ease)}
@keyframes pgF{from{opacity:.4}}

/* -- modals as glass; bottom sheets -- */
.modal{background:rgba(3,6,14,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal .box{background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--hair);box-shadow:inset 0 1px 0 var(--hi),0 0 70px -20px var(--glow),0 24px 60px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.modal.bsheet{display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeBg .25s var(--ease)}
.modal.bsheet .box{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));border-bottom:0;animation:sheetUp .38s var(--ease)}
.modal.bsheet.again,.modal.bsheet.again .box{animation:none}
@keyframes sheetUp{from{transform:translate3d(0,100%,0)}}
@keyframes fadeBg{from{background:transparent}}
.shnd{width:40px;height:4px;border-radius:4px;background:var(--bd);margin:2px auto 12px}
.shclose{position:absolute;right:14px;top:16px;width:34px;height:34px;border-radius:11px;border:1px solid var(--hair);background:var(--surface2);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.sht{font-size:21px;margin:4px 0 12px}
.shl{height:1px;background:var(--hair);margin:0 -18px 14px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
/* theme sheet */
.modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{border:1.5px solid var(--hair);background:var(--surface2);border-radius:16px;padding:8px 8px 10px;cursor:pointer;color:var(--tx);font:inherit;font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:8px;align-items:stretch;transition:transform .35s var(--spring),border-color .2s}
.mode i{display:block;height:56px;border-radius:10px;position:relative;overflow:hidden;border:1px solid rgba(127,127,127,.25)}
.mode i:before{content:"";position:absolute;left:8px;right:8px;top:9px;height:9px;border-radius:5px;background:var(--grad);opacity:.95}
.mode i:after{content:"";position:absolute;left:8px;right:22px;top:24px;height:6px;border-radius:4px;background:rgba(127,127,127,.4);box-shadow:0 11px 0 rgba(127,127,127,.3)}
.mode.on{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.mode:active{transform:scale(.96)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.accb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--hair);background:var(--surface2);color:var(--tx);font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;text-align:left;transition:transform .35s var(--spring),border-color .2s}
.accb i{width:30px;height:30px;border-radius:9px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px -3px rgba(0,0,0,.3)}
.accb.on{border-color:var(--pri);background:var(--priSoft)}
.accb:active{transform:scale(.96)}
/* profile sheet */
.pfhead{text-align:center;margin-bottom:12px}
.pfav{position:relative;display:inline-block;cursor:pointer}
.pfav .bigav{width:92px;height:92px;margin:2px auto 8px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-family:var(--fh);font-size:38px;font-weight:800;overflow:hidden;box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent),0 12px 30px -8px var(--glow)}
.pfcam{position:absolute;right:2px;bottom:10px;width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--pri);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2);border:1px solid var(--hair)}
.pfl{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.pfi{width:100%;padding:12px 14px;border-radius:13px;font:inherit;font-size:15px}
textarea.pfi{resize:vertical;min-height:64px}
.hero .bigav,.drh .bigav{overflow:hidden}
/* toggle */
.toast{animation:toastPop .35s var(--spring)}
@keyframes toastPop{from{opacity:0;transform:translateX(-50%) translateY(16px) scale(.94)}}
.drp{background:color-mix(in srgb,var(--surface) 88%,transparent)!important;-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4)}
.drh{background:var(--grad)}
.drh .bigav{border-radius:50%}
#splash.off{pointer-events:none}
@media(prefers-reduced-motion:reduce){#app.pg,#app.pgf,.modal.bsheet .box,.bnav:before{animation:none!important;transition:none!important}}
.bsheet .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px;text-align:center}
.bsheet .kv div{background:var(--surface2);border:1px solid var(--hair);border-radius:14px;padding:10px 4px}
.bsheet .kv b{display:block;font-size:19px}.bsheet .kv span{font-size:11px;color:var(--mut)}
.bsheet .pfi{background:var(--surface2);border:1px solid var(--hair);color:var(--tx);box-shadow:none}
.bsheet .pfi:focus{background:var(--surface);border-color:var(--pri)}
.drh .bigav{display:grid;place-items:center;font-family:var(--fh);font-weight:800;color:#fff;background:rgba(255,255,255,.22)!important;border:2px solid rgba(255,255,255,.5)}
#splash{transition:opacity .3s var(--ease),visibility .3s}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.4,0,.2,1)}

/* ---- v14 buttery navigation: GPU view-transition slide, header + nav pinned ---- */
#app{min-height:calc(100dvh - 60px)}
html[data-vt] .hdr{view-transition-name:hdr}
html[data-vt] body.hasnav .bnav{view-transition-name:bnav}
html[data-vt]::view-transition-group(hdr),html[data-vt]::view-transition-group(bnav),
html[data-vt]::view-transition-new(hdr),html[data-vt]::view-transition-new(bnav){animation:none}
html[data-vt]::view-transition-old(hdr),html[data-vt]::view-transition-old(bnav){display:none}
html[data-vt]::view-transition-old(root){animation:vtOutF .26s cubic-bezier(.4,0,.2,1) both}
html[data-vt]::view-transition-new(root){animation:vtInF .36s cubic-bezier(.22,.8,.24,1) both}
html[data-vt="b"]::view-transition-old(root){animation-name:vtOutB}
html[data-vt="b"]::view-transition-new(root){animation-name:vtInB}
@keyframes vtOutF{to{opacity:0;transform:translate3d(-28px,0,0)}}
@keyframes vtInF{from{opacity:0;transform:translate3d(36px,0,0)}}
@keyframes vtOutB{to{opacity:0;transform:translate3d(28px,0,0)}}
@keyframes vtInB{from{opacity:0;transform:translate3d(-36px,0,0)}}
#app.pgf{animation:pgF .28s var(--ease)}
@keyframes pgF{from{opacity:.35}}
html[data-vt]::view-transition-old(root){animation-duration:.28s}
html[data-vt]::view-transition-new(root){animation-duration:.42s}
@media(max-width:700px){.bnav:before{transition:transform .42s cubic-bezier(.22,.8,.24,1)}.bnav button svg{transition:transform .3s cubic-bezier(.22,.8,.24,1),opacity .25s}}

/* ---- v15 polish: visible edges in dark/black, fonts, header fit ---- */
/* soft accent-tinted outline + dim glow so boxes read clearly on black */
html[data-theme="dark"]{--hair:color-mix(in srgb,var(--pri) 14%,rgba(255,255,255,.09))}
html[data-theme="dark"][data-oled="1"]{--hair:color-mix(in srgb,var(--pri) 24%,rgba(255,255,255,.08));--glass:rgba(255,255,255,.035);--surface2:#121216}
html[data-theme="dark"] .card,html[data-theme="dark"] .tiles>div{box-shadow:inset 0 1px 0 var(--hi),0 0 0 .5px color-mix(in srgb,var(--pri) 10%,transparent),0 10px 30px -14px rgba(0,0,0,.6)}
html[data-oled="1"] .card,html[data-oled="1"] .tiles>div{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 22px -12px var(--glow)}
html[data-theme="dark"] .chip,html[data-theme="dark"] .seg,html[data-theme="dark"] .btn.ghost,html[data-theme="dark"] .look,html[data-theme="dark"] .bdg,html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea,html[data-theme="dark"] .iconbtn{border:1px solid var(--hair)}
html[data-oled="1"] .bar,html[data-oled="1"] .pbar,html[data-oled="1"] .tkbar{background:#1a1a20}
html[data-oled="1"] body.hasnav .bnav{border-color:var(--hair)}
/* typography: Syne only for big titles; card titles + body in DM Sans */
h3,.trow .info h3,.scard h3,.card h3{font-family:var(--fb)!important;font-weight:700;letter-spacing:-.01em}
h1,h2,.sht,.h2s,#splash b{font-family:var(--fh)}
.hdr .brand #sn{font-size:14.5px;letter-spacing:.03em}
.hdr-in{gap:6px}
.hdr .iconbtn{width:36px;height:36px}
/* test rows: never overflow the card */
.trow{display:grid!important;grid-template-columns:42px 1fr;align-items:start;gap:12px;padding:14px!important}
.trow .info{min-width:0}
.trow .info h3{font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.trow .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.trow .acts .btn{flex:1;min-width:0}
.trow .chips{display:flex;flex-wrap:wrap;gap:6px}
/* question palette: tidy grid */
.sheet .in{max-height:78vh;overflow:auto}
.pal{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:9px;padding:4px 2px;max-height:40vh;overflow:auto}
.pal button{width:100%;height:44px;min-width:0;font-size:14.5px;font-family:var(--fb);font-weight:700;display:grid;place-items:center}
.pal button.cur{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--pri)}
.leg2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:14px;font-size:13px}
.leg2 span{display:flex;align-items:center;gap:8px;min-width:0}

/* ---- v16 notifications page + install sheet ---- */
.ntf .nhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.ntitle{font-size:26px;margin:6px 0 2px}
.ncard{padding:16px 16px 14px!important;margin-bottom:12px;position:relative}
.ncard.isnew{border-color:color-mix(in srgb,var(--pri) 45%,var(--hair))!important;box-shadow:inset 3px 0 0 var(--pri),var(--sh)!important}
.nctop{display:flex;align-items:flex-start;gap:12px}
.nico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--priSoft);color:var(--pri)}
.ncard h3{font-size:16.5px;line-height:1.3;margin:0;overflow-wrap:anywhere}
.nmeta{font-size:12.5px;color:var(--mut);margin-top:3px}
.newb{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:#fff;background:var(--grad);border-radius:99px;padding:3px 9px;flex:none;box-shadow:0 4px 12px -4px var(--glow)}
.nbody{margin-top:12px;font-size:15px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere;color:var(--tx)}
.nbody.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.nmore{border:0;background:none;color:var(--pri);font-weight:700;padding:6px 0 0;font-size:14px;cursor:pointer}
.nimg{margin-top:12px;border-radius:14px;width:100%;max-height:420px;object-fit:contain;background:var(--surface2)}
.nlink{margin-top:12px;text-decoration:none;display:inline-flex}
.instv{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.instico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none;box-shadow:0 10px 24px -8px var(--glow)}
.isteps{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px}
.isteps li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface2);border:1px solid var(--hair);font-size:14.5px}
.isteps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--priSoft);color:var(--pri);font-size:13px;flex:none}

/* ---- v16 side drawer: compact width, centered profile, clean list ---- */
.drp.sb{width:min(64vw,272px);background:var(--bg)!important;box-shadow:12px 0 40px rgba(0,0,0,.25)}
.sbh{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 26px) 14px 18px;border-bottom:1px solid var(--bd);background:radial-gradient(120% 80% at 50% 20%,color-mix(in srgb,var(--pri) 9%,transparent),transparent 70%)}
.sbx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--surface);color:var(--mut);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.sbav{width:72px;height:72px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--surface);color:var(--pri);font-family:var(--fh);font-size:28px;font-weight:800;box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 10%,transparent),0 8px 22px -8px var(--glow)}
.sbn{display:block;margin-top:10px;font-family:var(--fh);font-size:18px;font-weight:700;color:var(--tx);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbs{font-size:12.5px;color:var(--mut);margin-top:3px}
.sbvp{margin-top:12px;padding:6px 16px;border-radius:99px;border:1px solid color-mix(in srgb,var(--pri) 35%,transparent);background:color-mix(in srgb,var(--pri) 10%,var(--surface));color:var(--pri);font:inherit;font-size:13px;font-weight:700}
.sb .drl{padding:8px 8px 20px}
.sbd{height:1px;background:var(--bd);margin:6px 12px}
.sb .dri{gap:14px;padding:11px 12px;font-size:15px;font-weight:500;letter-spacing:.1px;color:var(--tx);border-radius:14px}
.sb .dri svg{color:var(--mut);stroke-width:1.6}
.sb .dri.on{background:var(--surface);color:var(--tx);box-shadow:0 2px 10px rgba(15,23,42,.06)}.sb .dri.on svg{color:var(--pri)}
.sb .dri.out{color:var(--bad);margin-top:4px}.sb .dri.out svg{color:var(--mut)}
.strow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--surface2);color:var(--tx);border-radius:14px;padding:12px;margin-bottom:8px;font:inherit}
.strow .grow b{display:block;font-size:15px;font-weight:600}.strow small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.stic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface);color:var(--pri);flex:none}
.strow>svg{color:var(--mut)}
.legal{font-size:14px;line-height:1.6;color:var(--tx)}.legal p{margin:0 0 10px}.legal h4{font-size:14.5px;margin:16px 0 4px}.legal ul{margin:0 0 10px;padding-left:20px}.legal li{margin:3px 0}.legal a{color:var(--pri)}
</style>

<style>
:root{
  --bg:#f3f6f9;--surface:#ffffff;--surface2:#eef2f6;--tx:#0e1b26;--mut:#5a6b7b;--bd:#dfe6ed;
  --pri:#1d6fe8;--pri2:#10a37f;--priSoft:#e6f0fe;
  --ok:#12945f;--okSoft:#e3f6ec;--bad:#dc3a4f;--badSoft:#fdecee;--warn:#c9780a;--warnSoft:#fff3df;
  --shadow:0 1px 2px rgba(14,27,38,.05),0 8px 24px rgba(14,27,38,.07);
  --grad:linear-gradient(135deg,#1d6fe8 0%,#12a58a 100%);
  --glow:rgba(29,111,232,.30);
  --r:16px;
}
html[data-theme="dark"]{
  --bg:#0b1117;--surface:#131b23;--surface2:#1b2631;--tx:#e7eef5;--mut:#93a4b5;--bd:#26343f;
  --pri:#5aa2ff;--pri2:#34d3a4;--priSoft:#14283f;
  --ok:#4fd69a;--okSoft:#112d22;--bad:#ff7a8a;--badSoft:#35161c;--warn:#f5b84a;--warnSoft:#33260d;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);
  --grad:linear-gradient(135deg,#2b7be8 0%,#14b08f 100%);
  --glow:rgba(43,123,232,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:var(--pri)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.hdr-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:17px;text-decoration:none;color:var(--tx)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px var(--glow)}
.sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--surface);color:var(--tx);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:hover{border-color:var(--pri)}
.chip-user{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px;cursor:pointer;color:var(--tx)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
body.intest .hdr{display:none}

.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
h1,h2,h3{letter-spacing:-.02em;margin:0}
.mut{color:var(--mut)}
.sm{font-size:13px}

/* buttons */
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--grad);color:#fff;box-shadow:0 6px 16px var(--glow);transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.soft{background:var(--priSoft);color:var(--pri);box-shadow:none}
.btn.warn{background:var(--warnSoft);color:var(--warn);box-shadow:none}
.btn.danger{background:var(--bad);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* cards */
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:24px;position:relative;overflow:hidden;box-shadow:0 14px 40px var(--glow)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-size:24px}
.hero p{margin:6px 0 0;opacity:.88}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;opacity:.85}

.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;gap:2px;max-width:100%;overflow:auto}
.seg button{border:0;background:transparent;color:var(--mut);padding:8px 16px;border-radius:9px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:18px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{display:flex;flex-direction:column;gap:12px}
.tcard h3{font-size:17px}
.tico{width:42px;height:42px;border-radius:12px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);color:var(--mut);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.chip.ok{background:var(--okSoft);color:var(--ok)}
.chip.pri{background:var(--priSoft);color:var(--pri)}
.chip.warn{background:var(--warnSoft);color:var(--warn)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}

.rrow{display:flex;align-items:center;gap:14px}
.rrow+.rrow{margin-top:10px}
.mring{width:54px;height:54px;flex:none;position:relative}
.mring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700}
.rrow .grow{flex:1;min-width:0}
.rrow .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=search],textarea,select{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--surface);color:var(--tx);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
textarea{min-height:90px;resize:vertical}
label.l{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.login{max-width:440px;margin:6vh auto 0}
.login .logo{width:52px;height:52px;border-radius:16px;margin-bottom:14px}

/* instructions */
.ins{max-width:640px;margin:20px auto}
.ins ul{padding-left:0;list-style:none;margin:14px 0}
.ins li{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--bd)}
.ins li:last-child{border:0}
.ins li svg{color:var(--pri);margin-top:2px}
.stayw{display:flex;gap:10px;align-items:flex-start;background:var(--warnSoft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:14px;line-height:1.5}
.stayw svg{color:var(--warn);flex:none;margin-top:2px}
.lvw{text-align:center}
.lvw .lvwi{width:52px;height:52px;border-radius:16px;background:var(--warnSoft);color:var(--warn);display:grid;place-items:center;margin:0 auto 12px}
.lvw h2{font-size:19px;margin:0 0 8px}
.lvw p{font-size:14.5px;line-height:1.55;color:var(--mut);margin:0 0 16px}

/* test */
.tbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 14px}
.tb-title{font-weight:700;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-l{min-width:0;flex:1}
.timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;background:var(--priSoft);color:var(--pri);padding:7px 12px;border-radius:12px}
.timer.low{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.progress{height:3px;background:var(--surface2)}
.progress i{display:block;height:100%;background:var(--grad);transition:width .25s}
.tlayout{max-width:1080px;margin:0 auto;padding:16px 14px 150px;display:grid;grid-template-columns:1fr;gap:14px}
.qcard{padding:20px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qtext{white-space:pre-wrap;font-size:18px;line-height:1.6;margin-bottom:18px;font-weight:500}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:10px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--pri)}
.opt .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--mut)}
.opt .t{white-space:pre-wrap;padding-top:3px}
.opt.sel{border-color:var(--pri);background:var(--priSoft)}
.opt.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.pal button{height:42px;border-radius:11px;border:1.5px solid var(--bd);background:var(--surface);color:var(--tx);font-weight:600;font-size:14px;padding:0}
.pal button.na{background:var(--badSoft);border-color:transparent;color:var(--bad)}
.pal button.ans{background:var(--okSoft);border-color:transparent;color:var(--ok)}
.pal button.mark{background:var(--priSoft);border-color:transparent;color:var(--pri)}
.pal button.mans{background:var(--priSoft);border-color:var(--ok);color:var(--ok)}
.pal button.cur{box-shadow:0 0 0 2.5px var(--pri)}
.pal button:disabled{opacity:.55}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:14px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.side{display:none}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.bbar .r{display:flex;gap:8px;max-width:1080px;margin:0 auto;width:100%}
.bbar .r>*{flex:1}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(5,8,20,.55);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet .in{background:var(--surface);width:100%;max-height:82vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.grab{width:42px;height:4px;border-radius:9px;background:var(--bd);margin:0 auto 14px}
@media(min-width:960px){
  .tlayout{grid-template-columns:1fr 320px;align-items:start}
  .side{display:block;position:sticky;top:76px}
  .only-m{display:none!important}
}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,20,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:20px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow);border:1px solid var(--bd)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.mgrid div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.mgrid b{display:block;font-size:20px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;box-shadow:var(--shadow)}

/* result */
.rhero{text-align:center;padding:24px}
.ring{width:150px;height:150px;margin:6px auto 10px;position:relative}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;letter-spacing:-.03em;display:block;line-height:1.1}
.s4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.s4 div{background:var(--surface2);border-radius:12px;padding:10px 4px}
.s4 b{display:block;font-size:19px}
.s4 span{font-size:12px;color:var(--mut)}
.rv{margin-bottom:12px}
.ro{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;margin-bottom:8px;white-space:pre-wrap}
.ro.c{border-color:var(--ok);background:var(--okSoft)}
.ro.w{border-color:var(--bad);background:var(--badSoft)}
.ro .k{font-weight:700;min-width:20px}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.tag.g{background:var(--ok);color:#fff}
.tag.r{background:var(--bad);color:#fff}
.exp{background:var(--warnSoft);color:var(--tx);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin-top:8px}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.lb:last-child{border:0}
.lb .n{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700}
.lb.me{color:var(--pri);font-weight:700}

/* admin */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tbl th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow:auto;border-radius:var(--r)}
.qed{border-left:4px solid var(--pri)}
.qed.miss{border-left-color:var(--bad)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}

/* ================= v3: series / folders / admin ================= */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.scard{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s}
.scard:active{transform:scale(.99)}
.cover{height:96px;padding:14px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;right:-30px;bottom:-56px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16)}
.cover .ico{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;position:relative;z-index:1}
.cover .ico svg{width:22px;height:22px}
.pill{position:relative;z-index:1;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;letter-spacing:.03em;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);color:#4338ca}
.pill.free{color:#15803d}
.pill.paid{color:#b45309}
.pill svg{width:13px;height:13px}
.scard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.scard h3{font-size:17px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:14px;flex-wrap:wrap}
.crumb a{color:var(--mut);font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.crumb a:hover{color:var(--pri)}
.sh{border-radius:22px;color:#fff;padding:22px;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(60,60,160,.25)}
.sh:after{content:"";position:absolute;right:-50px;top:-60px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.14)}
.sh h1{font-size:23px;position:relative;z-index:1}
.sh p{margin:6px 0 0;opacity:.9;position:relative;z-index:1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{display:flex;gap:12px;align-items:center;cursor:pointer;padding:14px;transition:transform .12s}
.fcard:active{transform:scale(.99)}
.fico{width:46px;height:46px;border-radius:13px;background:var(--warnSoft);color:var(--warn);display:grid;place-items:center;flex:none}
.fcard b{display:block;line-height:1.25}
.trow{display:flex;gap:12px;align-items:center;padding:14px 16px;flex-wrap:wrap}
.trow+.trow{margin-top:10px}
.trow .info{flex:1;min-width:190px}
.trow .info h3{font-size:16px;margin-bottom:6px}
.trow .acts{display:flex;gap:8px;flex-wrap:wrap}

:root{--cssv:5}

}

/* ==== v13 DESIGN SYSTEM: Light / Dark / True Black x 6 accents, light glass, buttery motion ==== */
/* -- fonts -- */
:root{--fh:Syne,"DM Sans","Noto Sans Devanagari",system-ui,sans-serif;--fb:"DM Sans",Inter,"Noto Sans Devanagari",system-ui,sans-serif;--ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--gold:#d9a441;--goldg:linear-gradient(135deg,#f6dc8f,#d9a441 55%,#b9822a)}
body{font-family:var(--fb);font-feature-settings:"tnum" 1,"lnum" 1}
h1,h2,h3,.h2s,.brand,#splash b{font-family:var(--fh);font-weight:700;letter-spacing:-.01em}
.stat b,.tiles b,.kv b,.timer,.mring span,.hs b,.hcmp b,.hdl b,.cdn,.big,.score,.ring-c b{font-family:var(--fb);font-weight:700;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}

/* -- mode tokens (neutral backgrounds; accent only tints) -- */
html[data-theme="light"],html[data-theme="light"][data-accent]{
 --bg:#f4f6fa;--surface:#ffffff;--surface2:#eef1f6;--bd:#e2e7ef;--tx:#0e1726;--mut:#5d6879;
 --glass:rgba(255,255,255,.74);--hair:rgba(15,23,42,.07);--hi:rgba(255,255,255,.95);
 --sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);--shadow:var(--sh);
 --ok:#0f9d63;--okSoft:#e3f6ec;--bad:#dc143c;--badSoft:#fde8ec;--warn:#ea580c;--warnSoft:#fff1e6;--goldTx:#8a5d0c;--goldSoft:#fbf1dc;
 --nav:rgba(255,255,255,.78);--hdrg:rgba(244,246,250,.72);--amb:.55}
html[data-theme="dark"],html[data-theme="dark"][data-accent]{
 --bg:#0d1117;--surface:#151b24;--surface2:#1d2531;--bd:#273142;--tx:#e9eef5;--mut:#95a2b4;
 --glass:rgba(255,255,255,.045);--hair:rgba(255,255,255,.08);--hi:rgba(255,255,255,.06);
 --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.32);--shadow:var(--sh);
 --ok:#3ddc97;--okSoft:#10291f;--bad:#ff5c7a;--badSoft:#341119;--warn:#fb923c;--warnSoft:#33200f;--goldTx:#f3d27a;--goldSoft:#2e2410;
 --nav:rgba(21,27,36,.72);--hdrg:rgba(13,17,23,.66);--amb:1}
html[data-theme="dark"][data-oled="1"],html[data-theme="dark"][data-oled="1"][data-accent]{
 --bg:#000;--surface:#0b0b0d;--surface2:#141418;--bd:#1f1f25;--tx:#f2f4f7;--mut:#8e98a7;
 --glass:rgba(255,255,255,.035);--hair:rgba(255,255,255,.075);--hi:rgba(255,255,255,.05);
 --sh:0 10px 30px rgba(0,0,0,.6);--shadow:var(--sh);--nav:rgba(12,12,14,.74);--hdrg:rgba(0,0,0,.66);--amb:.6}

/* -- accent tokens -- */
html[data-accent="cyber"][data-theme="light"]{--pri:#0b84c6;--pri2:#4f46e5;--grad:linear-gradient(135deg,#0891b2,#4f46e5);--glow:rgba(8,132,198,.28);--rgb3:#22d3ee}
html[data-accent="cyber"][data-theme="dark"]{--pri:#38d4f0;--pri2:#6d72f6;--grad:linear-gradient(135deg,#0ea5c6,#6366f1);--glow:rgba(34,211,238,.32);--rgb3:#6366f1}
html[data-accent="green"][data-theme="light"]{--pri:#059669;--pri2:#0d9488;--grad:linear-gradient(135deg,#047857,#10b981);--glow:rgba(5,150,105,.28);--rgb3:#22d3ee}
html[data-accent="green"][data-theme="dark"]{--pri:#34d399;--pri2:#2dd4bf;--grad:linear-gradient(135deg,#059669,#10b981);--glow:rgba(52,211,153,.3);--rgb3:#22d3ee}
html[data-accent="royal"][data-theme="light"]{--pri:#7c3aed;--pri2:#c026d3;--grad:linear-gradient(135deg,#6d28d9,#8b5cf6);--glow:rgba(124,58,237,.28);--rgb3:#ec4899}
html[data-accent="royal"][data-theme="dark"]{--pri:#a78bfa;--pri2:#d946ef;--grad:linear-gradient(135deg,#7c3aed,#a855f7);--glow:rgba(167,139,250,.34);--rgb3:#ec4899}
html[data-accent="blue"][data-theme="light"]{--pri:#1d6fe8;--pri2:#0ea5e9;--grad:linear-gradient(135deg,#1c5fe0,#3b9bff);--glow:rgba(29,111,232,.28);--rgb3:#14b8a6}
html[data-accent="blue"][data-theme="dark"]{--pri:#62a8ff;--pri2:#38bdf8;--grad:linear-gradient(135deg,#2160e0,#3b9bff);--glow:rgba(59,155,255,.32);--rgb3:#14b8a6}
html[data-accent="rose"][data-theme="light"]{--pri:#e11d48;--pri2:#f97316;--grad:linear-gradient(135deg,#e11d48,#fb7185);--glow:rgba(225,29,72,.26);--rgb3:#a855f7}
html[data-accent="rose"][data-theme="dark"]{--pri:#fb7185;--pri2:#fb923c;--grad:linear-gradient(135deg,#e11d48,#f43f5e);--glow:rgba(251,113,133,.32);--rgb3:#a855f7}
html[data-accent="gray"][data-theme="light"]{--pri:#334155;--pri2:#64748b;--grad:linear-gradient(135deg,#1e293b,#475569);--glow:rgba(51,65,85,.24);--rgb3:#64748b}
html[data-accent="gray"][data-theme="dark"]{--pri:#cbd5e1;--pri2:#94a3b8;--grad:linear-gradient(135deg,#475569,#64748b);--glow:rgba(148,163,184,.26);--rgb3:#64748b}
html[data-theme]{--priSoft:color-mix(in srgb,var(--pri) 13%,var(--surface));--accent-color:var(--pri)}
html[data-theme="dark"][data-oled="1"]{--priSoft:color-mix(in srgb,var(--pri) 16%,#000)}

/* -- ambient RGB light: static gradients, no blur filter, no animation (cheap) -- */
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--amb);transform:translateZ(0);
 background:radial-gradient(70% 42% at 0% 0%,color-mix(in srgb,var(--pri) 16%,transparent),transparent 70%),
  radial-gradient(60% 38% at 100% 18%,color-mix(in srgb,var(--pri2) 12%,transparent),transparent 70%),
  radial-gradient(70% 40% at 50% 105%,color-mix(in srgb,var(--rgb3,var(--pri)) 10%,transparent),transparent 70%)!important}
html[data-theme="light"] body::before{opacity:.5}
body.intest::before{display:none}

/* -- glass surfaces: translucent fill + hairline + inner light (no per-card backdrop blur = smooth scroll) -- */
.card,.tiles>div{background:var(--glass);border:1px solid var(--hair)!important;box-shadow:inset 0 1px 0 var(--hi),var(--sh);-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html[data-theme="light"] .card{background:var(--glass)}
.hero .stat,.hero .streak{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.rankc,.hero{border:1px solid rgba(255,255,255,.18)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 16px 40px -12px var(--glow)!important}
.pendc{background:color-mix(in srgb,var(--warn) 9%,var(--glass))}
.notice{background:color-mix(in srgb,var(--pri) 7%,var(--glass))}
.rtabs{background:color-mix(in srgb,var(--bg) 88%,transparent)}
.qcard,body.intest .card,.tlayout .card{background:var(--surface)!important;box-shadow:var(--sh)}
.chip,.pill,.seg,.look,.bdg{border-color:var(--hair)}
input,select,textarea{background:var(--surface);border:1px solid var(--bd);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 16%,transparent)}
.iconbtn{background:var(--glass);border:1px solid var(--hair)!important;box-shadow:inset 0 1px 0 var(--hi),0 2px 8px rgba(0,0,0,.05)}

/* secondary accents: crimson / warm orange / gold */
.tag.paid,.pill.paid{background:var(--goldSoft);color:var(--goldTx)}
.prem{position:absolute;left:12px;top:12px;z-index:2;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.9px;color:#4a3003;background:var(--goldg);border-radius:99px;padding:4px 10px 4px 8px;box-shadow:0 4px 14px rgba(217,164,65,.45)}
.prem svg{width:12px;height:12px;fill:currentColor}
.h2s svg{color:var(--gold)}
.hero .lvl.gold{background:var(--goldg);color:#4a3003;border:0;box-shadow:0 4px 14px rgba(217,164,65,.45)}
.hero .lvl svg{vertical-align:-2px;margin-right:3px;width:12px;height:12px}
.bdg.on{background:var(--goldSoft);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);color:var(--tx)}

/* -- buttons & press feel (press down, spring back) -- */
.btn{background:var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 20px -6px var(--glow);transition:transform .38s var(--spring),box-shadow .2s var(--ease),opacity .2s}
.btn.ghost{background:var(--surface2);box-shadow:none}
.btn.soft{background:var(--priSoft);color:var(--pri);box-shadow:none}
.btn:active,.iconbtn:active,.look:active,.chip:active,.seg button:active,.dri:active{transform:scale(.96);transition-duration:.08s}
.card.scard,.fcard,.hscard,.mkcard,.tksub,.rrow{transition:transform .38s var(--spring)}
.card.scard:active,.fcard:active,.hscard:active,.mkcard:active,.tksub:active{transform:scale(.975);transition-duration:.1s}
@media(hover:hover){.btn:hover,.iconbtn:hover{transform:scale(1.02)}.card.scard:hover{transform:translateY(-3px)}}

/* -- header: clear at top, light frosted blur once you scroll -- */
.hdr{background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none;backdrop-filter:none;transition:background-color .25s var(--ease),box-shadow .25s var(--ease)}
.hdr.sc{background:var(--hdrg)!important;-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 1px 0 var(--hair)!important}
.hdr-in{gap:8px;padding:10px 14px}
.hdr .brand{flex:1;min-width:0;justify-content:center;text-align:center;gap:0}
#mnu[style*="none"]+.brand{justify-content:flex-start}
.brand #sn{font-size:15.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;max-width:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 background:linear-gradient(100deg,var(--tx) 0%,var(--tx) 38%,var(--pri) 50%,var(--tx) 62%,var(--tx) 100%);background-size:260% auto;background-position:100% center;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shim 2.4s var(--ease) .5s 1 both}
@keyframes shim{from{background-position:100% center}to{background-position:0% center}}
.iconbtn{width:38px;height:38px;border-radius:12px}
.iconbtn.av{border-radius:50%;padding:0;overflow:hidden;background:var(--grad)!important;color:#fff;font-family:var(--fh);font-weight:800;font-size:15px;border:2px solid color-mix(in srgb,var(--pri) 30%,transparent)!important;box-shadow:0 4px 14px -4px var(--glow)}
.pfimg{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
#bell .dot,#bell .n,#bell b{pointer-events:none}

/* -- bottom nav: floating glass dock, sliding pill, glowing active icon -- */
@media(max-width:700px){
 body.hasnav .bnav{--i:0;background:var(--nav);border:1px solid var(--hair);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:inset 0 1px 0 var(--hi),0 12px 34px rgba(0,0,0,.18);border-radius:24px;transform:translateZ(0)}
 .bnav:before{content:"";position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 32px)/6);border-radius:17px;background:color-mix(in srgb,var(--pri) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pri) 22%,transparent),0 0 18px -4px var(--glow);transform:translate3d(calc(var(--i)*(100% + 4px)),0,0);transition:transform .45s var(--spring)}
 .bnav button{position:relative;z-index:1;background:transparent!important;color:var(--mut);font-size:9.5px!important;font-weight:700;letter-spacing:.3px;text-transform:uppercase;transition:color .25s var(--ease)}
 .bnav button svg{opacity:.6;transition:transform .4s var(--spring),opacity .25s}
 .bnav button.on{color:var(--pri)}
 .bnav button.on svg{opacity:1;transform:translateY(-1px) scale(1.1);filter:drop-shadow(0 0 6px var(--glow))}
 .bnav button:active svg{transform:scale(.88)}
}
body.intest .bnav{display:none!important}

/* -- page transition: one cheap slide+fade of #app, only on navigation -- */
#app>.wrap,#app>.wrap>*{animation:none!important}
#app.pg{animation:pgIn .3s var(--ease)}
@keyframes pgIn{from{opacity:0;transform:translate3d(var(--dx,16px),0,0)}to{opacity:1;transform:none}}
#app.pgf{animation:pgF .22s var(--ease)}
@keyframes pgF{from{opacity:.4}}

/* -- modals as glass; bottom sheets -- */
.modal{background:rgba(3,6,14,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal .box{background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--hair);box-shadow:inset 0 1px 0 var(--hi),0 0 70px -20px var(--glow),0 24px 60px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.modal.bsheet{display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeBg .25s var(--ease)}
.modal.bsheet .box{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));border-bottom:0;animation:sheetUp .38s var(--ease)}
.modal.bsheet.again,.modal.bsheet.again .box{animation:none}
@keyframes sheetUp{from{transform:translate3d(0,100%,0)}}
@keyframes fadeBg{from{background:transparent}}
.shnd{width:40px;height:4px;border-radius:4px;background:var(--bd);margin:2px auto 12px}
.shclose{position:absolute;right:14px;top:16px;width:34px;height:34px;border-radius:11px;border:1px solid var(--hair);background:var(--surface2);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.sht{font-size:21px;margin:4px 0 12px}
.shl{height:1px;background:var(--hair);margin:0 -18px 14px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
/* theme sheet */
.modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{border:1.5px solid var(--hair);background:var(--surface2);border-radius:16px;padding:8px 8px 10px;cursor:pointer;color:var(--tx);font:inherit;font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:8px;align-items:stretch;transition:transform .35s var(--spring),border-color .2s}
.mode i{display:block;height:56px;border-radius:10px;position:relative;overflow:hidden;border:1px solid rgba(127,127,127,.25)}
.mode i:before{content:"";position:absolute;left:8px;right:8px;top:9px;height:9px;border-radius:5px;background:var(--grad);opacity:.95}
.mode i:after{content:"";position:absolute;left:8px;right:22px;top:24px;height:6px;border-radius:4px;background:rgba(127,127,127,.4);box-shadow:0 11px 0 rgba(127,127,127,.3)}
.mode.on{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.mode:active{transform:scale(.96)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.accb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--hair);background:var(--surface2);color:var(--tx);font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;text-align:left;transition:transform .35s var(--spring),border-color .2s}
.accb i{width:30px;height:30px;border-radius:9px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px -3px rgba(0,0,0,.3)}
.accb.on{border-color:var(--pri);background:var(--priSoft)}
.accb:active{transform:scale(.96)}
/* profile sheet */
.pfhead{text-align:center;margin-bottom:12px}
.pfav{position:relative;display:inline-block;cursor:pointer}
.pfav .bigav{width:92px;height:92px;margin:2px auto 8px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-family:var(--fh);font-size:38px;font-weight:800;overflow:hidden;box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent),0 12px 30px -8px var(--glow)}
.pfcam{position:absolute;right:2px;bottom:10px;width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--pri);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2);border:1px solid var(--hair)}
.pfl{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.pfi{width:100%;padding:12px 14px;border-radius:13px;font:inherit;font-size:15px}
textarea.pfi{resize:vertical;min-height:64px}
.hero .bigav,.drh .bigav{overflow:hidden}
/* toggle */
.toast{animation:toastPop .35s var(--spring)}
@keyframes toastPop{from{opacity:0;transform:translateX(-50%) translateY(16px) scale(.94)}}
.drp{background:color-mix(in srgb,var(--surface) 88%,transparent)!important;-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4)}
.drh{background:var(--grad)}
.drh .bigav{border-radius:50%}
#splash.off{pointer-events:none}
@media(prefers-reduced-motion:reduce){#app.pg,#app.pgf,.modal.bsheet .box,.bnav:before{animation:none!important;transition:none!important}}
.bsheet .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px;text-align:center}
.bsheet .kv div{background:var(--surface2);border:1px solid var(--hair);border-radius:14px;padding:10px 4px}
.bsheet .kv b{display:block;font-size:19px}.bsheet .kv span{font-size:11px;color:var(--mut)}
.bsheet .pfi{background:var(--surface2);border:1px solid var(--hair);color:var(--tx);box-shadow:none}
.bsheet .pfi:focus{background:var(--surface);border-color:var(--pri)}
.drh .bigav{display:grid;place-items:center;font-family:var(--fh);font-weight:800;color:#fff;background:rgba(255,255,255,.22)!important;border:2px solid rgba(255,255,255,.5)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.4,0,.2,1)}

/* ---- v14 buttery navigation: GPU view-transition slide, header + nav pinned ---- */
#app{min-height:calc(100dvh - 60px)}
html[data-vt] .hdr{view-transition-name:hdr}
html[data-vt] body.hasnav .bnav{view-transition-name:bnav}
html[data-vt]::view-transition-group(hdr),html[data-vt]::view-transition-group(bnav),
html[data-vt]::view-transition-new(hdr),html[data-vt]::view-transition-new(bnav){animation:none}
html[data-vt]::view-transition-old(hdr),html[data-vt]::view-transition-old(bnav){display:none}
html[data-vt]::view-transition-old(root){animation:vtOutF .26s cubic-bezier(.4,0,.2,1) both}

html[data-vt="b"]::view-transition-new(root){animation-name:vtInB}
@keyframes vtOutF{to{opacity:0;transform:translate3d(-28px,0,0)}}
@keyframes vtInF{from{opacity:0;transform:translate3d(36px,0,0)}}
@keyframes vtOutB{to{opacity:0;transform:translate3d(28px,0,0)}}
@keyframes vtInB{from{opacity:0;transform:translate3d(-36px,0,0)}}
#app.pgf{animation:pgF .28s var(--ease)}
@keyframes pgF{from{opacity:.35}}
html[data-vt]::view-transition-old(root){animation-duration:.28s}
html[data-vt]::view-transition-new(root){animation-duration:.42s}
@media(max-width:700px){.bnav:before{transition:transform .42s cubic-bezier(.22,.8,.24,1)}.bnav button svg{transition:transform .3s cubic-bezier(.22,.8,.24,1),opacity .25s}}

/* ---- v15 polish: visible edges in dark/black, fonts, header fit ---- */
/* soft accent-tinted outline + dim glow so boxes read clearly on black */
html[data-theme="dark"]{--hair:color-mix(in srgb,var(--pri) 14%,rgba(255,255,255,.09))}
html[data-theme="dark"][data-oled="1"]{--hair:color-mix(in srgb,var(--pri) 24%,rgba(255,255,255,.08));--glass:rgba(255,255,255,.035);--surface2:#121216}
html[data-theme="dark"] .card,html[data-theme="dark"] .tiles>div{box-shadow:inset 0 1px 0 var(--hi),0 0 0 .5px color-mix(in srgb,var(--pri) 10%,transparent),0 10px 30px -14px rgba(0,0,0,.6)}
html[data-oled="1"] .card,html[data-oled="1"] .tiles>div{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 22px -12px var(--glow)}
html[data-theme="dark"] .chip,html[data-theme="dark"] .seg,html[data-theme="dark"] .btn.ghost,html[data-theme="dark"] .look,html[data-theme="dark"] .bdg,html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea,html[data-theme="dark"] .iconbtn{border:1px solid var(--hair)}
html[data-oled="1"] .bar,html[data-oled="1"] .pbar,html[data-oled="1"] .tkbar{background:#1a1a20}
html[data-oled="1"] body.hasnav .bnav{border-color:var(--hair)}
/* typography: Syne only for big titles; card titles + body in DM Sans */
h3,.trow .info h3,.scard h3,.card h3{font-family:var(--fb)!important;font-weight:700;letter-spacing:-.01em}
h1,h2,.sht,.h2s,#splash b{font-family:var(--fh)}
.hdr .brand #sn{font-size:14.5px;letter-spacing:.03em}
.hdr-in{gap:6px}
.hdr .iconbtn{width:36px;height:36px}
/* test rows: never overflow the card */
.trow{display:grid!important;grid-template-columns:42px 1fr;align-items:start;gap:12px;padding:14px!important}
.trow .info{min-width:0}
.trow .info h3{font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.trow .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.trow .acts .btn{flex:1;min-width:0}
.trow .chips{display:flex;flex-wrap:wrap;gap:6px}
/* question palette: tidy grid */
.sheet .in{max-height:78vh;overflow:auto}
.pal{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:9px;padding:4px 2px;max-height:40vh;overflow:auto}
.pal button{width:100%;height:44px;min-width:0;font-size:14.5px;font-family:var(--fb);font-weight:700;display:grid;place-items:center}
.pal button.cur{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--pri)}
.leg2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:14px;font-size:13px}
.leg2 span{display:flex;align-items:center;gap:8px;min-width:0}

/* ---- v16 notifications page + install sheet ---- */
.ntf .nhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.ntitle{font-size:26px;margin:6px 0 2px}
.ncard{padding:16px 16px 14px!important;margin-bottom:12px;position:relative}
.ncard.isnew{border-color:color-mix(in srgb,var(--pri) 45%,var(--hair))!important;box-shadow:inset 3px 0 0 var(--pri),var(--sh)!important}
.nctop{display:flex;align-items:flex-start;gap:12px}
.nico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--priSoft);color:var(--pri)}
.ncard h3{font-size:16.5px;line-height:1.3;margin:0;overflow-wrap:anywhere}
.nmeta{font-size:12.5px;color:var(--mut);margin-top:3px}
.newb{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:#fff;background:var(--grad);border-radius:99px;padding:3px 9px;flex:none;box-shadow:0 4px 12px -4px var(--glow)}
.nbody{margin-top:12px;font-size:15px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere;color:var(--tx)}
.nbody.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.nmore{border:0;background:none;color:var(--pri);font-weight:700;padding:6px 0 0;font-size:14px;cursor:pointer}
.nimg{margin-top:12px;border-radius:14px;width:100%;max-height:420px;object-fit:contain;background:var(--surface2)}
.nlink{margin-top:12px;text-decoration:none;display:inline-flex}
/* ---- v36 "Haan, padh liya" + phone notifications strip ---- */
.ncard.unread .nico{background:var(--pri);color:#fff}
.nrow:empty{display:none}
.nrow{margin-top:12px;display:flex}
.nread{display:inline-flex;align-items:center;gap:6px}
.nread.done{font-size:13px;font-weight:700;color:var(--ok);padding:6px 0}
.npstrip{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:14px 16px!important}
.setrow{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--hair);border-radius:16px;padding:12px;margin-bottom:10px}
.setico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--priSoft);color:var(--pri)}
.instv{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.instico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none;box-shadow:0 10px 24px -8px var(--glow)}
.isteps{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px}
.isteps li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface2);border:1px solid var(--hair);font-size:14.5px}
.isteps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--priSoft);color:var(--pri);font-size:13px;flex:none}

/* ---- v16 side drawer: compact width, centered profile, clean list ---- */
.drp.sb{width:min(64vw,272px);background:var(--bg)!important;box-shadow:12px 0 40px rgba(0,0,0,.25)}
.sbh{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 26px) 14px 18px;border-bottom:1px solid var(--bd);background:radial-gradient(120% 80% at 50% 20%,color-mix(in srgb,var(--pri) 9%,transparent),transparent 70%)}
.sbx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--surface);color:var(--mut);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.sbav{width:72px;height:72px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--surface);color:var(--pri);font-family:var(--fh);font-size:28px;font-weight:800;box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 10%,transparent),0 8px 22px -8px var(--glow)}
.sbn{display:block;margin-top:10px;font-family:var(--fh);font-size:18px;font-weight:700;color:var(--tx);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbs{font-size:12.5px;color:var(--mut);margin-top:3px}
.sbvp{margin-top:12px;padding:6px 16px;border-radius:99px;border:1px solid color-mix(in srgb,var(--pri) 35%,transparent);background:color-mix(in srgb,var(--pri) 10%,var(--surface));color:var(--pri);font:inherit;font-size:13px;font-weight:700}
.sb .drl{padding:8px 8px 20px}
.sbd{height:1px;background:var(--bd);margin:6px 12px}
.sb .dri{gap:14px;padding:11px 12px;font-size:15px;font-weight:500;letter-spacing:.1px;color:var(--tx);border-radius:14px}
.sb .dri svg{color:var(--mut);stroke-width:1.6}
.sb .dri.on{background:var(--surface);color:var(--tx);box-shadow:0 2px 10px rgba(15,23,42,.06)}.sb .dri.on svg{color:var(--pri)}
.sb .dri.out{color:var(--bad);margin-top:4px}.sb .dri.out svg{color:var(--mut)}
.strow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--surface2);color:var(--tx);border-radius:14px;padding:12px;margin-bottom:8px;font:inherit}
.strow .grow b{display:block;font-size:15px;font-weight:600}.strow small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.stic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface);color:var(--pri);flex:none}
.strow>svg{color:var(--mut)}
.legal{font-size:14px;line-height:1.6;color:var(--tx)}.legal p{margin:0 0 10px}.legal h4{font-size:14.5px;margin:16px 0 4px}.legal ul{margin:0 0 10px;padding-left:20px}.legal li{margin:3px 0}.legal a{color:var(--pri)}
.bnav button svg{stroke-width:1.7}

/* ---- v18 mistake notebook + saved: hero, search, notes, tags, revision quiz ---- */
.nbhero{background:var(--grad)!important;color:#fff;display:flex;align-items:center;gap:16px;margin-bottom:10px}
.nbring{position:relative;flex:none;display:grid;place-items:center}.nbring>svg{display:block}
.nbring>span{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.05}.nbring b{font-size:20px}.nbring small{font-size:10px;opacity:.85;text-transform:uppercase;letter-spacing:.4px}
.nbring.big{margin:6px auto 0}.nbring.big b{font-size:34px;color:var(--tx)}.nbring.big small{color:var(--mut)}
.nbhero .nbring svg circle:first-child{stroke:rgba(255,255,255,.25)!important}
.nbbig{font-family:var(--fh);font-size:30px;font-weight:700;line-height:1.1;margin:2px 0 6px}.nbbig span{font-size:14px;font-weight:600;opacity:.85;font-family:var(--fb)}
.nbst{display:flex;flex-wrap:wrap;gap:6px}.nbst span{background:rgba(255,255,255,.18);border-radius:99px;padding:3px 9px;font-size:11.5px;font-weight:700}
.svic{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}.svic svg{fill:rgba(255,255,255,.25)}
.nbact{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}.nbact .btn{flex:1;margin:0}
.nbtd{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--hair);font-size:12.5px;color:var(--mut);white-space:nowrap;box-shadow:var(--sh)}.nbtd b{color:var(--tx);font-size:15px}.nbtd svg{color:var(--pri)}
.nbtd.tgl{font:inherit;font-size:12.5px;font-weight:600;color:var(--tx);cursor:pointer}
.nbseg{width:100%;display:flex;margin-bottom:10px}.nbseg button{flex:1}.nbseg small{opacity:.6;font-weight:700}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chiprow::-webkit-scrollbar{display:none}.chiprow .chip{border:0;font-size:12.5px;padding:7px 13px;white-space:nowrap;flex:none;cursor:pointer}
.chip.bad{background:var(--badSoft);color:var(--bad)}
.qsearch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:0 12px;margin-bottom:14px;color:var(--mut);box-shadow:var(--sh)}
.qsearch input{flex:1;border:0!important;background:transparent!important;box-shadow:none!important;padding:12px 0!important;font:inherit;color:var(--tx);outline:0;min-width:0}
.qx .qxh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.qno{font-family:var(--fb);font-weight:800;font-size:13px;background:var(--priSoft);color:var(--pri);border-radius:9px;padding:4px 9px}
.qsrc{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}.qsrc b{color:var(--pri)}
.iconbtn.on[data-nb]{background:var(--priSoft);color:var(--pri);border-color:transparent}
.ro.was{border-style:dashed;border-color:var(--bad)}
.fb{margin:6px 0 2px;padding:9px 12px;border-radius:12px;font-weight:700;font-size:14px}.fb.g{background:var(--okSoft);color:var(--ok)}.fb.b{background:var(--badSoft);color:var(--bad)}
.qnote{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--priSoft);font-size:14px;white-space:pre-wrap;cursor:pointer;border-left:3px solid var(--pri)}.qnote b{display:flex;align-items:center;gap:5px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--pri);margin-bottom:3px}
.tgrow{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.tgb{border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:99px;padding:5px 11px;font:inherit;font-size:12px;font-weight:600}.tgb.on{background:var(--priSoft);border-color:var(--pri);color:var(--pri)}
.bmg{margin-bottom:6px}.bmg>summary{list-style:none;display:flex;align-items:center;gap:8px;font-family:var(--fh);font-weight:700;font-size:16px;padding:12px 2px;cursor:pointer}.bmg>summary::-webkit-details-marker{display:none}
.bmg>summary .n{font-family:var(--fb);font-size:12px;background:var(--surface2);border-radius:99px;padding:2px 9px;color:var(--mut)}.bmg>summary>svg:last-child{transition:transform .2s;color:var(--mut)}.bmg[open]>summary>svg:last-child{transform:rotate(90deg)}
.rsx{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;animation:drwF .2s ease}
.rstop{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px}
.rsbar{height:5px;background:var(--surface2);margin:0 14px;border-radius:99px;overflow:hidden}.rsbar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .35s var(--ease)}
.rsbody{flex:1;overflow-y:auto;padding:16px;max-width:720px;width:100%;margin:0 auto}
.rsend{text-align:center;padding-top:30px}
.rsfoot{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));max-width:720px;width:100%;margin:0 auto}

/* ---- v19 home: promo slider, dashboard, tracker snapshot, leaderboard ---- */
#thm{display:none!important}
.promo{position:relative;margin-bottom:14px}
.pmtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:22px;scrollbar-width:none;box-shadow:0 14px 34px -14px var(--glow)}.pmtrack::-webkit-scrollbar{display:none}
.pms{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/9;display:block;text-decoration:none;color:#fff;position:relative;overflow:hidden;background:var(--surface2)}
.pms img{width:100%;height:100%;object-fit:cover;display:block;user-select:none}
.pmtx{position:absolute;inset:0;display:flex;align-items:center;padding:18px 20px;overflow:hidden}
.pmtx.pva{background:linear-gradient(135deg,#0f172a,#1e3a8a 55%,#7c3aed)}.pmtx.pvb{background:var(--grad)}.pmtx.pvc{background:linear-gradient(135deg,#0e7490,#0ea5e9 60%,#22d3ee)}
.pmb{position:relative;z-index:1;max-width:78%}.pmb b{display:block;font-family:var(--fh);font-size:21px;line-height:1.15}.pmb span{display:block;font-size:13px;opacity:.88;margin-top:6px;line-height:1.4}
.pmb em{display:inline-block;font-style:normal;margin-top:12px;background:#fff;color:#0f172a;border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:800}
.pmo1,.pmo2{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}.pmo1{width:180px;height:180px;right:-50px;top:-60px}.pmo2{width:120px;height:120px;right:40px;bottom:-60px;background:rgba(255,255,255,.08)}
.pmdots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.pmdots button{pointer-events:auto;width:7px;height:7px;border-radius:99px;border:0;padding:0;background:rgba(255,255,255,.55);transition:width .3s var(--ease),background .3s}.pmdots button.on{width:20px;background:#fff}
.home2 .cdc{margin-top:0}
.dash{padding:16px}
.dkpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dkpi div{background:var(--surface2);border-radius:14px;padding:10px 8px;text-align:center}.dkpi span{display:block;font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px}.dkpi b{display:block;font-size:19px;margin-top:2px}
.dchart{margin-top:14px}.dch{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.dbig{font-family:var(--fh);font-size:28px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dlt{display:inline-flex;align-items:center;gap:2px;font-family:var(--fb);font-size:12px;font-weight:800;border-radius:99px;padding:3px 8px;background:var(--surface2);color:var(--mut)}.dlt.g{background:var(--okSoft);color:var(--ok)}.dlt.b{background:var(--badSoft);color:var(--bad)}
.achart{width:100%;height:130px;display:block;overflow:visible}.agl{stroke:var(--bd);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}.aavg{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.apt{fill:var(--surface);stroke:var(--pri);stroke-width:2}.alast{fill:var(--pri);stroke:var(--surface);stroke-width:2.5}
.dleg{display:flex;gap:14px;font-size:11.5px;color:var(--mut);margin-top:6px}.dleg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}.dleg .l1{background:var(--pri)}.dleg .l2{background:var(--warn)}
.dnote{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13.5px}.dnote.g{background:var(--okSoft)}.dnote.b{background:var(--badSoft)}
.dmini{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px;border:1px solid var(--bd);border-radius:14px}
.dmini div{text-align:center;padding:10px 4px;border-left:1px solid var(--bd)}.dmini div:first-child{border-left:0}.dmini b{display:block;font-size:16px}.dmini span{font-size:10.5px;color:var(--mut)}
.dweek{margin-top:14px}.dweek .week{height:70px}
.dtrk{cursor:pointer}.dtrkh{display:flex;align-items:center;gap:14px}.dtrkh>svg{color:var(--mut)}
.dtrks{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:14px}.dtrks:empty{display:none}
.dlbh{display:flex;align-items:center;gap:16px}
.dlbr{flex:none;width:92px;height:92px;border-radius:24px;background:var(--grad);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 24px -10px var(--glow)}.dlbr span{font-size:10.5px;opacity:.85}.dlbr b{font-family:var(--fh);font-size:28px;line-height:1.1}
.dlbbeat{font-size:13.5px;margin-bottom:8px}.dlbk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.dlbk b{display:block;font-size:15px}.dlbk span{font-size:10.5px;color:var(--mut)}
.dlbl{margin-top:14px;border-top:1px solid var(--bd);padding-top:4px}
@media(max-width:380px){.dkpi b{font-size:16px}.pmb b{font-size:18px}}
.livec{cursor:pointer;border:1.5px solid color-mix(in srgb,var(--bad) 35%,transparent)!important;background:linear-gradient(135deg,color-mix(in srgb,var(--bad) 7%,var(--surface)),var(--surface))!important}
.livet{display:flex;align-items:center;gap:10px;margin-bottom:8px}.livett{display:block;font-family:var(--fh);font-size:19px;margin-bottom:2px}
.liveb{display:inline-flex;align-items:center;gap:6px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;letter-spacing:.8px;border-radius:99px;padding:4px 10px}
.liveb i{width:7px;height:7px;border-radius:50%;background:#fff;animation:livep 1.2s ease-in-out infinite}@keyframes livep{50%{opacity:.25;transform:scale(.7)}}
.shx .shc{position:relative}.shbtn{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#0f172a;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}

/* ---- v20 test series list + series page ---- */
.slhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}.slt{font-size:26px;margin:0 0 2px}
.slring{position:relative;display:grid;place-items:center}.slring span{position:absolute;font-weight:800;font-size:13px}
.chiprow .chip small{opacity:.6;font-weight:800;margin-left:2px}
.sgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.scard2{padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.cover.sc2c{aspect-ratio:16/9;height:auto;display:flex;align-items:flex-start;justify-content:space-between;padding:12px}
.cover.sc2c .ico{margin:0}.cover.sc2c .tag{margin:0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.cover.sc2c .tag.free{background:#fff;color:#047857}
.sc2b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1}.sc2b h3{font-size:18px;margin:0}

.chiprow{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}.chiprow::-webkit-scrollbar{display:none}
.nbseg{display:flex;overflow-x:auto;scrollbar-width:none}.nbseg button{flex:1 0 auto}
.card{transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.card[onclick]:active,.scard2:active{transform:scale(.985)}
.btn:active{transform:scale(.97)}
img,svg{max-width:100%}
.wrap{overflow-x:clip}
/* home: up next */
.hero5{position:relative;overflow:hidden;padding:20px;color:#fff;background:var(--grad)!important;box-shadow:0 18px 40px -16px var(--glow);margin:4px 0 14px}
.hero5:before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);animation:h5f 7s ease-in-out infinite;pointer-events:none}
@keyframes h5f{50%{transform:translate(-24px,18px) scale(1.15)}}
.hero5 .h5k{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:600;opacity:.92}
.hero5 .h5b{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:4px 10px;font-size:10.5px;font-weight:800;letter-spacing:.8px}
.hero5 .h5t{display:block;font-family:var(--fh);font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:12px 0 4px;position:relative;word-break:break-word}
.hero5 .h5m{font-size:12.5px;font-weight:500;opacity:.88;position:relative}
.hero5 .h5go{position:relative;margin-top:16px;width:100%;background:#fff!important;color:#0e1726!important;box-shadow:0 10px 24px -10px rgba(0,0,0,.4);font-weight:800}
.hstk{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer}.hstk .pbar{margin-top:10px}
/* tests: equal height cards, badge beside title */
.sgrid2{align-items:stretch}
.scard2{display:flex;flex-direction:column;overflow:hidden}
.scard2 .sc2b{display:flex;flex-direction:column;flex:1}
.scard2 .sc2f{margin-top:auto;padding-top:12px}
.sc2tt{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}.sc2tt h3{margin:0;flex:1;min-width:0}.sc2tt .tag{flex:none;position:static!important}
/* mistakes + saved: short cards */
.qx[data-vx]{cursor:pointer}
.vxc .ro,.vxc .exp,.vxc .fb,.vxc>.row,.vxc .tgrow,.vxc [data-nk],.vxc .qi,.vxc>.sm.mut,.vxc .qxh .iconbtn{display:none!important}
.vxc .qt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:0}
.vxch{display:grid;place-items:center;color:var(--mut);transition:transform .3s var(--spring)}.vxo .vxch{transform:rotate(90deg)}
.vxa>*:not(.qxh){animation:vxIn .38s var(--ease) both}
@keyframes vxIn{from{opacity:0;transform:translateY(-6px)}}
/* tracker: one filter row less (weeks stay under the Weeks button) */
#trk .tkweeks{display:none}
/* motion: cards rise in one after another */
.wrap>*{animation:rise .48s var(--ease) both}
.wrap>*:nth-child(2){animation-delay:.03s}.wrap>*:nth-child(3){animation-delay:.06s}.wrap>*:nth-child(4){animation-delay:.09s}
.wrap>*:nth-child(5){animation-delay:.12s}.wrap>*:nth-child(n+6){animation-delay:.15s}
.spark,.tkdw{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){.wrap>*,.vxa>*,.hero5:before{animation:none!important}}
/* ===== v17 (app17.js): clean series, folder and test rows (no % bars), one attempt while live ===== */
.sc3 .sc3m{font-size:13px;color:var(--mut);font-weight:500}
.sc3n{display:flex;align-items:center;gap:8px;font-size:13px;padding:9px 11px;border-radius:12px;background:var(--surface2);color:var(--tx);min-width:0}
.sc3n .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc3n svg{color:var(--pri);flex:none}.sc3n.live{background:color-mix(in srgb,var(--bad) 8%,var(--surface))}.sc3n.prog{background:var(--warnSoft)}.sc3n.prog svg{color:var(--warn)}
.sc3 .sc2f .btn{width:100%;justify-content:center}
.sv3 .shc.cover{aspect-ratio:16/9;height:auto}
.sv3m{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sv3m span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--mut);background:var(--surface2);border-radius:99px;padding:6px 11px}
.fl3,.tl3{display:flex;flex-direction:column;gap:10px}
.tl3{animation:rise .35s var(--ease) both}
.fr3{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;transition:transform .3s var(--spring)}
.fr3 .grow{min-width:0}.fr3 b{display:block;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.fr3 .fico{width:42px;height:42px;border-radius:12px}
.fr3c{color:var(--mut);display:grid;place-items:center;transition:transform .25s var(--ease)}
.fr3:hover .fr3c{transform:translateX(3px)}.fr3:active{transform:scale(.98)}
.fh3{display:flex;align-items:center;gap:14px;padding:16px}
.fh3 h1{font-size:20px;line-height:1.25;margin:0 0 3px;overflow-wrap:anywhere}
.tl3 .trow+.trow{margin-top:0}
.tr3 .info h3{margin-bottom:3px}
.tr3m{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.tr3n{font-size:12.5px;color:var(--mut);margin-top:8px}
.trow.st-held{border-left-color:var(--ok)!important}.trow.st-closed{border-left-color:var(--bd)!important}
.tr3.st-done .tico,.tr3.st-held .tico{background:var(--okSoft);color:var(--ok)}
.tr3 .btn[disabled]{opacity:.7}
@media(prefers-reduced-motion:reduce){.tl3{animation:none!important}}

#splash .sp-sh{position:absolute;top:0;bottom:0;left:0;width:22%;opacity:.9;transform:translateX(-110%);
 background:linear-gradient(100deg,transparent,var(--sp-sh) 50%,transparent)}
#splash .sp-glow{position:absolute;left:50%;top:32%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(circle,var(--sp-glow) 0%,transparent 62%);pointer-events:none}
#splash .sp-flare{position:absolute;left:68.06%;top:23.66%;width:46%;aspect-ratio:1;border-radius:50%;opacity:0;pointer-events:none;
 transform:translate(-50%,-50%) scale(.2);background:radial-gradient(circle,rgba(255,236,180,.95) 0%,rgba(243,208,122,.45) 14%,rgba(243,208,122,0) 58%)}
#splash .sp-flare:before,#splash .sp-flare:after{content:"";position:absolute;left:50%;top:50%;width:100%;height:2px;border-radius:2px;transform:translate(-50%,-50%);
 background:linear-gradient(90deg,transparent,rgba(255,240,200,.95),transparent)}
#splash .sp-flare:after{transform:translate(-50%,-50%) rotate(90deg);width:70%}
#splash .sp-ld{position:absolute;left:50%;top:calc(100% + 34px);width:96px;height:2px;margin-left:-48px;border-radius:2px;overflow:hidden;opacity:0;
 background:color-mix(in srgb,var(--sp-gold) 22%,transparent);animation:spLdIn .4s ease-out 1s forwards}
#splash .sp-ld i{display:block;width:40%;height:100%;border-radius:2px;background:var(--sp-gold);animation:spLd 1.1s ease-in-out infinite}

/* full show (first open of the app), about 1.8 s: A rises, swoosh sweeps, cap drops, star sparkles, name appears with a shine.
   Only transform and opacity are animated, so the phone's graphics chip runs it even while the app is still loading. */
#splash.go .ly,#splash.go .wp,#splash.go .wpi,#splash.go .sp-sh,#splash.go .sp-flare{will-change:transform,opacity}
#splash.go .sp-glow{animation:spFade 1s ease-out .05s both}
#splash.go .p-a{transform-origin:50% 100%;animation:spRise .55s cubic-bezier(.22,.8,.24,1) .05s both}
#splash.go .p-sw .wp{animation:spWp .6s cubic-bezier(.6,0,.3,1) .25s both}
#splash.go .p-sw .wpi{animation:spWpi .6s cubic-bezier(.6,0,.3,1) .25s both}
#splash.go .p-capw{transform-origin:49.7% 25.8%;animation:spCap .6s cubic-bezier(.3,.7,.35,1) .5s both}
#splash.go .p-tas{transform-origin:50% 1.5%;animation:spSwing 1.3s ease-out .82s both}
#splash.go .p-st{transform-origin:50% 50%;animation:spStar .7s cubic-bezier(.3,1.35,.5,1) .85s both}
#splash.go .sp-flare{animation:spFlare .8s cubic-bezier(.2,.7,.3,1) .87s both}
#splash.go .p-wd .wp{animation:spWp .65s cubic-bezier(.55,0,.25,1) .62s both}
#splash.go .p-wd .wpi{animation:spWpi .65s cubic-bezier(.55,0,.25,1) .62s both}
#splash.go .sp-sh{animation:spSheen .7s cubic-bezier(.45,0,.25,1) 1.1s both}
#splash.go .p-ed{animation:spUp .45s cubic-bezier(.22,.8,.24,1) 1s both}
#splash.go .p-ll{transform-origin:100% 50%;animation:spLine .5s cubic-bezier(.22,.8,.24,1) 1.1s both}
#splash.go .p-lr{transform-origin:0 50%;animation:spLine .5s cubic-bezier(.22,.8,.24,1) 1.1s both}
#splash.go .sp-ld{animation-delay:2.2s}
#splash.q .sp-in{animation:spFade .2s ease-out both}
html[data-lite] #splash .sp-glow,html[data-lite] #splash .sp-flare{display:none}
@keyframes spFade{from{opacity:0}}
@keyframes spLdIn{to{opacity:1}}
@keyframes spLd{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes spRise{from{opacity:0;transform:translateY(9%) scale(.94)}to{opacity:1;transform:none}}
@keyframes spWp{from{transform:translateX(-100%)}to{transform:none}}
@keyframes spWpi{from{transform:translateX(140%)}to{transform:none}}
@keyframes spCap{0%{opacity:0;transform:translate(-4%,-78%) rotate(-15deg)}45%{opacity:1}
 58%{transform:translate(0,2%) rotate(1.6deg)}78%{transform:translate(0,-.9%) rotate(-.6deg)}100%{opacity:1;transform:none}}
@keyframes spSwing{0%{transform:rotate(0)}14%{transform:rotate(10deg)}34%{transform:rotate(-6.5deg)}54%{transform:rotate(3.5deg)}74%{transform:rotate(-1.4deg)}100%{transform:rotate(0)}}
@keyframes spStar{from{opacity:0;transform:scale(0) rotate(-150deg)}to{opacity:1;transform:none}}
@keyframes spFlare{0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-20deg)}32%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(25deg)}}
@keyframes spSheen{from{transform:translateX(-110%)}to{transform:translateX(560%)}}
@keyframes spUp{from{opacity:0;transform:translateY(30%)}to{opacity:1;transform:none}}
@keyframes spLine{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#splash .sp-lg *,#splash .sp-in{animation:none!important}}

.brand .bmk-s{position:absolute;top:-10%;bottom:-10%;left:0;width:30%;transform:translateX(-120%) skewX(-18deg);will-change:transform;
 background:linear-gradient(90deg,transparent 0%,color-mix(in srgb,var(--brand-glow) 55%,transparent) 28%,var(--brand-shine) 44%,var(--bmk-core,#fff) 50%,var(--brand-shine) 56%,color-mix(in srgb,var(--brand-glow) 55%,transparent) 72%,transparent 100%)}
.brand .bmk-w.bmk-go .bmk-s{animation:bmkSh 1.6s cubic-bezier(.5,0,.2,1)}
@keyframes bmkSh{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(400%) skewX(-18deg)}}
.brand .bmk-e{display:block;font:600 9.5px/1 "DM Sans",Inter,system-ui,sans-serif;letter-spacing:.86em;margin-right:-.86em;color:#5f6680;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;white-space:nowrap}
html[data-theme="dark"] .brand .bmk-w{background:var(--bmk-ink,#f3f5fa);--bmk-core:color-mix(in srgb,var(--brand-glow) 35%,#fff)}
html[data-theme="dark"] .brand .bmk-e{color:#a9b1c4}
@media(prefers-reduced-motion:reduce){.brand .bmk-s{display:none}}

/* battery friendly: decorations that used to loop for ever now play a few times and stop */
.hero5:before{animation-iteration-count:1!important}
.upc.today{animation-iteration-count:3!important}
.lvtd,.npbell{animation-iteration-count:4!important}
.liveb i{animation-iteration-count:8!important}

/* lite mode (html[data-lite]: phones with few cores or little memory, data saver, or battery at 20% or less and not
   charging): lighter blur behind the header and menu bar, none behind sheets, plain page change — smoother scrolling, less battery */
html[data-lite] .rtabs,html[data-lite] .modal,
html[data-lite] .modal .box,html[data-lite] .sheet .in,html[data-lite] .instbar,html[data-lite] .drw,html[data-lite] .drp,html[data-lite] .hero .stat,html[data-lite] .hero .streak{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
/* the header and the menu bar keep their frosted glass in lite mode too, with a lighter blur */
html[data-lite] .hdr.sc{-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4)}
html[data-lite] body.hasnav .bnav{-webkit-backdrop-filter:blur(12px) saturate(1.5);backdrop-filter:blur(12px) saturate(1.5)}
html[data-lite] .rtabs{background:var(--bg)!important}
html[data-lite] .modal .box,html[data-lite] .sheet .in,html[data-lite] .instbar,html[data-lite] .drp{background:var(--surface)!important}
html[data-lite] .modal{background:rgba(3,6,14,.58)!important}
html[data-lite] .hero5:before,html[data-lite] .upc.today,html[data-lite] .lvtd,html[data-lite] .npbell{animation:none!important}
/* ===== overlays (side menu, pop-ups, sheets): the page behind blurs on every phone =====
   Before, the dark layer AND the box on top both used backdrop-filter. Android Chrome then drops the outer blur, so
   the page behind was only dimmed. Now only the page behind is blurred (a plain filter, works everywhere) and the
   layers on top have no backdrop-filter of their own. */
.drw,.modal,.modal.bsheet,.sheet{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.modal .box,.modal.bsheet .box,.sheet .in,.drp{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.modal .box,.modal.bsheet .box{background:color-mix(in srgb,var(--surface) 96%,transparent)}
.sheet .in{background:color-mix(in srgb,var(--surface) 97%,transparent)}
#app,.hdr,.bnav{transition:filter .35s var(--ease),opacity .35s var(--ease)}
.hdr{transition:filter .35s var(--ease),opacity .35s var(--ease),background-color .25s var(--ease),box-shadow .25s var(--ease)}
body.ovl:not(.intest) #app,body.ovl:not(.intest) .hdr,body.ovl:not(.intest) .bnav,body.ovl:not(.intest) .instbar{filter:blur(9px) saturate(1.15);opacity:.9;pointer-events:none}
/* side menu: a little more premium */
.drw{background:rgba(5,8,20,.42)}
.drp.sb{background:color-mix(in srgb,var(--bg) 94%,transparent)!important;border-right:1px solid var(--hair);box-shadow:24px 0 60px -20px rgba(0,0,0,.45)}
.drp .dri{animation:driIn .5s var(--ease) both}
.drp .dri:nth-child(1){animation-delay:.04s}.drp .dri:nth-child(2){animation-delay:.07s}.drp .dri:nth-child(3){animation-delay:.1s}.drp .dri:nth-child(4){animation-delay:.13s}.drp .dri:nth-child(5){animation-delay:.16s}.drp .dri:nth-child(6){animation-delay:.19s}.drp .dri:nth-child(7){animation-delay:.22s}.drp .dri:nth-child(8){animation-delay:.25s}.drp .dri:nth-child(n+9){animation-delay:.28s}
@keyframes driIn{from{opacity:0;transform:translate3d(-14px,0,0)}}
.sb .dri{transition:background .2s var(--ease),transform .3s var(--spring)}

.xey{display:block;font:700 11px var(--fb);letter-spacing:.3em;text-transform:uppercase;color:var(--mut);opacity:.7}

.xmy{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 8px 0 14px;border-radius:99px;border:1px solid var(--x-line);background:var(--x-card);color:var(--tx);font:700 13.5px var(--fb);cursor:pointer;box-shadow:var(--x-sh);flex:none}

.xs{display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 16px;border-radius:16px;background:var(--x-card);border:1px solid var(--x-line);box-shadow:var(--x-sh);color:var(--mut);transition:border-color .25s,box-shadow .25s}

body.tsq-on .xs .tsqx{display:grid}

.xpk{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:99px;border:0;background:var(--tx);color:var(--bg);font:700 13px var(--fb);cursor:pointer}
.xc{display:flex;gap:6px}.xc:empty{display:none}
.xc .chip{flex:none;height:38px;margin:0;padding:0 14px;border-radius:99px;border:1px solid var(--x-line);background:var(--x-card);color:var(--tx);font:600 13px var(--fb);cursor:pointer;display:inline-flex;align-items:center;box-shadow:none}
.xc .chip.on{background:var(--priSoft);border-color:transparent;color:var(--x-acc)}
.xcount{margin:24px 0 0;font:700 11px var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.xsec{margin-top:24px}
.xsh{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.xno{font:600 12px var(--fb);color:var(--x-lux);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.xsh h2{font:700 21px/1.1 var(--fh);letter-spacing:-.02em;margin:0}
.xn{font:700 12px var(--fb);color:var(--mut)}
.xsh button{margin-left:auto;border:0;background:none;color:var(--x-acc);font:700 13px var(--fb);display:inline-flex;align-items:center;gap:2px;cursor:pointer;padding:4px 0}
.xrow{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:2px 16px 16px;scroll-padding:0 16px;overscroll-behavior-x:contain}

@media(min-width:640px){.xgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:720px){.xrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;overflow:visible;margin:0;padding:0}.xrow>.xk{flex:none}}

/* series card */
.xk{display:flex;flex-direction:column;min-width:0;background:var(--x-card);border:1px solid var(--x-line);border-radius:var(--x-r4);padding:8px;box-shadow:var(--x-sh);cursor:pointer;animation:xUp .7s var(--x-e) both;animation-delay:var(--d,0ms);transition:transform .45s var(--x-e),box-shadow .45s var(--x-e)}

.xkb{padding:14px 8px 0;flex:1;display:flex;flex-direction:column;gap:6px}
.xkm{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:18px}
.xkm>span:first-child{font:700 10.5px var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xr{display:inline-flex;align-items:center;gap:3px;font:600 12px var(--fb);color:var(--mut);flex:none}
.xr svg{color:#f5a524;fill:#f5a524}.xr b{color:var(--tx)}

.xkx{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px}

.xkp{padding:14px 8px 6px;margin-top:14px;border-top:1px solid var(--x-line)}
.xp{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.xp b{font:700 24px/1 var(--fb);letter-spacing:-.03em;font-variant-numeric:tabular-nums}

.xp.free b{color:var(--ok)}.xp.free span{font-size:12.5px;color:var(--mut)}
.xka{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.xown{display:flex;align-items:center;gap:10px;width:100%;margin-top:26px;padding:14px 16px;border-radius:16px;border:1px dashed var(--bd);background:transparent;color:var(--tx);font:500 13.5px var(--fb);text-align:left;cursor:pointer}
.xown>svg:first-child{color:var(--ok)}.xown span{flex:1}
.xempty{text-align:center;padding:44px 20px;border:1px dashed var(--bd);border-radius:var(--x-r4);margin-top:18px}
.xempty-i{width:56px;height:56px;border-radius:18px;display:inline-grid;place-items:center;background:var(--x-sub);color:var(--mut);margin-bottom:12px}

.xempty p{margin:0 0 16px;color:var(--mut);font-size:14px}
.xempty.sm{padding:22px;margin-top:0}.xempty.sm p{margin:0}
/* my tests */
.xmine{display:grid;gap:14px;margin-top:14px}

.xm{display:grid;grid-template-columns:minmax(0,128px) minmax(0,1fr);gap:14px;align-items:center;background:var(--x-card);border:1px solid var(--x-line);border-radius:var(--x-r4);padding:10px;box-shadow:var(--x-sh);cursor:pointer;animation:xUp .6s var(--x-e) both;animation-delay:var(--d,0ms);transition:transform .45s var(--x-e),box-shadow .45s}

.xm .xi-f:before{inset:6px}.xm .xi-f b{font-size:22px}.xm .xi-f span{font-size:7px;letter-spacing:.2em}.xm .xi-f span:before,.xm .xi-f span:after,.xm .xi-f i{display:none}
.xmb{min-width:0;display:flex;flex-direction:column;gap:7px;align-items:flex-start}

.xmb .xbar{width:100%}
.xmm{display:flex;justify-content:space-between;width:100%;font-size:12px;color:var(--mut)}.xmm b{color:var(--tx)}
.xmn{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:11px 4px 2px;border-top:1px solid var(--x-line);font-size:13px;color:var(--mut)}
.xmn>svg:first-child{color:var(--x-acc)}.xmn b{color:var(--tx)}.xmn .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xst{display:inline-flex;align-items:center;gap:5px;font:800 10px var(--fb);letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:7px;background:var(--x-sub);color:var(--mut);flex:none;white-space:nowrap}
.xst.ok,.xst.free{background:var(--okSoft);color:var(--ok)}.xst.lk{background:var(--x-luxSoft);color:var(--x-luxTx)}
.xbar{display:block;height:6px;border-radius:6px;background:var(--x-sub);overflow:hidden}
.xbar i{display:block;height:100%;border-radius:6px;background:var(--x-accg);transition:width 1s var(--x-e)}
/* series page */
.xtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px}
.xback{display:inline-flex;align-items:center;gap:8px;min-width:0;height:40px;padding:0 16px 0 12px;border-radius:99px;background:var(--x-card);border:1px solid var(--x-line);box-shadow:var(--x-sh);color:var(--tx);text-decoration:none;font:600 14px var(--fb)}

.xib{width:40px;height:40px;flex:none;border-radius:99px;display:grid;place-items:center;border:1px solid var(--x-line);background:var(--x-card);color:var(--tx);cursor:pointer;box-shadow:var(--x-sh)}
.xhero{display:grid;gap:20px;animation:xUp .6s var(--x-e) both}
.xhf{padding:8px;background:var(--x-card);border:1px solid var(--x-line);border-radius:26px;box-shadow:var(--x-sh)}
.xhf .xi{border-radius:19px}
.xht{display:flex;flex-direction:column;gap:10px;min-width:0}
.xht .xkm>span:first-child{font:700 11px var(--fb);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.xht h1{font:700 var(--x-fs-h)/1.12 var(--fh);letter-spacing:-.025em;margin:0}
.xsub{margin:0;font:500 15px/1.5 var(--fb);color:var(--tx);opacity:.8}
.xhm{display:flex;flex-wrap:wrap;gap:6px 16px}

.xhm svg{color:var(--x-acc)}.xhm .xr svg{color:#f5a524}
.xdesc{margin:2px 0 0;font-size:14.5px;line-height:1.65;color:var(--mut);white-space:pre-line}
.xdesc.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.xmore{align-self:flex-start;border:0;background:none;padding:0;margin-top:-4px;color:var(--x-acc);font:700 13px var(--fb);cursor:pointer}
.xprog,.xbuy{margin-top:6px;background:var(--x-card);border:1px solid var(--x-line);border-radius:var(--x-r3);padding:16px;box-shadow:var(--x-sh)}
.xkk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.xkk>div{text-align:center;padding:2px 4px;border-left:1px solid var(--x-line);min-width:0}.xkk>div:first-child{border-left:0}
.xkk b{display:block;font:700 22px/1.15 var(--fb);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.xkk span{font:600 11px var(--fb);color:var(--mut)}
.xpg{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--x-line)}
.xpg .xbar{flex:1}.xpg span{font:700 12px var(--fb);color:var(--mut);white-space:nowrap}
.xbuy{border-color:color-mix(in srgb,var(--x-lux) 38%,var(--x-line));background:linear-gradient(180deg,color-mix(in srgb,var(--x-luxSoft) 75%,var(--x-card)),var(--x-card) 75%)}
.xbuyh{display:flex;flex-direction:column;gap:8px}
.xbuyh .xey{color:var(--x-luxTx);opacity:1;letter-spacing:.22em;font-size:10.5px}
.xbuy .xp{margin:0}.xbuy .xp b{font-size:30px}
.xbuy p{display:flex;gap:8px;margin:12px 0 14px;font-size:13.5px;line-height:1.55;color:var(--mut)}
.xbuy p svg{flex:none;margin-top:3px;color:var(--x-luxTx)}.xbuy p b{color:var(--tx);font-weight:700}
.xbuy .xka .xb{height:48px}
@media(min-width:860px){.xhero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:start}.xht{padding-top:4px}}
.xsv .mdc{margin-top:16px}
.xnext{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;margin-top:16px;padding:14px 14px 14px 16px;background:var(--x-card);border:1px solid var(--x-line);border-radius:var(--x-r3);box-shadow:var(--x-sh);animation:xUp .6s .08s var(--x-e) both}
.xnx-i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--priSoft);color:var(--x-acc)}
.xnext.live .xnx-i{background:var(--badSoft);color:var(--bad)}.xnext.prog .xnx-i{background:var(--warnSoft);color:var(--warn)}
.xnext .grow{flex:1 1 170px;min-width:0;display:flex;flex-direction:column;gap:3px}
.xnx-k{font:700 10.5px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.xnx-k [data-op]{color:var(--x-acc);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.xnext b{font:700 15.5px/1.3 var(--fb)}.xnext small{font-size:12.5px;color:var(--mut)}
.xnext>.xb,.xnext>.albtn{margin-left:auto}
.xtabs{position:sticky;top:64px;z-index:6;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));margin:26px 0 4px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--x-sub) 90%,transparent);border:1px solid var(--x-line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.xtabs button{position:relative;z-index:1;height:40px;padding:0 4px;border:0;border-radius:10px;background:none;color:var(--mut);font:700 13.5px var(--fb);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;transition:color .3s}
.xtabs button small{font-size:11px;font-weight:700;opacity:.65}
@media(max-width:380px){.xtabs button{font-size:12.5px}.xtabs button small{display:none}}
.xtabs button.on{color:var(--tx)}
.xtabs-i{position:absolute;z-index:0;left:4px;top:4px;bottom:4px;width:calc((100% - 8px)/var(--n));border-radius:10px;background:var(--x-card);box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px -4px rgba(0,0,0,.14);transform:translateX(calc(var(--i)*100%));transition:transform .45s var(--x-e)}
.xpanel{min-height:220px}
.xin{animation:xUp .45s var(--x-e)}
.xsh2{display:flex;align-items:baseline;gap:8px;margin:22px 2px 12px}
.xsh2 h3{margin:0;font:700 16px var(--fb);letter-spacing:-.01em}
.xsh2 span{font:700 12px var(--fb);color:var(--mut)}
/* folders */
.xfg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:720px){.xfg{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.xfg{grid-template-columns:repeat(4,minmax(0,1fr))}}
.xfo{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;padding:16px 16px 14px;border-radius:var(--x-r3);background:var(--x-card);border:1px solid var(--x-line);box-shadow:var(--x-sh);color:var(--tx);font:inherit;text-align:left;cursor:pointer;animation:xUp .55s var(--x-e) both;animation-delay:var(--d,0ms);transition:transform .45s var(--x-e),box-shadow .45s}

.xfo b{font:700 15px/1.3 var(--fb);letter-spacing:-.01em;overflow-wrap:anywhere}
